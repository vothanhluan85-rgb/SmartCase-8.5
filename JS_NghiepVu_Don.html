window.setValueSafe = function(id, val) {
  var el = document.getElementById(id);
  if (el) el.value = val !== undefined && val !== null ? val : "";
};

window.validateDonData = function(parties) {
  let warnings = [];
  let quanHeEl = document.getElementById('don_quanHe');
  let quanHe = quanHeEl ? quanHeEl.value.trim() : "";
  if (!quanHe || quanHe === "Tranh chấp / Yêu cầu theo đơn" || quanHe === "---") {
    warnings.push("- Chưa phân loại Quan hệ tranh chấp / Tội danh cụ thể.");
  }

  let missingDob = false;
  (parties || []).forEach(function(p) {
    if (p.xungHo !== "Tổ chức" && !p.namSinh) missingDob = true;
  });

  if (missingDob) warnings.push("- Có đương sự cá nhân chưa điền Năm sinh.");

  if (warnings.length > 0) {
    return "CẢNH BÁO THIẾU THÔNG TIN:\n" + warnings.join("\n") + "\n\nBạn có muốn tiếp tục xử lý không?";
  }
  return null;
};

window.handleDonPartyNameBlur = function(inputEl) {
  if (!inputEl) return;
  var val = inputEl.value.trim();
  
  var container = inputEl.closest('.member-item') || inputEl.closest('.q-party-item');
  if (container) {
    var selectEl = container.querySelector('.in-don-xungho') || container.querySelector('.q-in-xungho');
    if (selectEl && selectEl.value === 'Ông/Bà') {
      if (/^bà\s+/i.test(val)) selectEl.value = 'Bà';
      else if (/^ông\s+/i.test(val)) selectEl.value = 'Ông';
      else if (/^chị\s+/i.test(val)) selectEl.value = 'Bà';
      else if (/^anh\s+/i.test(val)) selectEl.value = 'Ông';
    }
  }

  var cleaned = typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(val) : val;
  var titled = typeof window.toTitleCase === 'function' ? window.toTitleCase(cleaned) : cleaned;
  inputEl.value = titled;
};

/**
 * OCR BÓC TÁCH ĐƠN KHỞI KIỆN TỰ ĐỘNG TỪ ẢNH / TỆP (MỤC 2 YÊU CẦU 28/10/2026)
 */
window.handleScanPetitionOCR = function(input) {
  if (!input.files || input.files.length === 0) return;
  var file = input.files[0];

  if (typeof AppUI !== 'undefined') AppUI.showToast("Trợ lý thẩm phán đang bóc tách nội dung đơn khởi kiện...", "");

  window.compressImageFile(file, 1600, 0.8, function(resFile) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (typeof AppUI !== 'undefined') AppUI.hideToast();
        if (res && res.success && res.data) {
          var d = res.data;

          if (d.soDon) window.setValueSafe('don_soDon', d.soDon);
          if (d.ngayNhan) window.setValueSafe('don_ngayNhan', d.ngayNhan);
          if (d.loaiAn) {
            window.setValueSafe('don_loaiAn', d.loaiAn);
            if (typeof window.updateQuanHeDatalist === 'function') window.updateQuanHeDatalist();
          }
          if (d.quanHe) window.setValueSafe('don_quanHe', d.quanHe);
          if (d.giaTri && d.giaTri !== "0") {
            window.setValueSafe('don_giaTri', String(d.giaTri).replace(/\B(?=(\d{3})+(?!\d))/g, "."));
            if (typeof window.calculateDonFee === 'function') window.calculateDonFee();
          }

          // Xóa các dòng đương sự cũ và nạp mới
          ['nkk', 'nbk', 'nlq'].forEach(function(t) { 
            var el = document.getElementById('don-party-list-' + t); 
            if (el) el.innerHTML = ""; 
          });

          var sec = document.getElementById('nlq-section');
          if (sec) sec.style.display = 'none';

          if (d.parties && Array.isArray(d.parties) && d.parties.length > 0) {
            var hasNKK = false, hasNBK = false;
            d.parties.forEach(function(p) {
              var tc = String(p.tuCach || "").toLowerCase();
              if (tc.includes('khởi kiện') || tc.includes('yêu cầu') || tc.includes('nguyên đơn')) {
                window.addPartyGroupV76('NKK', p);
                hasNKK = true;
              } else if (tc.includes('liên quan')) {
                window.addPartyGroupV76('NLQ', p);
                if (sec) sec.style.display = 'block';
              } else {
                window.addPartyGroupV76('NBK', p);
                hasNBK = true;
              }
            });

            if (!hasNKK) window.addPartyGroupV76('NKK');
            if (!hasNBK) window.addPartyGroupV76('NBK');
          }

          if (typeof AppUI !== 'undefined') AppUI.showToast("Bóc tách đơn khởi kiện thành công!", "success");
        } else {
          if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi OCR đơn", res ? res.error : "Không thể nhận diện nội dung đơn.");
        }
      })
      .withFailureHandler(function(err) {
        if (typeof AppUI !== 'undefined') {
          AppUI.hideToast();
          AppUI.showToast("Lỗi kết nối máy chủ: " + err.message, "error");
        }
      })
      .api_ParsePetitionScan(resFile.name, resFile.mimeType, resFile.base64);
  });
  input.value = "";
};

window.addMemberToGroup = function(containerOrBtn, textColor, memberData) {
  if (typeof memberData === 'string' && memberData === '[object Object]') memberData = {};
  else memberData = memberData || {};

  var container = (containerOrBtn instanceof HTMLElement && containerOrBtn.classList.contains('group-members-container'))
    ? containerOrBtn
    : containerOrBtn.closest(".don-party-group").querySelector(".group-members-container");

  var xhVal = memberData.xungHo || 'Ông/Bà';
  var rawHoTen = memberData.hoTen || '';
  var namSinh = memberData.namSinh || '';

  if ((!xhVal || xhVal === 'Ông/Bà') && rawHoTen) {
    if (/^bà\s+/i.test(rawHoTen)) xhVal = 'Bà';
    else if (/^ông\s+/i.test(rawHoTen)) xhVal = 'Ông';
    else if (/^chị\s+/i.test(rawHoTen)) xhVal = 'Chị';
    else if (/^anh\s+/i.test(rawHoTen)) xhVal = 'Anh';
  }

  var cleanHoTen = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(rawHoTen) : rawHoTen) : rawHoTen;

  var selOng = xhVal === 'Ông' ? 'selected' : '';
  var selBa = xhVal === 'Bà' ? 'selected' : '';
  var selTc = xhVal === 'Tổ chức' ? 'selected' : '';
  var selOngBa = (xhVal === 'Ông/Bà' || !xhVal) ? 'selected' : '';

  var safeHoTen = String(cleanHoTen || '').replace(/"/g, '&quot;');
  var safeNamSinh = String(namSinh || '').replace(/"/g, '&quot;');

  var memberHtmlArr = [
    '<div class="row g-2 member-item align-items-end mb-2 position-relative pe-4">',
    '  <button type="button" class="btn-delete-member btn btn-sm text-danger position-absolute" style="right: -10px; top: 22px; width: 20px; padding: 0; display: none; box-shadow:none;" onclick="this.closest(\'.member-item\').remove(); window.updateMemberDeleteButtons(this.closest(\'.group-members-container\'));">',
    '    <i class="fas fa-times"></i>',
    '  </button>',
    '  <div class="col-md-3 col-4">',
    '    <label class="small-label mb-1" style="font-size:10px; font-weight:700; color:', textColor, '">Danh xưng *</label>',
    '    <select class="form-select form-select-sm in-don-xungho text-dark fw-bold" style="border-color:#cbd5e1;">',
    '      <option value="Ông/Bà" ', selOngBa, '>Ông/Bà</option>',
    '      <option value="Ông" ', selOng, '>Ông</option>',
    '      <option value="Bà" ', selBa, '>Bà</option>',
    '      <option value="Tổ chức" ', selTc, '>Tổ chức</option>',
    '    </select>',

window.moChiTietDon = function(idDon) {
  if (!idDon) return;
  let donRAM = typeof window.G_Don !== 'undefined' ? window.G_Don.find(function(d) { return d.id === idDon; }) : null;

  if (donRAM) {
    window.setValueSafe('don_id', donRAM.id);
    window.setValueSafe('don_soDon', donRAM.soDon);
    
    let elSoDon = document.getElementById('don_soDon');
    let elNgayNhan = document.getElementById('don_ngayNhan');
    if (elSoDon) { elSoDon.readOnly = true; elSoDon.classList.add('bg-light', 'text-muted'); }
    if (elNgayNhan) { elNgayNhan.readOnly = true; elNgayNhan.classList.add('bg-light', 'text-muted'); elNgayNhan.style.pointerEvents = 'none'; }

    window.setValueSafe('don_loaiAn', donRAM.loaiAn || "2. Dân sự");
    window.updateQuanHeDatalist();
    window.setValueSafe('don_quanHe', donRAM.quanHe);
    window.setValueSafe('don_thamPhan', donRAM.thamPhan);

    var dYmd = typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD(donRAM.rawDate) : "";
    window.setValueSafe('don_ngayNhan', dYmd);
    window.setValueSafe('don_process_ngayBanHanh', typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD() : "");

    window.setValueSafe('don_giaTri', String(donRAM.giaTri || "0").replace(/\B(?=(\d{3})+(?!\d))/g, "."));
    window.setValueSafe('don_tamUngValue', donRAM.tamUng || "0");

    let ghiChuVal = String(donRAM.ghiChu || "").trim();
    if (ghiChuVal === "Đồng bộ từ Sổ gốc") ghiChuVal = "";
    window.setValueSafe('don_ghiChu', ghiChuVal);

    var cardNote = document.getElementById('don_ghiChu_card');
    if (ghiChuVal !== "") { if (cardNote) { cardNote.classList.remove('note-empty'); cardNote.classList.add('note-filled'); } } 
    else { if (cardNote) { cardNote.classList.remove('note-filled'); cardNote.classList.add('note-empty'); } }

    if (document.getElementById('don_trangThai_display')) document.getElementById('don_trangThai_display').value = donRAM.trangThai || "Chưa xử lý";
    if (document.getElementById('don_res_tamUng')) document.getElementById('don_res_tamUng').value = String(donRAM.tamUng || "0").replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    let ht = document.getElementById('don_header_title');
    if (ht) ht.innerHTML = "CHI TIẾT HỒ SƠ ĐƠN";

    ['nkk', 'nbk', 'nlq'].forEach(function(t) { 
      let el = document.getElementById('don-party-list-' + t); 
      if(el) el.innerHTML = ""; 
    });

    var sec = document.getElementById('nlq-section');
    if (sec) sec.style.display = 'none';

    if (donRAM.chiTietDuongSu && donRAM.chiTietDuongSu.length > 0) {
      let groups = [];
      donRAM.chiTietDuongSu.forEach(function(d) {
        let roleLower = String(d.tuCach || "").toLowerCase();
        let type = '';
        if (roleLower.includes('khởi kiện') || roleLower.includes('yêu cầu') || roleLower.includes('bị hại') || roleLower.includes('nguyên đơn')) type = 'NKK';
        else if (roleLower.includes('liên quan')) type = 'NLQ';
        else type = 'NBK';

        let addrKey = (d.diaChi || "").trim().toLowerCase();
        let found = addrKey ? groups.find(function(g) { return g.type === type && (g.diaChi || "").trim().toLowerCase() === addrKey; }) : null;
        if (found) { 
          found.members.push(d); 
        } else { 
          groups.push({ type: type, diaChi: d.diaChi || "", sdt: d.sdt || "", cccd: d.cccd || "", members: [d] }); 
        }
      });

      groups.forEach(function(g) {
        window.addPartyGroupV76(g.type, g.members);
        if (g.type === 'NLQ' && sec) sec.style.display = 'block';
      });
    }

    let nkkList = document.getElementById('don-party-list-nkk');
    let nbkList = document.getElementById('don-party-list-nbk');

    if (nkkList && nkkList.innerHTML.trim() === "") window.addPartyGroupV76('NKK');
    if (nbkList && nbkList.innerHTML.trim() === "") window.addPartyGroupV76('NBK');

    window.CURRENT_APP_CONTEXT = { scope: "DON", caseInfo: null, caseParties: [], donInfo: donRAM };
    if (typeof window.updateCopilotScopeBadge === 'function') window.updateCopilotScopeBadge();

    window.loadDonTemplatesForSelect();
    if (typeof appNavigate === 'function') appNavigate('view-chi-tiet-don');
  } else { 
    if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi", "Không tìm thấy dữ liệu đơn trong bộ nhớ tạm."); 
  }
};

  var donStartEl = document.getElementById('don_filter_start');

window.triggerDonSearch = function() {
  clearTimeout(window.searchDonTimeout);
  window.searchDonTimeout = setTimeout(function() { window.runFilterDonEngine(); }, 300);
};

window.runFilterDonEngine = function(isFromLoad) {
  if (isFromLoad === undefined) isFromLoad = false;
  if (!isFromLoad && typeof event !== 'undefined' && event && event.target && (event.target.id === 'don_filter_start' || event.target.id === 'don_filter_end')) {
    window.loadDanhSachDon(true);
    return; 
  }

  if (!window.G_Don || window.G_Don.length === 0) {
    if (typeof window.renderDonTable === 'function') window.renderDonTable([]);
    return;
  }

  var donSearchEl = document.getElementById('don_txtSearch');
  var q = donSearchEl ? (typeof window.removeAccents === 'function' ? window.removeAccents(String(donSearchEl.value).toLowerCase().trim()) : String(donSearchEl.value).toLowerCase().trim()) : "";
  var currentTab = window.currentDonStatusTab || 'ALL';
  
  var displayList = [];

  for (var i = 0; i < window.G_Don.length; i++) {
    var don = window.G_Don[i];
    var ttLower = String(don.trangThai || "").toLowerCase();

    if (currentTab !== 'ALL') {
      if (currentTab === 'CHUA_XU_LY' && !(ttLower === 'chưa xử lý' || ttLower === 'đang xem xét' || ttLower === '')) continue;
      if (currentTab === 'BO_SUNG' && !ttLower.includes('bổ sung') && !ttLower.includes('sửa đổi')) continue;
      if (currentTab === 'DA_HEN_SMS' && !ttLower.includes('hẹn') && !ttLower.includes('sms')) continue;
      if (currentTab === 'HGDT' && !ttLower.includes('hòa giải') && !ttLower.includes('đối thoại')) continue;
      if (currentTab === 'DA_THU_LY' && !ttLower.includes('thụ lý')) continue;
      if (currentTab === 'DA_XONG' && !ttLower.includes('xong') && !ttLower.includes('trả lại') && !ttLower.includes('chuyển đơn')) continue;
    }

    if (q) {
      var strSoDon = typeof window.removeAccents === 'function' ? window.removeAccents(String(don.soDon || "").toLowerCase()) : String(don.soDon || "").toLowerCase();
      var strNKK = typeof window.removeAccents === 'function' ? window.removeAccents(String(don.nguoiKhoiKien || "").toLowerCase()) : String(don.nguoiKhoiKien || "").toLowerCase();
      var strNBK = typeof window.removeAccents === 'function' ? window.removeAccents(String(don.nguoiBiKien || "").toLowerCase()) : String(don.nguoiBiKien || "").toLowerCase();
      var strQH = typeof window.removeAccents === 'function' ? window.removeAccents(String(don.quanHe || "").toLowerCase()) : String(don.quanHe || "").toLowerCase();
      var strTP = typeof window.removeAccents === 'function' ? window.removeAccents(String(don.thamPhan || "").toLowerCase()) : String(don.thamPhan || "").toLowerCase();

      if (strSoDon.indexOf(q) === -1 && strNKK.indexOf(q) === -1 && strNBK.indexOf(q) === -1 && strQH.indexOf(q) === -1 && strTP.indexOf(q) === -1) {
        continue;
      }
    }

    displayList.push(don);
  }

  if (typeof window.renderDonTable === 'function') window.renderDonTable(displayList);
};

window.renderDonTable = function(data) {
  var tbody = document.getElementById('don-list-data');
  if (!tbody) return;
  if (!data || data.length === 0) {
    tbody.innerHTML = "<tr><td colspan='7' class='text-center p-5 text-muted small'><i class='fas fa-box-open fa-2x mb-2 d-block opacity-50'></i>Không có dữ liệu đơn phù hợp với bộ lọc.</td></tr>";
    return;
  }

  var totalData = data.length;
  var htmlRows = [];

  data.slice(0, 100).forEach(function(don) {
    try {
      var badgeClass = "text-secondary border-secondary";
      var tt = String(don.trangThai || "").toLowerCase();

      if (tt.includes("đã thụ lý")) badgeClass = "text-success border-success bg-success-subtle";
      else if (tt.includes("đang xem xét") || tt.includes("chờ ra") || tt.includes("báo xử lý")) badgeClass = "text-primary border-primary bg-primary-subtle";
      else if (tt.includes("hẹn làm việc") || tt.includes("sms") || tt.includes("hướng dẫn")) badgeClass = "text-info border-info bg-info-subtle";
      else if (tt.includes("chuyển hòa giải đối thoại") || tt.includes("lựa chọn hòa giải")) badgeClass = "text-info border-info bg-info-subtle";
      else if (tt.includes("trả lại") || tt.includes("chuyển đơn")) badgeClass = "text-dark border-dark bg-dark-subtle";
      else if (tt.includes("bổ sung") || tt.includes("làm rõ")) badgeClass = "text-warning-emphasis border-warning bg-warning-subtle";
      else if (tt.includes("đã xử lý xong")) badgeClass = "text-success border-success bg-success-subtle";

      var warningStyle = "border-left: 4px solid #0dcaf0;";
      if (!tt.includes("thụ lý") && !tt.includes("trả") && !tt.includes("chuyển") && !tt.includes("xử lý xong") && !tt.includes("hòa giải")) {
        if (((new Date().getTime() - don.rawDate) / 86400000) >= 8) warningStyle = "border-left: 4px solid #ef4444;";
      }

      let nkkHtml = "---", nbkHtml = "---";
      if (don.chiTietDuongSu && don.chiTietDuongSu.length > 0) {
        let nkks = don.chiTietDuongSu.filter(function(d) {
          let tc = String(d.tuCach || "").toLowerCase();
          return tc.includes('khởi kiện') || tc.includes('yêu cầu') || tc.includes('bị hại') || tc.includes('nguyên đơn');
        });
        let nbks = don.chiTietDuongSu.filter(function(d) {
          let tc = String(d.tuCach || "").toLowerCase();
          return tc.includes('bị kiện') || tc.includes('bị cáo') || tc.includes('bị đơn');
        });

        nkkHtml = nkks.map(function(d) {
          let cleanNkk = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(d.hoTen) : d.hoTen) : (d.hoTen || 'Chưa rõ');
          let phoneText = d.sdt ? '<br><i class="fas fa-phone-alt me-1"></i>' + (typeof window.formatPhoneNumber === 'function' ? window.formatPhoneNumber(d.sdt) : d.sdt) : '';
          var sArr = [
            '<div class="fw-bold text-danger" style="font-size:12px;">', cleanNkk, '</div>',
            '<div class="text-muted mt-1" style="font-size:10px; line-height:1.4;">',
            (d.namSinh ? 'SN: '+d.namSinh+'<br>' : ''), (d.diaChi || ''), phoneText,
            '</div>'
          ];
          return sArr.join('');
        }).join('<hr class="my-2 border-secondary" style="opacity: 0.2">');

        nbkHtml = nbks.map(function(d) {
          let cleanNbk = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(d.hoTen) : d.hoTen) : (d.hoTen || 'Chưa rõ');
          let phoneText = d.sdt ? '<br><i class="fas fa-phone-alt me-1"></i>' + (typeof window.formatPhoneNumber === 'function' ? window.formatPhoneNumber(d.sdt) : d.sdt) : '';
          var sArr = [
            '<div class="fw-bold text-dark" style="font-size:12px;">', cleanNbk, '</div>',
            '<div class="text-muted mt-1" style="font-size:10px; line-height:1.4;">',
            (d.namSinh ? 'SN: '+d.namSinh+'<br>' : ''), (d.diaChi || ''), phoneText,
            '</div>'
          ];
          return sArr.join('');
        }).join('<hr class="my-2 border-secondary" style="opacity: 0.2">');
      } else {
        let cleanNkkStr = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(don.nguoiKhoiKien) : don.nguoiKhoiKien) : (don.nguoiKhoiKien || '---');
        let cleanNbkStr = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(don.nguoiBiKien) : don.nguoiBiKien) : (don.nguoiBiKien || '---');
        nkkHtml = '<div class="fw-bold text-danger" style="font-size: 12px;">' + cleanNkkStr + '</div>';
        nbkHtml = '<div class="fw-bold text-dark" style="font-size: 12px;">' + cleanNbkStr + '</div>';
      }

      let ghiChuIcon = "";
      let ghiChuVal = String(don.ghiChu || "").trim();
      if (ghiChuVal !== "" && ghiChuVal !== "Đồng bộ từ Sổ gốc") {
        ghiChuIcon = '<i class="fas fa-sticky-note text-warning ms-2 shadow-sm" style="cursor:pointer; font-size:13px;" title="Xem/Sửa Ghi chú" onclick="event.stopPropagation(); window.openNoteModal(\'' + don.id + '\');"></i>';
      }

      var trArr = [
        '<tr style="cursor: pointer; transition: background 0.2s; ', warningStyle, '" onclick="window.moChiTietDon(\'', don.id, '\')" class="hover-row-elegant">',
        '  <td class="ps-3 text-center" onclick="event.stopPropagation();">',
        '    <input type="checkbox" class="form-check-input don-select-checkbox shadow-sm" value="', don.id, '" onclick="window.toggleBulkDonButton()" style="cursor: pointer; width: 1.1rem; height: 1.1rem;">',
        '  </td>',
        '  <td class="ps-2">',
        '    <div class="fw-bolder text-dark d-flex align-items-center" style="font-size:13px">', (don.soDon || '---'), ' ', ghiChuIcon, '</div>',
        '    <div class="text-secondary fw-bold mt-1" style="font-size:11px;"><i class="far fa-calendar-alt me-1"></i>', don.ngayNhan, '</div>',
        '  </td>',
        '  <td>', nkkHtml, '</td>',
        '  <td>', nbkHtml, '</td>',
        '  <td>',
        '    <div class="text-dark fw-bold text-wrap" style="font-size: 12px; max-width: 250px;">', (don.quanHe || '---'), '</div>',
        '    <div class="text-muted fst-italic mt-1" style="font-size:10px">', (don.loaiAn || '---'), '</div>',
        '  </td>',
        '  <td>',
        '    <div class="fw-bold text-primary" style="font-size: 11px;">', (don.thamPhan || 'Chưa PC'), '</div>',
        '  </td>',
        '  <td class="text-center" onclick="event.stopPropagation();">',
        '    <div class="badge border ', badgeClass, ' w-100 mb-2 text-wrap" style="font-size: 10px; padding: 4px 0; border-radius: 4px; line-height:1.2;">', (don.trangThai || 'Chưa xử lý'), '</div>',
        '    <div class="d-flex align-items-center justify-content-center gap-1">',
        '      <button class="btn btn-sm btn-light border shadow-sm p-1 d-flex align-items-center justify-content-center" style="width:26px; height:26px; border-radius:6px;" onclick="event.stopPropagation(); window.chuyenDonSangThuLy(\'', don.id, '\')" title="Thụ lý thành Vụ án"><i class="fas fa-folder-plus text-success" style="font-size:11px;"></i></button>',
        '      <button class="btn btn-sm btn-light border shadow-sm p-1 d-flex align-items-center justify-content-center" style="width:26px; height:26px; border-radius:6px;" onclick="event.stopPropagation(); window.openQuickDraftDon(\'', don.id, '\')" title="Soạn văn bản"><i class="fas fa-file-word text-primary" style="font-size:11px;"></i></button>',
        '      <button class="btn btn-sm btn-light border shadow-sm p-1 d-flex align-items-center justify-content-center" style="width:26px; height:26px; border-radius:6px;" onclick="event.stopPropagation(); window.sendQuickSMS(\'', don.id, '\')" title="Hẹn lịch & Nhắn tin"><i class="fas fa-sms text-info" style="font-size:11px;"></i></button>',

        '    </div>',
        '  </td>',
        '</tr>'
      ];
      htmlRows.push(trArr.join(''));
    } catch (ex) {
      console.error("Lỗi vẽ dòng Đơn:", don, ex);
    }
  });

  if (totalData > 100) {

  }
  tbody.innerHTML = htmlRows.join('');
};

window.luuThongTinDon = function(isAutoSave) {
  if (isAutoSave === undefined) isAutoSave = false;

  var p = {
    info: {
      id: document.getElementById('don_id').value,
      soDon: document.getElementById('don_soDon').value.trim(),
      ngayNhan: document.getElementById('don_ngayNhan').value,
      loaiAn: document.getElementById('don_loaiAn').value,
      quanHe: document.getElementById('don_quanHe').value.trim(),
      thamPhan: document.getElementById('don_thamPhan').value.trim() || "Chưa phân công",
      giaTri: String(document.getElementById('don_giaTri').value).replace(/\./g, ''),
      tamUng: document.getElementById('don_tamUngValue').value,
      huongXuLy: document.getElementById('don_trangThai_display').value,
      trangThai: document.getElementById('don_trangThai_display').value,
      ghiChu: document.getElementById('don_ghiChu').value.trim()
    },
    ds: []
  };

  if (!p.info.soDon) {
    if (isAutoSave) return;
    if (typeof AppUI !== 'undefined') return AppUI.alert("Cảnh báo", "Vui lòng nhập Số đơn!");
  }

  var nkkArr = [], nbkArr = [];
  let oldDsMap = {};
  if (p.info.id && !p.info.id.includes("TEMP_") && typeof window.G_Don !== 'undefined') {
    let donHienTai = window.G_Don.find(function(d) { return d.id === p.info.id; });
    if (donHienTai && donHienTai.chiTietDuongSu) {
      donHienTai.chiTietDuongSu.forEach(function(d) { oldDsMap[d.hoTen + "_" + d.tuCach] = d.daiDien || ""; });
    }
  }

  document.querySelectorAll('.don-party-group').forEach(function(g) {
    var tuCach = g.querySelector('.in-don-tucach').value;
    var diaChi = g.querySelector('.in-don-diachi').value.trim();
    var sdt = g.querySelector('.in-don-sdt').value.trim();
    var cccd = g.querySelector('.in-don-cccd').value.trim();

    g.querySelectorAll('.member-item').forEach(function(m) {
      var inputHoTen = m.querySelector('.in-don-hoten');
      var rawHoTen = inputHoTen ? inputHoTen.value.trim() : "";

      if (rawHoTen) {
        var hoTen = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(rawHoTen) : rawHoTen) : rawHoTen;
        if (inputHoTen) inputHoTen.value = hoTen;

        var xungHoSelect = m.querySelector('.in-don-xungho');
        var xungHo = xungHoSelect ? xungHoSelect.value : 'Ông/Bà';

        if (xungHo === 'Ông/Bà') {
          if (/^bà\s+/i.test(rawHoTen)) { xungHo = 'Bà'; if (xungHoSelect) xungHoSelect.value = 'Bà'; }
          else if (/^ông\s+/i.test(rawHoTen)) { xungHo = 'Ông'; if (xungHoSelect) xungHoSelect.value = 'Ông'; }
        }

        var namSinh = m.querySelector('.in-don-namsinh').value.trim();
        let tcLower = String(tuCach).toLowerCase();
        if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn')) {
          nkkArr.push(hoTen);
        } else if (!tcLower.includes('liên quan')) {
          nbkArr.push(hoTen);
        }

        let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";
        p.ds.push({ 
          tuCach: tuCach, 
          xungHo: xungHo, 
          hoTen: hoTen, 
          namSinh: namSinh, 
          diaChi: diaChi, 
          sdt: sdt, 
          cccd: cccd, 
          daiDien: daiDienCu 
        });
      }
    });
  });

  let warningMsg = window.validateDonData(p.ds);

  const proceedSave = function() {
    let isNew = !p.info.id || p.info.id.includes("TEMP_");
    if (!isAutoSave && typeof AppUI !== 'undefined') AppUI.showToast("Đang lưu dữ liệu...", "");

    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    if (p.info.id && typeof window.G_Don !== 'undefined') {
      let index = window.G_Don.findIndex(function(d) { return d.id === p.info.id; });
      if (index > -1) {
        window.G_Don[index].soDon = p.info.soDon; 
        window.G_Don[index].ngayNhan = dateVn; 
        window.G_Don[index].rawDate = rawDateTs;
        window.G_Don[index].loaiAn = p.info.loaiAn; 
        window.G_Don[index].quanHe = p.info.quanHe; 
        window.G_Don[index].thamPhan = p.info.thamPhan;
        window.G_Don[index].trangThai = p.info.trangThai; 
        window.G_Don[index].huongXuLy = p.info.huongXuLy; 
        window.G_Don[index].ghiChu = p.info.ghiChu;
        window.G_Don[index].nguoiKhoiKien = nkkArr.join(", "); 
        window.G_Don[index].nguoiBiKien = nbkArr.join(", "); 
        window.G_Don[index].chiTietDuongSu = p.ds;
      }
    } else {
      p.info.id = "TEMP_" + new Date().getTime(); 
      document.getElementById('don_id').value = p.info.id;
      window.G_Don.unshift({
        id: p.info.id, 
        soDon: p.info.soDon, 
        ngayNhan: dateVn, 
        rawDate: rawDateTs,
        loaiAn: p.info.loaiAn, 
        quanHe: p.info.quanHe, 
        thamPhan: p.info.thamPhan, 
        huongXuLy: p.info.huongXuLy, 
        trangThai: p.info.trangThai, 
        ghiChu: p.info.ghiChu,
        nguoiKhoiKien: nkkArr.join(", "), 
        nguoiBiKien: nbkArr.join(", "), 
        chiTietDuongSu: p.ds
      });
    }
    
    if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine(); 

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          if (isNew && res.idDon) {
            document.getElementById('don_id').value = res.idDon;
            let tmpIndex = window.G_Don.findIndex(function(d) { return d.id === p.info.id; });
            if (tmpIndex > -1) window.G_Don[tmpIndex].id = res.idDon; 
          }
          if (isAutoSave) {
            let indicator = document.getElementById('don_autosave_indicator');
            if (indicator) {
              indicator.innerHTML = '<i class="fas fa-check text-success me-1"></i> <span class="text-success">Đã tự động lưu</span>';
              setTimeout(function() { if (indicator) indicator.innerHTML = ''; }, 3000);
            }
          } else {
            if (typeof AppUI !== 'undefined') AppUI.showToast("Lưu thành công!", "success");
          }
        } else { 
          if (!isAutoSave && typeof AppUI !== 'undefined') AppUI.alert("Lỗi", res.error); 
        }
      })
      .api_LuuThongTinDon(p);
  };

  if (warningMsg && !isAutoSave && typeof AppUI !== 'undefined') AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedSave);
  else proceedSave();
};

window.executeFastSMS = function() {
  let idDon = document.getElementById('sms_target_id').value;
  let phoneRaw = document.getElementById('sms_target_phone').value;
  let fullName = document.getElementById('sms_target_name').value;
  let soDon = document.getElementById('sms_target_sodon').value;

  let date = document.getElementById('sms_date').value;
  let time = document.getElementById('sms_time').value;

  if (!date || !time) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi", "Vui lòng chọn Ngày và Giờ hẹn làm việc.");
    return;
  }

  window.smsStickyData.date = date;
  window.smsStickyData.time = time;

  let dParts = date.split('-');
  let dateVn = dParts[2] + "/" + dParts[1] + "/" + dParts[0];

  let cleanName = typeof window.removeAccents === 'function' ? window.removeAccents(fullName) : fullName;
  let phone = typeof window.formatPhoneNumber === 'function' ? window.formatPhoneNumber(phoneRaw) : phoneRaw;

  let donIdx = window.G_Don.findIndex(function(d) { return d.id === idDon; });
  let ngayNhanDon = donIdx > -1 ? window.G_Don[donIdx].ngayNhan : "";
  let targetDon = donIdx > -1 ? window.G_Don[donIdx] : null;

  let msg = "TAND Khu vuc 2 - Lam Dong thong bao: Da nhan don cua " + cleanName + " (So don: " + soDon + (ngayNhanDon ? " - " + ngayNhanDon : "") + "). Vui long lien he To Hanh chinh tu phap - Van phong Toa an " + time + " ngay " + dateVn + " de duoc huong dan. Luu y: He thong khong nhan cuoc goi hoac tin nhan phan hoi.";

  let linkSms = "sms:" + phone + "?body=" + encodeURIComponent(msg);
  let a = document.createElement('a');
  a.href = linkSms;
  a.target = "_top";
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { if (document.body.contains(a)) document.body.removeChild(a); }, 1000);

  if (typeof bootstrap !== 'undefined') {
    let m = bootstrap.Modal.getInstance(document.getElementById('modalFastSMS'));
    if (m) m.hide();
  }

  if (donIdx > -1) {
    window.G_Don[donIdx].trangThai = "Đã hẹn làm việc";
    if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine();
    
    let statusSelect = document.getElementById('don_trangThai_display');
    if (statusSelect && document.getElementById('don_id').value === idDon) {
      statusSelect.value = "Đã hẹn làm việc";
    }

    let payloadUpdate = {
      info: Object.assign({}, window.G_Don[donIdx], { id: idDon, trangThai: "Đã hẹn làm việc" }),
      ds: window.G_Don[donIdx].chiTietDuongSu
    };
    google.script.run.api_LuuThongTinDon(payloadUpdate);
  }

  // TIÊU ĐỀ LỊCH ĐƠN RÚT GỌN CHUẨN: "Báo đơn [Số đơn] – [Tên NKK] – [Tên NBK]"
  var nkkShort = fullName;
  var nbkShort = targetDon ? (targetDon.nguoiBiKien || "") : "";
  var scheduleTitle = (typeof window.buildDonScheduleTitle === 'function')
    ? window.buildDonScheduleTitle(soDon, nkkShort, nbkShort)
    : `Báo đơn ${String(soDon).split('/')[0]} – ${(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(nkkShort) : nkkShort).split(/\s+/).pop()} – ${(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(nbkShort) : nbkShort).split(/\s+/).pop()}`;

window.executeBulkDonAction = function() {

  let buttonsHtml = "";
  let payloadsForServer = [];

  window.bulkSelectedDons.forEach(function(don) {
    let donToUpdate = JSON.parse(JSON.stringify(don));
    donToUpdate.trangThai = "Đã hẹn làm việc";
    payloadsForServer.push({
      info: donToUpdate,
      ds: donToUpdate.chiTietDuongSu
    });

    let nkkList = (don.chiTietDuongSu || []).filter(function(d) {
      let tcLower = String(d.tuCach || "").toLowerCase();
      return tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn');
    });

    if (nkkList.length > 0 && nkkList[0].sdt) {
      let phone = typeof window.formatPhoneNumber === 'function' ? window.formatPhoneNumber(nkkList[0].sdt) : nkkList[0].sdt;
      let name = nkkList[0].hoTen;
      let dateVnFormat = date.split('-').reverse().join('/');

      let msg = template.replace(/\[TenDuongSu\]/g, typeof window.removeAccents === 'function' ? window.removeAccents(name) : name)
                        .replace(/\[SoDon\]/g, don.soDon)
                        .replace(/\[NgayNhan\]/g, don.ngayNhan)
                        .replace(/\[NgayHen\]/g, dateVnFormat)
                        .replace(/\[GioHen\]/g, time)
                        .replace(/\[DiaDiem\]/g, typeof window.removeAccents === 'function' ? window.removeAccents(loc) : loc);

      let linkSms = "sms:" + phone + "?body=" + encodeURIComponent(msg);

      var btnArr = [
      "<a href=\"", linkSms, "\" target=\"_top\" class=\"btn btn-outline-success btn-sm w-100 mb-2 d-flex justify-content-between align-items-center\" onclick=\"this.classList.replace('btn-outline-success', 'btn-secondary')\">",
      "  <span><i class=\"fas fa-sms me-2\"></i>Gửi ", name, "</span>",
      "  <span class=\"badge bg-success\">", phone, "</span>",
      "</a>"
      ];
      buttonsHtml += btnArr.join('');
    }
  });

  payloadsForServer.forEach(function(p) {
    let idx = window.G_Don.findIndex(function(d) { return d.id === p.info.id; });
    if (idx > -1) window.G_Don[idx].trangThai = "Đã hẹn làm việc";
  });
  if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine();

  google.script.run.api_LuuNhieuDon_Bulk(payloadsForServer);
  google.script.run.api_LuuLichMoi_Logic({ idVuAn: "GENERAL", ngay: date, gio: time, noiDung: lichContent });

  setTimeout(function() {
    if (typeof AppUI !== 'undefined') {
      AppUI.hideToast();
      AppUI.alert("Hoàn tất Lưu Lịch!", "Đã cập nhật trạng thái đơn. Bấm vào các nút dưới đây để mở ứng dụng gửi tin nhắn cho từng người:<br><br><div style='max-height: 250px; overflow-y:auto; padding-right: 5px;'>" + buttonsHtml + "</div>");
    }

window.addQuickPartyRow = function(type, dData) {
  if (dData === undefined) dData = null;
  let container = document.getElementById('quick-party-' + type.toLowerCase());
  if (!container) return;

  let tcMap = {
    'NKK': 'Người khởi kiện', 
    'NBK': 'Người bị kiện', 
    'NLQ': 'Người có quyền lợi, nghĩa vụ liên quan'
  };
  let tc = tcMap[type] || 'Người khởi kiện';

  var xhVal = dData ? (dData.xungHo || 'Ông/Bà') : 'Ông/Bà';
  var rawHoTen = dData ? (dData.hoTen || '') : '';
  var namSinh = dData ? (dData.namSinh || '') : '';
  var diaChi = dData ? (dData.diaChi || '') : '';

  if ((!xhVal || xhVal === 'Ông/Bà') && rawHoTen) {
    if (/^bà\s+/i.test(rawHoTen)) xhVal = 'Bà';
    else if (/^ông\s+/i.test(rawHoTen)) xhVal = 'Ông';
    else if (/^chị\s+/i.test(rawHoTen)) xhVal = 'Chị';
    else if (/^anh\s+/i.test(rawHoTen)) xhVal = 'Anh';
  }

  var cleanHoTen = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(rawHoTen) : rawHoTen) : rawHoTen;

  var selOng = xhVal === 'Ông' ? 'selected' : '';
  var selBa = xhVal === 'Bà' ? 'selected' : '';
  var selTc = xhVal === 'Tổ chức' ? 'selected' : '';
  var selOngBa = (xhVal === 'Ông/Bà' || !xhVal) ? 'selected' : '';

  var safeHoTen = String(cleanHoTen || '').replace(/"/g, '&quot;');
  var safeNamSinh = String(namSinh || '').replace(/"/g, '&quot;');
  var safeDiaChi = String(diaChi || '').replace(/"/g, '&quot;');

  var htmlArr = [
  "<div class=\"row g-2 q-party-item position-relative mb-2 pb-2 border-bottom\">",
  "  <input type=\"hidden\" class=\"q-in-tucach\" value=\"", tc, "\">",
  "  <div class=\"col-3\">",
  "    <select class=\"form-select form-select-sm q-in-xungho text-dark fw-bold\">",
  "      <option value='Ông/Bà' ", selOngBa, ">Ông/Bà</option>",
  "      <option value='Ông' ", selOng, ">Ông</option>",
  "      <option value='Bà' ", selBa, ">Bà</option>",
  "      <option value='Tổ chức' ", selTc, ">Tổ chức</option>",
  "    </select>",
  "  </div>",
  "  <div class=\"col-6\">",
  "    <input type=\"text\" class=\"form-control form-control-sm fw-bold q-in-hoten text-dark bg-white shadow-sm\" ",
  "      placeholder=\"Họ và tên...\" ",
  "      value=\"", safeHoTen, "\"",
  "      onblur=\"window.handleDonPartyNameBlur(this)\">",
  "  </div>",
  "  <div class=\"col-3\">",
  "    <input type=\"text\" class=\"form-control form-control-sm q-in-namsinh text-dark bg-white shadow-sm\" placeholder=\"Năm sinh\" value=\"", safeNamSinh, "\">",
  "  </div>",
  "  <div class=\"col-12\">",
  "    <input type=\"text\" class=\"form-control form-control-sm q-in-diachi text-dark bg-white shadow-sm\" placeholder=\"Địa chỉ...\" value=\"", safeDiaChi, "\">",
  "  </div>",
  "  <button type=\"button\" class=\"btn btn-sm text-danger position-absolute\" style=\"right:-10px; top:-5px; box-shadow:none;\" onclick=\"this.closest('.q-party-item').remove()\">",
  "    <i class=\"fas fa-times\"></i>",
  "  </button>",
  "</div>"
  ];

  var div = document.createElement('div');
  div.innerHTML = htmlArr.join('');
  container.appendChild(div.firstElementChild);
};

window.saveQuickEditDon = function(openDraftModal) {
  var p = {
    info: {
      id: document.getElementById('quick_don_id').value,
      soDon: document.getElementById('quick_don_so').value.trim(),
      ngayNhan: document.getElementById('quick_don_ngay').value,
      loaiAn: document.getElementById('quick_don_loaiAn').value,
      quanHe: document.getElementById('quick_don_quanHe').value.trim(),
      thamPhan: document.getElementById('quick_don_thamPhan').value.trim(),
      huongXuLy: document.getElementById('quick_don_trangThai').value,
      trangThai: document.getElementById('quick_don_trangThai').value,
      ghiChu: ""
    },
    ds: []
  };

  let donRAM = window.G_Don.find(function(d) { return d.id === p.info.id; });
  if (donRAM) p.info.ghiChu = donRAM.ghiChu;

  let oldDsMap = {};
  if (donRAM && donRAM.chiTietDuongSu) {
    donRAM.chiTietDuongSu.forEach(function(d) {
      oldDsMap[d.hoTen + "_" + d.tuCach] = d.daiDien || "";
    });
  }

  var nkkArr = [], nbkArr = [];
  document.querySelectorAll('.q-party-item').forEach(function(m) {
    var inputHoTen = m.querySelector('.q-in-hoten');
    var rawHoTen = inputHoTen ? inputHoTen.value.trim() : "";

    if (rawHoTen) {
      var hoTen = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(rawHoTen) : rawHoTen) : rawHoTen;
      if (inputHoTen) inputHoTen.value = hoTen;

      var tuCach = m.querySelector('.q-in-tucach').value;
      var xungHoSelect = m.querySelector('.q-in-xungho');
      var xungHo = xungHoSelect ? xungHoSelect.value : 'Ông/Bà';

      if (xungHo === 'Ông/Bà') {
        if (/^bà\s+/i.test(rawHoTen)) { xungHo = 'Bà'; if (xungHoSelect) xungHoSelect.value = 'Bà'; }
        else if (/^ông\s+/i.test(rawHoTen)) { xungHo = 'Ông'; if (xungHoSelect) xungHoSelect.value = 'Ông'; }
      }

      var namSinh = m.querySelector('.q-in-namsinh').value.trim();
      var diaChi = m.querySelector('.q-in-diachi').value.trim();

      let tcLower = String(tuCach).toLowerCase();
      if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn')) {
        nkkArr.push(hoTen);
      } else if (!tcLower.includes('liên quan')) {
        nbkArr.push(hoTen);
      }

      let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";
      p.ds.push({ 
        tuCach: tuCach, 
        xungHo: xungHo, 
        hoTen: hoTen, 
        namSinh: namSinh, 
        diaChi: diaChi, 
        sdt: "", 
        cccd: "", 
        daiDien: daiDienCu 
      });
    }
  });

  let warningMsg = window.validateDonData(p.ds);
  
  const proceedQuickSave = function() {
    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    let index = window.G_Don.findIndex(function(d) { return d.id === p.info.id; });
    if (index > -1) {
      window.G_Don[index].soDon = p.info.soDon; 
      window.G_Don[index].ngayNhan = dateVn; 
      window.G_Don[index].rawDate = rawDateTs;
      window.G_Don[index].loaiAn = p.info.loaiAn; 
      window.G_Don[index].quanHe = p.info.quanHe; 
      window.G_Don[index].thamPhan = p.info.thamPhan;
      window.G_Don[index].huongXuLy = p.info.huongXuLy; 
      window.G_Don[index].trangThai = p.info.trangThai;
      window.G_Don[index].nguoiKhoiKien = nkkArr.join(", "); 
      window.G_Don[index].nguoiBiKien = nbkArr.join(", "); 
      window.G_Don[index].chiTietDuongSu = p.ds;
    }

    google.script.run.api_LuuThongTinDon(p);
    if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine();

    if (typeof bootstrap !== 'undefined') {
      let m = bootstrap.Modal.getInstance(document.getElementById('modalQuickEditDon'));
      if (m) m.hide();
    }

    if (openDraftModal) {
      setTimeout(function() { if (typeof window.openQuickDraftDon === 'function') window.openQuickDraftDon(p.info.id); }, 400);
    }
  };

  if (warningMsg) {
    if (typeof AppUI !== 'undefined') AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedQuickSave);
  } else proceedQuickSave();
};

  }

  let isSbsRequired = templateNames.some(function(n) { return n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"); });
  if (isSbsRequired) {

    if (typeof bootstrap !== 'undefined') bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSuaDoiBoSungDon')).show();
    if (typeof window.toggleSbsFields === 'function') window.toggleSbsFields();
  } else {
    if (typeof window.finalizeDraftingLogic === 'function') window.finalizeDraftingLogic(st, templateNames, id, true);
  }
};

window.prepareDraftingLogicForDetail = function(templateIds, idDonFromUI) {
  var templateNames = [];
  templateIds.forEach(function(idTpl) {
    let el = document.getElementById('tpl_don_' + idTpl);
    if (el) templateNames.push(el.nextElementSibling.innerText.toLowerCase());
  });

  let isSbsRequired = templateNames.some(function(n) { return n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"); });

  if (isSbsRequired) {
    window.pendingSBS_Data = { templateIds: templateIds, templateNames: templateNames, idDon: idDonFromUI, isFromQuickModal: false };
    if (typeof bootstrap !== 'undefined') bootstrap.Modal.getOrCreateInstance(document.getElementById('modalSuaDoiBoSungDon')).show();
    if (typeof window.toggleSbsFields === 'function') window.toggleSbsFields();
  } else {
    if (typeof window.finalizeDraftingLogic === 'function') window.finalizeDraftingLogic(templateIds, templateNames, idDonFromUI, false);
  }
};

window.toggleSbsFields = function() {
  let htEl = document.getElementById('sbs_hinhThuc_status');
  let tlEl = document.getElementById('sbs_taiLieu_status');
  if (!htEl || !tlEl) return;

  let htStat = htEl.value;
  let tlStat = tlEl.value;

  let isHtSai = (htStat === "SAI" || htStat.includes("Chưa đúng"));
  let isTlThieu = (tlStat === "THIEU" || tlStat.includes("Chưa đủ"));

  let cHt = document.getElementById('sbs_hinhThuc_yeuCau_container');
  let cNd = document.getElementById('sbs_noiDung_yeuCau_container');
  let cTl = document.getElementById('sbs_taiLieu_yeuCau_container');

  if (cHt) cHt.style.display = isHtSai ? 'block' : 'none';
  if (cNd) cNd.style.display = 'block';
  if (cTl) cTl.style.display = isTlThieu ? 'block' : 'none';
};

window.cancelSbsForm = function() {
  if (typeof bootstrap !== 'undefined') {
    let m = bootstrap.Modal.getInstance(document.getElementById('modalSuaDoiBoSungDon'));
    if (m) m.hide();
  }
  window.pendingSBS_Data = null;
};

window.submitSbsForm = function() {
  let htEl = document.getElementById('sbs_hinhThuc_status');
  let tlEl = document.getElementById('sbs_taiLieu_status');
  let htStat = htEl ? htEl.value : "SAI";
  let tlStat = tlEl ? tlEl.value : "THIEU";

  let isHtDung = (htStat === "ĐÚNG" || htStat.includes("Đã đúng"));
  let isTlDu = (tlStat === "DU" || tlStat.includes("Đã nộp đủ") || tlStat.includes("Đã đủ"));

  let ndNhanXet = document.getElementById('sbs_noiDung_nhanXet') ? document.getElementById('sbs_noiDung_nhanXet').value.trim() : "";

  // PHẦN I: {Những vấn đề cần sửa chữa bổ sung} - ĐÁNH GIÁ HIỆN TRẠNG ĐƠN
  let p1 = [];
  if (isHtDung) {
    p1.push("- Về hình thức đơn khởi kiện: Đã đảm bảo theo đúng quy định của pháp luật.");
  } else {
    p1.push("- Về hình thức đơn khởi kiện: Chưa đúng quy định tại Điều 189 Bộ luật Tố tụng dân sự.");
  }

  if (ndNhanXet) {
    p1.push("- Về nội dung đơn khởi kiện: " + ndNhanXet);
  }

  if (isTlDu) {
    p1.push("- Về tài liệu, chứng cứ kèm theo: Đã nộp các tài liệu chứng cứ ban đầu.");
  } else {
    p1.push("- Về tài liệu, chứng cứ kèm theo đơn khởi kiện: Chưa nộp đủ tài liệu, chứng cứ để chứng minh cho yêu cầu khởi kiện.");
  }

  // PHẦN II: {Yêu cầu sửa đổi bổ sung} - MỆNH LỆNH CHỈ THỊ CỤ THỂ CỦA TÒA ÁN
  let p2 = [];
  let count = 1;
  if (!isHtDung) {
    let htYeuCau = document.getElementById('sbs_hinhThuc_yeuCau') ? document.getElementById('sbs_hinhThuc_yeuCau').value.trim() : "";
    p2.push(count + ". Sửa đổi, hoàn thiện hình thức đơn: " + (htYeuCau || "Làm lại đơn khởi kiện theo đúng Mẫu số 23-DS ban hành kèm Nghị quyết số 01/2017/NQ-HĐTP."));
    count++;
  }

  let ndYeuCau = document.getElementById('sbs_noiDung_yeuCau') ? document.getElementById('sbs_noiDung_yeuCau').value.trim() : "";
  if (ndYeuCau) {
    p2.push(count + ". Bổ sung, làm rõ nội dung yêu cầu khởi kiện: " + ndYeuCau);
    count++;
  }

  if (!isTlDu) {
    let tlYeuCau = document.getElementById('sbs_taiLieu_yeuCau') ? document.getElementById('sbs_taiLieu_yeuCau').value.trim() : "";
    p2.push(count + ". Giao nộp bổ sung tài liệu, chứng cứ gồm: " + (tlYeuCau || "Giao nộp các tài liệu, chứng cứ để chứng minh cho quyền khởi kiện."));
  }

  if (typeof bootstrap !== 'undefined') {
    let m = bootstrap.Modal.getInstance(document.getElementById('modalSuaDoiBoSungDon'));
    if (m) m.hide();
  }

  let p = window.pendingSBS_Data;
  if (p && typeof window.finalizeDraftingLogic === 'function') {
    window.finalizeDraftingLogic(p.templateIds, p.templateNames, p.idDon, p.isFromQuickModal, p1.join("\n"), p2.join("\n"));
  }
};

window.thucHienTronThuDon = function() {
  var selectedTemplates = [];
  document.querySelectorAll('.don-tpl-check:checked').forEach(function(cb) { selectedTemplates.push(cb.value); });

  if (selectedTemplates.length === 0) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Thông báo", "Vui lòng chọn ít nhất một biểu mẫu để xuất văn bản!");
    return;
  }

  var p = {
    info: {
      id: document.getElementById('don_id').value,
      soDon: document.getElementById('don_soDon').value.trim(),
      ngayNhan: document.getElementById('don_ngayNhan').value,
      loaiAn: document.getElementById('don_loaiAn').value,
      quanHe: document.getElementById('don_quanHe').value.trim(),
      thamPhan: document.getElementById('don_thamPhan').value.trim() || "Chưa phân công",
      giaTri: String(document.getElementById('don_giaTri').value).replace(/\./g, ''),
      tamUng: document.getElementById('don_tamUngValue').value,
      huongXuLy: document.getElementById('don_trangThai_display').value,
      trangThai: document.getElementById('don_trangThai_display').value,
      ghiChu: document.getElementById('don_ghiChu').value.trim()
    },
    ds: []
  };

  if (!p.info.soDon) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Cảnh báo", "Vui lòng nhập Số đơn!");
    return;
  }

  let oldDsMap = {};
  if (p.info.id && !p.info.id.includes("TEMP_") && typeof window.G_Don !== 'undefined') {
    let donHienTai = window.G_Don.find(function(d) { return d.id === p.info.id; });
    if (donHienTai && donHienTai.chiTietDuongSu) {
      donHienTai.chiTietDuongSu.forEach(function(d) {
        oldDsMap[d.hoTen + "_" + d.tuCach] = d.daiDien || "";
      });
    }
  }

  var nkkArr = [], nbkArr = [];
  document.querySelectorAll('.don-party-group').forEach(function(g) {
    var tuCach = g.querySelector('.in-don-tucach').value;
    var diaChi = g.querySelector('.in-don-diachi').value.trim();
    var sdt = g.querySelector('.in-don-sdt').value.trim();
    var cccd = g.querySelector('.in-don-cccd').value.trim();

    g.querySelectorAll('.member-item').forEach(function(m) {
      var inputHoTen = m.querySelector('.in-don-hoten');
      var rawHoTen = inputHoTen ? inputHoTen.value.trim() : "";

      if (rawHoTen) {
        var hoTen = typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(rawHoTen) : rawHoTen) : rawHoTen;
        if (inputHoTen) inputHoTen.value = hoTen;

        var xungHoSelect = m.querySelector('.in-don-xungho');
        var xungHo = xungHoSelect ? xungHoSelect.value : 'Ông/Bà';

        if (xungHo === 'Ông/Bà') {
          if (/^bà\s+/i.test(rawHoTen)) { xungHo = 'Bà'; if (xungHoSelect) xungHoSelect.value = 'Bà'; }
          else if (/^ông\s+/i.test(rawHoTen)) { xungHo = 'Ông'; if (xungHoSelect) xungHoSelect.value = 'Ông'; }
        }

        var namSinh = m.querySelector('.in-don-namsinh').value.trim();
        let tcLower = String(tuCach).toLowerCase();
        if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('nguyên đơn')) {
          nkkArr.push(hoTen);
        } else if (!tcLower.includes('liên quan')) {
          nbkArr.push(hoTen);
        }

        let daiDienCu = oldDsMap[hoTen + "_" + tuCach] || "";

        p.ds.push({
          tuCach: tuCach, xungHo: xungHo, hoTen: hoTen, namSinh: namSinh, diaChi: diaChi, sdt: sdt, cccd: cccd, daiDien: daiDienCu
        });
      }
    });
  });

  let warningMsg = window.validateDonData(p.ds);

  const proceedMerge = function() {
    var dParts = p.info.ngayNhan.split('-');
    var dateVn = dParts.length === 3 ? (dParts[2] + "/" + dParts[1] + "/" + dParts[0]) : p.info.ngayNhan;
    var rawDateTs = new Date(p.info.ngayNhan).getTime();

    if (p.info.id && typeof window.G_Don !== 'undefined') {
      let index = window.G_Don.findIndex(function(d) { return d.id === p.info.id; });
      if (index > -1) {
        window.G_Don[index].soDon = p.info.soDon; window.G_Don[index].ngayNhan = dateVn; window.G_Don[index].rawDate = rawDateTs;
        window.G_Don[index].loaiAn = p.info.loaiAn; window.G_Don[index].quanHe = p.info.quanHe; window.G_Don[index].thamPhan = p.info.thamPhan;
        window.G_Don[index].huongXuLy = p.info.huongXuLy; window.G_Don[index].trangThai = p.info.trangThai; window.G_Don[index].giaTri = p.info.giaTri; window.G_Don[index].tamUng = p.info.tamUng; window.G_Don[index].ghiChu = p.info.ghiChu;
        window.G_Don[index].nguoiKhoiKien = nkkArr.join(", "); window.G_Don[index].nguoiBiKien = nbkArr.join(", "); window.G_Don[index].chiTietDuongSu = p.ds;
      }
    } else {
      p.info.id = "TEMP_" + new Date().getTime(); document.getElementById('don_id').value = p.info.id;
      window.G_Don.unshift({
        id: p.info.id, soDon: p.info.soDon, ngayNhan: dateVn, rawDate: rawDateTs,
        loaiAn: p.info.loaiAn, quanHe: p.info.quanHe, thamPhan: p.info.thamPhan, huongXuLy: p.info.huongXuLy, trangThai: p.info.trangThai,
        giaTri: p.info.giaTri, tamUng: p.info.tamUng, ghiChu: p.info.ghiChu, nguoiKhoiKien: nkkArr.join(", "), nguoiBiKien: nbkArr.join(", "), chiTietDuongSu: p.ds
      });
    }
    if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine();

    if (typeof window.prepareDraftingLogicForDetail === 'function') window.prepareDraftingLogicForDetail(selectedTemplates, p.info.id);
  };

  if (warningMsg) {
    if (typeof AppUI !== 'undefined') AppUI.confirm("Thiếu thông tin", warningMsg, "warning", proceedMerge);
  } else proceedMerge();
};

window.finalizeDraftingLogic = function(templateIds, templateNames, idDon, isFromQuickModal, phSbsVanDe, phSbsYeuCau) {
  if (phSbsVanDe === undefined) phSbsVanDe = "";
  if (phSbsYeuCau === undefined) phSbsYeuCau = "";

  let don = typeof window.G_Don !== 'undefined' ? window.G_Don.find(function(d) { return d.id === idDon; }) : null;
  if (!don) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi", "Không tìm thấy dữ liệu hồ sơ trong bộ nhớ.");
    return;
  }

  let btnQuick = document.querySelector('#modalQuickDraftDon .modal-footer .btn-primary');
  let btnDetail = document.querySelector('#view-chi-tiet-don .btn-primary'); 
  let btnExportDetail = document.querySelector('#view-chi-tiet-don .btn-primary.w-100'); 
  
  let originalBtnTextQuick = btnQuick ? btnQuick.innerHTML : "";
  let originalBtnTextDetail = btnDetail ? btnDetail.innerHTML : "";
  let originalBtnTextExport = btnExportDetail ? btnExportDetail.innerHTML : "";
  
  if (isFromQuickModal && btnQuick) { btnQuick.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG XỬ LÝ...'; btnQuick.disabled = true; }
  if (!isFromQuickModal) {
    if (btnDetail) { btnDetail.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG LƯU...'; btnDetail.disabled = true; }
    if (btnExportDetail) { btnExportDetail.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> ĐANG XUẤT...'; btnExportDetail.disabled = true; }
  }

  const unlockButtons = function() {
    if (btnQuick) { btnQuick.innerHTML = originalBtnTextQuick; btnQuick.disabled = false; }
    if (btnDetail) { btnDetail.innerHTML = originalBtnTextDetail; btnDetail.disabled = false; }
    if (btnExportDetail) { btnExportDetail.innerHTML = originalBtnTextExport; btnExportDetail.disabled = false; }
  };

  let taskId = "task_merge_" + new Date().getTime();
  if (typeof AppUI !== 'undefined') AppUI.addBackgroundTask(taskId, "Đang xử lý đơn: " + (don.soDon || 'Chưa có số'));

  try {
    let pDate, tDate, tTime, giaTriRaw, currentStatus, donQuanHeVal, donLoaiAnVal;

    if (isFromQuickModal) {
      pDate = document.getElementById('draft_don_ngayBanHanh').value || (typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD() : "");
      tDate = document.getElementById('draft_don_date').value;
      tTime = document.getElementById('draft_don_time').value;
      giaTriRaw = document.getElementById('draft_don_giaTri').value;
      currentStatus = document.getElementById('quick_don_trangThai') ? document.getElementById('quick_don_trangThai').value : "Đang xem xét";
      donQuanHeVal = document.getElementById('draft_don_quanHe').value.trim();
      donLoaiAnVal = document.getElementById('draft_don_loaiAn').value;
    } else {
      pDate = document.getElementById('don_process_ngayBanHanh').value || (typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD() : "");
      tDate = document.getElementById('don_process_date').value;
      tTime = document.getElementById('don_process_time').value;
      giaTriRaw = document.getElementById('don_giaTri').value;
      currentStatus = document.getElementById('don_trangThai_display') ? document.getElementById('don_trangThai_display').value : "Đang xem xét";
      donQuanHeVal = document.getElementById('don_quanHe').value.trim();
      donLoaiAnVal = document.getElementById('don_loaiAn').value;
    }

    let joinedNames = templateNames.join(" ").toLowerCase();
    let newStatus = currentStatus;
    let isSmsSent = (currentStatus === "Đã hẹn làm việc" || currentStatus === "SMS - Hướng dẫn" || currentStatus.includes("SMS"));
    let isChiHuongDan = templateNames.every(function(n) { return n.includes("nhận đơn") || n.includes("lựa chọn hòa giải") || n.includes("sửa chữa") || n.includes("bổ sung") || n.includes("sửa đổi"); });

    if (isSmsSent && isChiHuongDan) newStatus = "SMS - Hướng dẫn";
    else if (joinedNames.includes("nộp tạm ứng") || joinedNames.includes("miễn tạm ứng") || joinedNames.includes("tạm ứng lệ phí")) newStatus = isSmsSent ? "Đã xử lý xong + SMS" : "Đã xử lý xong";
    else if (joinedNames.includes("chuyển vụ việc sang hòa giải") || joinedNames.includes("chỉ định hòa giải viên")) newStatus = "Chuyển hòa giải đối thoại";
    else if (joinedNames.includes("lựa chọn hòa giải")) newStatus = "Thông báo lựa chọn hòa giải";
    else if (joinedNames.includes("báo xử lý đơn")) newStatus = "Báo xử lý đơn";
    else if (joinedNames.includes("sửa chữa") || joinedNames.includes("bổ sung") || joinedNames.includes("sửa đổi")) newStatus = "Yêu cầu sửa đổi, bổ sung";
    else if (joinedNames.includes("trả lại")) newStatus = "Trả lại đơn";
    else if (joinedNames.includes("chuyển đơn")) newStatus = "Chuyển đơn";

    let safeNgayNhanYMD = "";
    if (don.ngayNhan && String(don.ngayNhan).includes('/')) {
      let parts = String(don.ngayNhan).split('/');
      safeNgayNhanYMD = parts[2] + "-" + parts[1] + "-" + parts[0];
    } else if (don.rawDate) { 
      safeNgayNhanYMD = typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD(don.rawDate) : ""; 
    } else { 
      safeNgayNhanYMD = typeof window.formatDateToYMD === 'function' ? window.formatDateToYMD() : ""; 
    }

    let giaTri = String(giaTriRaw).replace(/\./g, '');
    let keyLoaiAn = "danSu";
    if (String(donLoaiAnVal).includes("Kinh doanh")) keyLoaiAn = "kinhDoanh";
    else if (String(donLoaiAnVal).includes("Hình sự")) keyLoaiAn = "hinhSu";
    else if (String(donLoaiAnVal).includes("Hành chính")) keyLoaiAn = "hanhChinh";

    var feeObj = { tamUngSo: "0" };
    if (typeof window.local_calculateCourtFee === 'function') {
      feeObj = window.local_calculateCourtFee(keyLoaiAn, giaTri || "0");
    }
    let tamUngSo = String(feeObj.tamUngSo).replace(/\./g, '');

    var payloadData = {
      info: {
        id: don.id, soDon: don.soDon, ngayNhan: safeNgayNhanYMD, loaiAn: donLoaiAnVal,
        quanHe: donQuanHeVal, thamPhan: don.thamPhan, trangThai: newStatus, ghiChu: don.ghiChu,
        giaTri: giaTri, tamUng: tamUngSo, huongXuLy: newStatus 
      }, 
      ds: don.chiTietDuongSu 
    };

    var valNguoiNhan = document.getElementById('don_process_nguoiNhan') ? document.getElementById('don_process_nguoiNhan').value.trim() : "";
    var valDiaChiNhan = document.getElementById('don_process_diaChiNhan') ? document.getElementById('don_process_diaChiNhan').value.trim() : "";

    var payloadMerge = {
      idDon: idDon,
      soDon: don.soDon,
      newStatus: newStatus,
      templateIds: templateIds,
      ngayBanHanh: pDate,
      trieuTapDate: tDate,
      trieuTapTime: tTime,
      diaDiemLamViec: "Trụ sở Tòa án",
      noiDungThem: "Làm rõ một số vấn đề liên quan đến đơn khởi kiện",
      nguoiNhan: valNguoiNhan,
      diaChiNhan: valDiaChiNhan,
      sbsVanDe: phSbsVanDe || "",
      sbsYeuCau: phSbsYeuCau || "",
      partiesOverride: don.chiTietDuongSu,
      infoOverride: payloadData.info
    };

    setTimeout(function() {
      if (isFromQuickModal && typeof bootstrap !== 'undefined') {
        let m = bootstrap.Modal.getInstance(document.getElementById('modalQuickDraftDon'));
        if (m) m.hide();
      }
    }, 300);

    if (newStatus && typeof window.G_Don !== 'undefined') {
      let idx = window.G_Don.findIndex(function(d) { return d.id === idDon; });
      if (idx > -1) { 
        window.G_Don[idx].trangThai = newStatus; 
        window.G_Don[idx].huongXuLy = newStatus;
        window.G_Don[idx].giaTri = giaTri; 
        window.G_Don[idx].tamUng = tamUngSo; 
      }
      
      let donTrangThaiUI = document.getElementById('don_trangThai_display');
      if (donTrangThaiUI && document.getElementById('don_id').value === idDon) {
        donTrangThaiUI.value = newStatus;
      }
      if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine(); 
    }

    let idToKeep = payloadData.info.id; 
    
    google.script.run
      .withSuccessHandler(function(res) {
        unlockButtons();
        
        if (res && res.success) {
          let linksHtml = (res.files || []).map(function(f) {
            let rawName = (f.name || '').replace(/\.(docx|doc|gdoc)$/i, '').trim();
            rawName = rawName.replace(/\s*-\s*[\w\d\/]+(\s*-\s*\d{1,2}\.\d{1,2}\.\d{2,4})?$/i, '').trim();
            let dashIdx = rawName.indexOf(' - ');
            let shortTitle = (dashIdx !== -1) ? rawName.substring(0, dashIdx).trim() : rawName;

            let docxBtn = f.docxUrl 
              ? '<a href="' + f.docxUrl + '" target="_blank" style="font-size: 9px; font-weight: 700; color: #475569; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 1px 5px; height: 19px; line-height: 17px; text-decoration: none; display: inline-flex; align-items: center; flex-shrink: 0;" title="Tải file Word (.docx)"><i class="fas fa-download" style="font-size: 8px; margin-right: 3px;"></i>.docx</a>' 
              : '';

            return '<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 6px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 2px; min-width: 0; width: 100%; gap: 6px;">' +
                   '<a href="' + f.url + '" target="_blank" style="font-size: 11px; font-weight: 700; color: #2563eb; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0; line-height: 1.3;" title="' + f.name + '">' +
                   '<i class="far fa-file-word text-primary" style="margin-right: 4px; font-size: 11px;"></i>' + shortTitle + '</a>' +
                   docxBtn +
                   '</div>';
          }).join('');
          
          if (typeof AppUI !== 'undefined') AppUI.completeBackgroundTask(taskId, true, linksHtml);
          
          if (res.idDon && String(res.idDon).startsWith("DON_")) {
            let currentUiId = document.getElementById('don_id').value;
            if (currentUiId === idToKeep) { document.getElementById('don_id').value = res.idDon; }
            let tmpIndex = window.G_Don.findIndex(function(d) { return d.id === idToKeep; });
            if (tmpIndex > -1) window.G_Don[tmpIndex].id = res.idDon;
          }
        } else { 
          let errMsg = res && res.error ? res.error : "Máy chủ trả về kết quả rỗng.";
          if (typeof AppUI !== 'undefined') AppUI.completeBackgroundTask(taskId, false, errMsg); 
        }
      })
      .withFailureHandler(function(err){
        unlockButtons(); 
        if (typeof AppUI !== 'undefined') AppUI.completeBackgroundTask(taskId, false, "Lỗi kết nối mạng: " + err.message);
      })
      .api_LuuVaTronThuDon_SuperFast(payloadData, payloadMerge);

  } catch (error) {
    unlockButtons();
    if (typeof AppUI !== 'undefined') AppUI.completeBackgroundTask(taskId, false, "Lỗi hệ thống Frontend: " + error.message);
    console.error(error);
  }
};

window.doiChieuDuLieuDon = function() {
  if (typeof AppUI !== 'undefined') AppUI.showToast("Đang kết nối để đối chiếu...", "");
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof AppUI !== 'undefined') {
        AppUI.hideToast();
        if (res.success) {
          AppUI.alert("ĐỐI CHIẾU DỮ LIỆU HỆ THỐNG", res.html);
        } else {
          AppUI.alert("Lỗi Đối chiếu", res.error);
        }
      }
    })
    .withFailureHandler(function(err){
      if (typeof AppUI !== 'undefined') {
        AppUI.hideToast();
        AppUI.alert("Lỗi mạng", "Không thể kết nối máy chủ: " + err.message);
      }
    })
    .api_DoiChieuDuLieuDon();
};

/* =========================================================================
   9. TRÌNH TỰ ĐỘNG LƯU ĐƠN (AUTO-SAVE)
   ========================================================================= */

window.donAutoSaveTimer = null;

document.addEventListener("DOMContentLoaded", function() {
  document.addEventListener('input', handleDonAutoSave);
  document.addEventListener('change', handleDonAutoSave);
});

function handleDonAutoSave(e) {
  if (!e.target.closest('#view-chi-tiet-don')) return;

  if (e.target && (
    e.target.id === 'don_quick_search_no' || 
    e.target.type === 'file' || 
    e.target.type === 'checkbox' || 
    e.target.type === 'button' || 
    e.target.tagName === 'BUTTON' || 
    e.target.tagName === 'A'
  )) return;

  let currentId = document.getElementById('don_id').value;
  if (!currentId || currentId.includes("TEMP_")) return;

  clearTimeout(window.donAutoSaveTimer);
  
  let indicator = document.getElementById('don_autosave_indicator');
  if (indicator) indicator.innerHTML = '<i class="fas fa-spinner fa-spin text-warning me-1"></i> <span class="text-warning">Đang chờ lưu...</span>';

  window.donAutoSaveTimer = setTimeout(function() {
    if (typeof window.luuThongTinDon === 'function') {
      window.luuThongTinDon(true);
    }
  }, 1500);
}
