<!--
  HỆ THỐNG TRỢ LÝ GIẢI QUYẾT ÁN V7.6 - GIAO DIỆN CHI TIẾT ĐƠN
  FILE: UI_ChiTiet_Don.html
  ------------------------------------------------------------
  Chức năng: Chỉnh sửa, phân tích AI và quản lý đương sự đơn.
-->

<div class="animate-fadeIn p-2 p-md-3">

  <!-- 1. THANH ĐIỀU HƯỚNG & THAO TÁC CHÍNH -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-outline-secondary shadow-sm fw-bold" style="border-radius: 20px; font-size: 12px;" onclick="appNavigate('view-danh-sach-don')">
      <i class="fas fa-chevron-left me-2"></i>QUAY LẠI SỔ ĐƠN
    </button>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-danger fw-bold px-3 shadow-sm" style="font-size: 12px; border-radius: 8px;" onclick="window.xoaDonHienTai()">
        <i class="fas fa-trash-alt me-1"></i> XÓA ĐƠN
      </button>
      <button class="btn btn-primary fw-bold px-4 shadow-sm" style="font-size: 12px; border-radius: 8px;" onclick="window.luuThongTinDon()">
        <i class="fas fa-save me-2"></i> LƯU THÔNG TIN ĐƠN
      </button>
    </div>
  </div>

  <!-- 2. BANNER THÔNG TIN CHUNG -->
  <div class="bg-white shadow-sm border-0 mb-4" style="border-radius: 12px; border-left: 5px solid #0dcaf0 !important;">
    <div class="p-3">
      <div class="row align-items-center">
        <div class="col-md-4 border-end">
          <h5 class="fw-bold text-dark m-0" id="don_header_title">THÊM ĐƠN KHỞI KIỆN MỚI</h5>
          <input type="hidden" id="don_id">
        </div>
        <div class="col-md-8">
           <div class="d-flex flex-wrap gap-4 ps-3">
              <div><span class="small-label" style="font-size: 11px; color:#6c757d; font-weight: bold; text-transform: uppercase;">Ngày nhận đơn</span><input type="date" id="don_ngayNhan" class="form-control form-control-sm fw-bold border-0 p-0 shadow-none"></div>
              <div><span class="small-label" style="font-size: 11px; color:#6c757d; font-weight: bold; text-transform: uppercase;">Phân loại</span>
                <select id="don_loaiAn" class="form-select form-select-sm fw-bold border-0 p-0 shadow-none" style="width: auto;">
                   <option value="1. Hình sự">1. Hình sự (Tố giác)</option>
                   <option value="2. Dân sự" selected>2. Dân sự</option>
                   <option value="3. Hôn nhân">3. Hôn nhân & GĐ</option>
                   <option value="4. Kinh doanh">4. Kinh doanh</option>
                   <option value="5. Lao động">5. Lao động</option>
                   <option value="6. Hành chính">6. Hành chính</option>
                   <option value="7. Hòa giải đối thoại">7. Hòa giải đối thoại</option>
                </select>
              </div>
              <div><span class="small-label" style="font-size: 11px; color:#6c757d; font-weight: bold; text-transform: uppercase;">Số đơn (Sổ văn thư)</span><input type="text" id="don_soDon" class="form-control form-control-sm fw-bold border-0 p-0 shadow-none text-info" placeholder="Nhập số đơn..."></div>
           </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. NỘI DUNG CHI TIẾT -->
  <div class="row g-4">
    
    <!-- CỘT TRÁI: ĐƯƠNG SỰ & QUAN HỆ -->
    <div class="col-lg-8">
      
      <!-- Scan AI Box -->
      <div class="mb-3">
        <button class="btn btn-info text-white w-100 fw-bold shadow-sm py-2" style="border-radius: 8px;" onclick="document.getElementById('scan-don-ai-input').click()">
          <i class="fas fa-robot me-2"></i> QUÉT ĐƠN BẰNG GROQ AI (WORD/PDF) ĐỂ TỰ ĐIỀN THÔNG TIN
        </button>
        <input type="file" id="scan-don-ai-input" class="d-none" accept=".doc,.docx,.pdf" onchange="window.scanDocumentForInfoDon(this)">
      </div>

      <div class="bg-white shadow-sm border p-4" style="border-radius: 12px;">
        <div class="mb-4">
          <label class="small-label text-primary" style="font-size: 11px; font-weight: bold; text-transform: uppercase;">Quan hệ tranh chấp / Nội dung yêu cầu *</label>
          <input type="text" id="don_quanHe" class="form-control form-control-lg fw-bold border-0 border-bottom rounded-0 px-0" placeholder="VD: Tranh chấp hợp đồng vay tài sản...">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold m-0"><i class="fas fa-users me-2 text-primary"></i>DANH SÁCH ĐƯƠNG SỰ TRONG ĐƠN</h6>
          <button class="btn btn-sm btn-outline-primary fw-bold" onclick="window.addPartyRowDon()"><i class="fas fa-plus me-1"></i> Thêm đương sự</button>
        </div>

        <div class="table-responsive">
          <table class="table align-middle gs-table">
            <thead class="table-light">
              <tr style="font-size: 11px; text-transform: uppercase;">
                <th style="width: 25%;">Tư cách</th>
                <th style="width: 30%;">Họ tên / Xưng hô</th>
                <th style="width: 35%;">Địa chỉ / Liên hệ</th>
                <th style="width: 10%;"></th>
              </tr>
            </thead>
            <tbody id="don-party-list">
              <!-- JS render rows here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI: XỬ LÝ & ÁN PHÍ -->
    <div class="col-lg-4">
      
      <!-- Hướng xử lý & Phân công -->
      <div class="bg-white shadow-sm border p-3 mb-4" style="border-radius: 12px;">
        <h6 class="fw-bold border-bottom pb-2 mb-3 small"><i class="fas fa-gavel me-2 text-warning"></i>XỬ LÝ NGHIỆP VỤ</h6>
        
        <div class="mb-3">
          <label class="small-label" style="font-size: 11px; font-weight: bold; text-transform: uppercase; color:#6c757d;">Hướng xử lý đơn</label>
          <select id="don_huongXuLy" class="form-select fw-bold border-warning">
            <option value="Đang xem xét">Đang xem xét</option>
            <option value="Yêu cầu sửa đổi, bổ sung">Yêu cầu sửa đổi, bổ sung</option>
            <option value="Chuyển đơn cho cơ quan khác">Chuyển đơn cho cơ quan khác</option>
            <option value="Trả lại đơn">Trả lại đơn</option>
            <option value="Đã thụ lý thành vụ án">Đã thụ lý thành vụ án</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="small-label" style="font-size: 11px; font-weight: bold; text-transform: uppercase; color:#6c757d;">Thẩm phán phân công</label>
          <input type="text" id="don_thamPhan" class="form-control shadow-none" placeholder="Tên thẩm phán...">
        </div>

        <div class="p-3 rounded bg-light border">
          <label class="small-label text-danger" style="font-size: 11px; font-weight: bold; text-transform: uppercase;">Tạm ứng án phí dự tính</label>
          <div class="input-group input-group-sm mb-2">
            <span class="input-group-text">Giá trị</span>
            <input type="text" id="don_giaTri" class="form-control fw-bold" placeholder="VNĐ" oninput="window.formatCurrency(this); window.calculateDonFee(this.value)">
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <span class="small fw-bold">Mức tạm ứng:</span>
            <span class="h6 m-0 fw-bold text-danger" id="don_ketQuaTamUng">0</span>
            <input type="hidden" id="don_tamUngValue">
          </div>
        </div>
      </div>

      <!-- Phân tích AI & Ghi chú -->
      <div class="shadow-sm p-3" style="border-radius: 12px; background: #fffdf2; border: 1px solid #ffeeba; min-height: 250px;">
        <div class="fw-bold border-bottom pb-2 mb-2 small text-warning-emphasis">
          <i class="fas fa-brain me-2"></i>PHÂN TÍCH AI / GHI CHÚ NHANH
        </div>
        <textarea id="don_aiAnalysis" class="form-control border-0 bg-transparent shadow-none" 
                  style="font-size: 13px; color: #333; resize: none; line-height: 1.6; height: 180px;" 
                  placeholder="AI sẽ phân tích tóm tắt đơn tại đây hoặc bạn có thể tự ghi chú..."></textarea>
      </div>

    </div>
  </div>
</div>
