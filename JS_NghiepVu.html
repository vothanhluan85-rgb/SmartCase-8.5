window.standardizeResolutionAbbr = function(raw) {
  if (!raw) return "";
  var s = String(raw).trim();
  var sLow = window.removeAccents ? window.removeAccents(s.toLowerCase()) : s.toLowerCase();

  if (sLow.includes("thuan tinh ly hon") || sLow.includes("cong nhan thuan tinh")) return "QĐCN-TTLH";
  if (sLow.includes("su thoa thuan") || sLow.includes("thoa thuan") || sLow.includes("hoa giai thanh")) {
    if (sLow.includes("hgdt") || sLow.includes("doi thoai")) return "QĐCN-HGĐT";
    return "QĐCNTT";
  }
  if (sLow.includes("ban an") || sLow.includes("xet xu")) return "Bản án";
  if (sLow.includes("tam dinh chi")) return "Tạm đình chỉ";
  if (sLow.includes("dinh chi")) return "Đình chỉ";
  if (sLow.includes("tra ho so") || sLow.includes("dieu tra bo sung")) return "Trả HS ĐTBS";
  if (sLow.includes("gia han")) return "Gia hạn";
  if (sLow.includes("tiep tuc")) return "Tiếp tục giải quyết";
  if (sLow.includes("chuyen ho so") || sLow.includes("chuyen vu an")) return "Chuyển hồ sơ";
  if (sLow.includes("nhap vu an") || sLow.includes("nhap vu viec")) return "Nhập vụ án";
  if (sLow.includes("viec dan su") || sLow.includes("giai quyet viec")) return "QĐGQ-VDS";

  return s;
};

window.cleanHonorificFromName = function(name) {
  if (!name) return "";
  return String(name).replace(/^(Ông|Bà|Anh|Chị|ông|bà|anh|chị)\s+/i, '').trim();
};

window.isIndividualHonorific = function(xh) {
  if (!xh) return false;
  var x = String(xh).trim().toLowerCase();
  if (x === "tổ chức" || x === "pháp nhân" || x === "công ty" || x === "doanh nghiệp") return false;
  return (x === "ông" || x === "bà" || x === "anh" || x === "chị" || x === "ông/bà");
};

window.toTitleCase = function(str) {
  if (!str) return "";
  var keepUpper = [
    "TMCP", "TNHH", "CP", "MTV", "UBND", "TAND", "VKSND", "VN", "JSC", "BHTG", 
    "HTX", "NHCSXH", "NHTMCP", "NH", "BIDV", "ACB", "MB", "VPBANK", "VIETINBANK", 
    "VIETCOMBANK", "AGRIBANK", "SHB", "TPBANK", "HDBANK", "VIB", "MSB", "OCB", 
    "SEABANK", "LPBANK", "SCB", "SACOMBANK", "ABBANK", "BAB", "NCB", "QLTA"
  ];
  var words = String(str).trim().split(/\s+/);
  return words.map(function(w) {
    var upperW = w.toUpperCase();
    if (keepUpper.includes(upperW)) return upperW;
    if (w.includes("'") || w.includes("’")) {
      var parts = w.split(/['’]/);
      return parts.map(function(p) {
        if (!p) return "";
        return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
      }).join("'");
    }
    return upperW.charAt(0) + w.slice(1).toLowerCase();
  }).join(" ");
};
window.toTitleCaseLocal = window.toTitleCase;

window.formatPhoneNumber = function(phone) {
  if (!phone) return "";
  var str = String(phone).trim().replace(/[^0-9+]/g, '');
  if (str.length > 0 && str.charAt(0) !== '0' && str.charAt(0) !== '+') str = '0' + str;
  return str;
};

window.formatPhoneVNInput = function(input) {
  if (!input) return;
  var val = input.value.replace(/\D/g, '');
  if (val.length > 10) val = val.substring(0, 10);
  var formatted = val;
  if (val.length > 7) formatted = val.substring(0,4) + '.' + val.substring(4,7) + '.' + val.substring(7);
  else if (val.length > 4) formatted = val.substring(0,4) + '.' + val.substring(4);
  input.value = formatted;
};

window.getProceduralRoleInfo = function(loaiAn, quanHe) {
  var loaiAnClean = window.removeAccents ? window.removeAccents(String(loaiAn || '')).toLowerCase() : String(loaiAn || '').toLowerCase();
  var quanHeClean = window.removeAccents ? window.removeAccents(String(quanHe || '')).toLowerCase() : String(quanHe || '').toLowerCase();

  var isVHN = loaiAnClean.includes('hon nhan') && (quanHeClean.includes('thuan tinh') || quanHeClean.includes('cong nhan thuan tinh'));
  var isVDS = loaiAnClean.includes('viec dan su') || (loaiAnClean.includes('viec') && !loaiAnClean.includes('hon nhan'));
  var isHGDT = loaiAnClean.includes('hoa giai') || loaiAnClean.includes('doi thoai') || loaiAnClean.includes('hgdt');
  var isHC = loaiAnClean.includes('hanh chinh');
  var isHS = loaiAnClean.includes('hinh su');

  if (isVHN) {
    return { ndTitle: "NGƯỜI YÊU CẦU (1)", bdTitle: "NGƯỜI YÊU CẦU (2)", ndRole: "Người yêu cầu", bdRole: "Người yêu cầu" };
  } else if (isVDS) {
    return { ndTitle: "NGƯỜI YÊU CẦU", bdTitle: "NGƯỜI BỊ YÊU CẦU", ndRole: "Người yêu cầu", bdRole: "Người bị yêu cầu" };
  } else if (isHGDT || isHC) {
    return { ndTitle: "NGƯỜI KHỞI KIỆN", bdTitle: "NGƯỜI BỊ KIỆN", ndRole: "Người khởi kiện", bdRole: "Người bị kiện" };
  } else if (isHS) {
    return { ndTitle: "NGƯỜI BỊ HẠI", bdTitle: "BỊ CÁO", ndRole: "Người bị hại", bdRole: "Bị cáo" };
  } else {
    return { ndTitle: "NGUYÊN ĐƠN", bdTitle: "BỊ ĐƠN", ndRole: "Nguyên đơn", bdRole: "Bị đơn" };
  }
};

// Tác vụ 1: Quét đơn / thông báo scan tự động điền vào form thụ lý mới
window.scanDocumentForInfo = function(input) {
  if (!input.files || input.files.length === 0) return;
  var file = input.files[0];

  AppUI.showToast("AI đang đọc và bóc tách thông tin thụ lý từ đơn...", "");

  window.compressImageFile(file, 1600, 0.8, function(resFile) {
    google.script.run
      .withSuccessHandler(function(res) {
        AppUI.hideToast();
        if (res && res.success && res.data) {
          var d = res.data;

          if (d.soTL && document.getElementById('in_soTL')) {
            document.getElementById('in_soTL').value = String(d.soTL).replace(/\D/g, '');
          }
          if (d.quanHe && document.getElementById('in_quanHe')) {
            document.getElementById('in_quanHe').value = d.quanHe;
          }

          if (typeof window.handleCaseTypeChangeV3 === 'function') {
            window.handleCaseTypeChangeV3();
          }

          // Xóa trắng và điền đương sự 2 bên
          ['ND', 'BD'].forEach(t => { 
            var el = document.getElementById('container-' + t); 
            if (el) el.innerHTML = ""; 
          });

          if (d.nd_Info && d.nd_Info.hoTen) {
            window.addPartyRowV3('ND', false, d.nd_Info);
          } else {
            window.addPartyRowV3('ND', false);
          }

          if (d.bd_Info && d.bd_Info.hoTen) {
            window.addPartyRowV3('BD', false, d.bd_Info);
          } else {
            window.addPartyRowV3('BD', false);
          }

          AppUI.showToast("Đã trích xuất thông tin đơn vào biểu mẫu thụ lý!", "success");
        } else {
          AppUI.alert("Lỗi trích xuất", res ? res.error : "Không thể bóc tách nội dung đơn.");
        }
      })
      .withFailureHandler(function(err) {
        AppUI.hideToast();
        AppUI.showToast("Lỗi kết nối: " + err.message, "error");
      })
      .api_ParseDocumentForCaseInfo(resFile.name, resFile.mimeType, resFile.base64);
  });
  input.value = "";
};

// Tác vụ 3: Tiếp nhận bóc tách nguyên liệu & lấp đầy thông tin đương sự

          if (window.cleanHonorificFromName(m.name).toLowerCase() === cleanTarget) {
            if (p.namSinh && (!m.year || m.year === '---')) m.year = p.namSinh;
            if (p.diaChi && (!m.address || m.address === '---' || m.address === 'Chưa rõ địa chỉ')) m.address = p.diaChi;
            if (p.sdt && (!m.phone || m.phone === '---')) m.phone = window.formatPhoneNumber(p.sdt);
            if (p.cccd && (!m.idCard || m.idCard === '---')) m.idCard = p.cccd;
            if (p.xungHo && p.xungHo !== 'Ông/Bà' && (!m.title || m.title === 'Ông/Bà')) m.title = p.xungHo;
          }
        });
      });
    });
    window.renderA4Editor();
    window.saveA4StateToServer();
  }

      var selBD = (currentRole.includes("Bị đơn") || currentRole.includes("bị kiện") || currentRole.includes("bị cáo")) ? "selected" : "";
      var selYC = (currentRole.includes("yêu cầu") && !currentRole.includes("bị")) ? "selected" : "";
      var selLC = currentRole.includes("làm chứng") ? "selected" : "";
      var selLQ = (!selND && !selBD && !selYC && !selLC) ? "selected" : "";

      return `
        <div class="p-3 mb-2 bg-white border rounded-3 shadow-sm new-party-review-card" id="new_party_card_${i}">
          <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom flex-wrap gap-2">
            <div class="form-check m-0">
              <input class="form-check-input check-add-party" type="checkbox" id="check_party_${i}" checked style="cursor: pointer; width: 1.1rem; height: 1.1rem;">
              <label class="form-check-label fw-bold text-dark ms-1" for="check_party_${i}" style="cursor: pointer; font-size: 13.5px;">
                ${i + 1}. ${safeXh} ${safeName}
              </label>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="text-secondary small fw-bold">Tư cách tố tụng:</span>
              <select class="form-select form-select-sm fw-bold border-primary select-new-party-role" id="select_role_${i}" style="width: auto; font-size: 12px;">
                <option value="Nguyên đơn" ${selND}>Nguyên đơn (Người khởi kiện)</option>
                <option value="Bị đơn" ${selBD}>Bị đơn (Người bị kiện)</option>
                <option value="Người yêu cầu" ${selYC}>Người yêu cầu</option>
                <option value="Người có quyền lợi, nghĩa vụ liên quan" ${selLQ}>Người có quyền lợi, nghĩa vụ liên quan</option>
                <option value="Người làm chứng" ${selLC}>Người làm chứng</option>
              </select>
            </div>
          </div>
          <div class="row g-2 text-muted" style="font-size: 11.5px;">
            <div class="col-md-3"><b>Năm sinh:</b> ${p.namSinh || '---'}</div>
            <div class="col-md-6"><b>Địa chỉ:</b> ${p.diaChi || 'Chưa rõ địa chỉ'}</div>
            <div class="col-md-3"><b>SĐT:</b> ${p.sdt || '---'}</div>
          </div>
        </div>
      `;
    }).join('');

window.moChiTiet = function(idAn) {
  if (!idAn) return;
  window.isCaseMemoryLoaded = false;

  window.currentCaseVariables = {};
  window.currentCaseNarratives = {};

  if (window.a4AutoSaveTimer) {
    clearTimeout(window.a4AutoSaveTimer);
    window.a4AutoSaveTimer = null;
  }
  var ind = document.getElementById('party_editor_autosave_indicator');
  if (ind) ind.innerHTML = '';

  var caseFromRAM = (window.G_Cases || window.G_An) ? (window.G_Cases || window.G_An).find(function(c) { return c.id === idAn; }) : null;

  if (caseFromRAM) {
    if (document.getElementById('det-so')) {
      document.getElementById('det-so').innerText = caseFromRAM.soTL || '---';
      document.getElementById('det-so').setAttribute('data-id', idAn);
    }
    if (document.getElementById('det-ngay')) document.getElementById('det-ngay').innerText = caseFromRAM.ngayTL || '--/--/----';
    if (document.getElementById('det-quanhe')) document.getElementById('det-quanhe').innerText = caseFromRAM.quanHe || '---';

    var isDone = caseFromRAM.liveStatus === "Đã giải quyết" || caseFromRAM.trangThai === "Đã giải quyết";
    var isTDC = caseFromRAM.liveStatus === "Tạm đình chỉ" || caseFromRAM.trangThai === "Tạm đình chỉ";
    var elTrangThai = document.getElementById('det-trangthai');
    var elThoiHan = document.getElementById('det-thoihan');
    var borderEl = document.getElementById('banner-status-border');

    if (isDone) {
      if (elTrangThai) { elTrangThai.innerText = "Đã giải quyết"; elTrangThai.className = "fw-bold text-success text-truncate"; }
      if (elThoiHan) { elThoiHan.innerText = "Hoàn tất"; elThoiHan.className = "fw-bold text-muted"; }
      if (borderEl) borderEl.style.borderLeftColor = "var(--success, #16a34a)";
    } else if (isTDC) {
      if (elTrangThai) { elTrangThai.innerText = "Tạm đình chỉ"; elTrangThai.className = "fw-bold text-secondary text-truncate"; }
      if (elThoiHan) { elThoiHan.innerText = "Đã dừng đếm"; elThoiHan.className = "fw-bold text-secondary"; }
      if (borderEl) borderEl.style.borderLeftColor = "var(--text-sub, #64748b)";
    } else {
      if (elTrangThai) { elTrangThai.innerText = "Đang giải quyết"; elTrangThai.className = "fw-bold text-primary text-truncate"; }
      if (elThoiHan) { elThoiHan.innerText = caseFromRAM.hanGQ || '--/--/----'; elThoiHan.className = "fw-bold text-danger"; }
      if (borderEl) borderEl.style.borderLeftColor = "var(--primary, #1a73e8)";
    }

    var elDrive = document.getElementById('btn-open-drive');
    if (elDrive) {
      if (caseFromRAM.folderUrl && caseFromRAM.folderUrl.includes("http")) {
        elDrive.setAttribute('data-url', caseFromRAM.folderUrl);
        elDrive.classList.remove('disabled');
      } else {
        elDrive.setAttribute('data-url', '');
        elDrive.classList.add('disabled');
      }
    }

    window.loadCaseToA4State(caseFromRAM.chiTietDuongSu || [], caseFromRAM.loaiAn || "", caseFromRAM.quanHe || "");
  }

  window.appNavigate('view-detail');

  google.script.run
    .withSuccessHandler(function(res) {
      if (window.currentCaseId !== idAn) return;
      if (!res || res.error) {
        AppUI.showToast("Không thể tải Cơ sở dữ liệu vụ án: " + (res ? res.error : ""), "warning");
        return;
      }

      window.currentCaseData = res;
      window.currentCaseVariables = res.variables || {};
      window.currentCaseNarratives = res.narratives || {};
      
      window.CURRENT_APP_CONTEXT = {
        scope: "CASE",
        caseInfo: res.info,
        caseParties: res.ds || [],
        donInfo: null
      };
      if (typeof window.updateCopilotScopeBadge === 'function') window.updateCopilotScopeBadge();

      var loaiAn = res.info ? res.info.loaiAn : "";
      var quanHe = res.info ? res.info.quanHe : "";

      window.loadCaseToA4State(res.ds || [], loaiAn, quanHe);

      if (typeof window.renderAllSavedVariableCards === 'function') {
        window.renderAllSavedVariableCards(window.currentCaseVariables, loaiAn, window.currentCaseNarratives);
      }

      if (res.info && res.info.folderUrl) {
        var btnDrive = document.getElementById('btn-open-drive');
        if (btnDrive) {
          btnDrive.setAttribute('data-url', res.info.folderUrl);
          btnDrive.classList.remove('disabled');
        }
        window.refreshDetailFiles();
      }

      window.loadCaseTimeline(idAn);
      window.isCaseMemoryLoaded = true;
    })
    .withFailureHandler(function(err) {
      AppUI.showToast("Lỗi kết nối máy chủ: " + err.message, "error");
    })
    .api_LayDuLieuChiTietAn(idAn);
};

window.loadCaseTimeline = function(idVuAn) {
  var c = document.getElementById('det-timeline-list');
  if (!c) return;
  c.innerHTML = '<div class="text-center p-3 text-muted small"><div class="spinner-border spinner-border-sm me-1 text-primary"></div> Đang nạp timeline...</div>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success || !res.events || res.events.length === 0) {
        c.innerHTML = '<div class="text-center p-3 text-muted small fst-italic">Chưa có mốc lịch trình nào. Bấm "+ Lên lịch" để tạo mốc.</div>';
        return;
      }

      var html = '<div class="timeline-container">';
      res.events.forEach(function(ev) {
        var dotClass = ev.isRoot ? 'root' : (ev.isResult ? (ev.isTDC ? 'tdc' : 'result') : (ev.isPast ? 'past' : ''));
        var cardExtraClass = ev.isResult ? (ev.isTDC ? 'tdc-card' : 'result-card') : '';
        
        var statusBadge = ev.isRoot 
          ? '<span class="badge bg-primary-subtle text-primary border" style="font-size:9px">Gốc thụ lý</span>'
          : (ev.isResult 
              ? (ev.isTDC ? '<span class="badge bg-secondary" style="font-size:9px">Tạm đình chỉ</span>' : '<span class="badge bg-success fw-bold" style="font-size:9px"><i class="fas fa-check me-1"></i>Đã xong</span>')
              : (ev.isPast 
                  ? '<span class="badge bg-light text-secondary border" style="font-size:9px">Đã qua</span>' 
                  : '<span class="badge bg-primary-subtle text-primary" style="font-size:9px">Sắp tới</span>'));

        var btnRedraft = '';
        var kwJson = JSON.stringify(ev.suggestedKeywords || []).replace(/"/g, '&quot;');
        
        if (!ev.isRoot && !ev.isResult) {
          btnRedraft = 
            '<div class="d-flex justify-content-end gap-1 mt-2 pt-1 border-top">' +
              '<button class="btn btn-sm btn-outline-primary py-0 px-2 fw-bold" style="font-size:10px" onclick=\'window.reDraftFromTimeline("' + ev.ngayISO + '", "' + ev.gio + '", "' + ev.noiDung.replace(/"/g, '&quot;') + '", ' + kwJson + ')\' title="Soạn văn bản theo mốc này">' +
                '<i class="fas fa-file-signature me-1"></i> Soạn văn bản' +
              '</button>' +
              '<button class="btn btn-sm btn-light border text-danger py-0 px-1" style="font-size:10px" onclick="window.deleteTimelineEvent(\'' + ev.idLich + '\')" title="Xóa mốc">' +
                '<i class="fas fa-trash-alt"></i>' +
              '</button>' +
            '</div>';
        } else if (ev.isRoot) {
          btnRedraft = 
            '<div class="d-flex justify-content-end mt-2 pt-1 border-top">' +
              '<button class="btn btn-sm btn-outline-success py-0 px-2 fw-bold" style="font-size:10px" onclick=\'window.reDraftFromTimeline("' + ev.ngayISO + '", "08:00", "' + ev.noiDung + '", ["03. thông báo thụ lý vụ án"])\'>' +
                '<i class="fas fa-print me-1"></i> Thông báo thụ lý' +
              '</button>' +
            '</div>';
        }

        html += 
          '<div class="timeline-item animate-fadeIn">' +
            '<div class="timeline-dot ' + dotClass + '"></div>' +
            '<div class="timeline-card ' + cardExtraClass + '">' +
              '<div class="d-flex justify-content-between align-items-center mb-1">' +
                '<b class="text-dark" style="font-size:11.5px">' + (ev.isRoot || ev.isResult ? '' : ev.gio + ' • ') + ev.ngayVN + '</b>' +
                statusBadge +
              '</div>' +

window.loadCaseToA4State = function(dsList, loaiAnOpt, quanHeOpt) {
  window.a4State = [
    { roleKey: 'nd', sameAddress: false, sharedAddress: '', members: [] },
    { roleKey: 'bd', sameAddress: false, sharedAddress: '', members: [] },
    { roleKey: 'lq', sameAddress: false, sharedAddress: '', members: [] },
    { roleKey: 'lc', sameAddress: false, sharedAddress: '', members: [] }
  ];

  var loaiAn = loaiAnOpt || "";
  var quanHe = quanHeOpt || "";

  if (!loaiAn && window.currentCaseData && window.currentCaseData.info) {
    loaiAn = window.currentCaseData.info.loaiAn || "";
    quanHe = window.currentCaseData.info.quanHe || "";
  }
  if (!loaiAn && window.currentCaseId) {
    var cRam = (window.G_Cases || window.G_An || []).find(function(c) { return c.id === window.currentCaseId; });
    if (cRam) {
      loaiAn = cRam.loaiAn || "";
      quanHe = cRam.quanHe || "";
    }
  }

  var loaiAnClean = window.removeAccents ? window.removeAccents(String(loaiAn)).toLowerCase() : String(loaiAn).toLowerCase();
  var quanHeClean = window.removeAccents ? window.removeAccents(String(quanHe)).toLowerCase() : String(quanHe).toLowerCase();
  
  var isVHN = loaiAnClean.includes('hon nhan') && 
              (quanHeClean.includes('thuan tinh') || quanHeClean.includes('cong nhan thuan tinh'));

  if (dsList && Array.isArray(dsList)) {
    var nycCount = 0;

    dsList.forEach(function(d) {
      var roleLower = String(d.tuCach || '').toLowerCase();
      var rKey = 'lq';

      if (isVHN) {
        if (roleLower.includes('làm chứng')) rKey = 'lc';
        else if (roleLower.includes('liên quan')) rKey = 'lq';
        else {
          rKey = (nycCount === 0) ? 'nd' : 'bd';
          nycCount++;
        }
      } else {
        if (roleLower.includes('nguyên đơn') || roleLower.includes('khởi kiện') || roleLower.includes('bị hại')) rKey = 'nd';
        else if (roleLower.includes('bị đơn') || roleLower.includes('bị cáo') || roleLower.includes('bị kiện') || roleLower.includes('bị yêu cầu')) rKey = 'bd';
        else if (roleLower.includes('làm chứng')) rKey = 'lc';
        else if (roleLower.includes('yêu cầu')) {
          rKey = (nycCount === 0) ? 'nd' : 'bd';
          nycCount++;
        }
      }

      var group = window.a4State.find(function(g) { return g.roleKey === rKey; });
      var parsedReps = [];

      if (d.daiDien && String(d.daiDien).trim() !== '') {
        try {
          var rArr = JSON.parse(d.daiDien);
          if (Array.isArray(rArr)) {
            parsedReps = rArr.map(function(r) {
              return {
                id: 'r_' + Math.random().toString(36).substr(2, 9),
                type: String(r.tuCach || r.tu_cach || '').toLowerCase().includes('pháp luật') ? 'pl' : (String(r.tuCach || r.tu_cach || '').toLowerCase().includes('luật sư') ? 'ls' : 'uq'),
                title: r.xungHo || r.xung_ho || 'Ông/Bà',
                name: window.toTitleCase(window.cleanHonorificFromName(r.hoTen || r.ho_ten || '')),
                year: r.namSinh || r.nam_sinh || '',
                address: r.diaChi || r.dia_chi || '',
                phone: r.sdt || '',
                date: r.vanBan || r.date || '',
                position: r.chucVu || r.chuc_vu || ''
              };
            });
          }
        } catch(e) {}
      }

      var rawXh = String(d.xungHo || '').trim();
      var xhTitle = 'Ông/Bà';
      if (rawXh === 'Ông' || rawXh === 'Bà' || rawXh === 'Chị' || rawXh === 'Anh') xhTitle = rawXh;
      else if (rawXh === 'Tổ chức' || rawXh === 'Pháp nhân' || rawXh === 'Công ty') xhTitle = 'Pháp nhân';

      var member = {
        id: 'm_' + Math.random().toString(36).substr(2, 9),
        title: xhTitle,
        name: window.toTitleCase(window.cleanHonorificFromName(d.hoTen || '')),
        year: d.namSinh || '',
        address: d.diaChi || '',
        phone: d.sdt || '',
        idCard: d.cccd || '',
        reps: parsedReps
      };

      if (group) group.members.push(member);
    });
  }

  window.renderA4Editor();
};

window.renderA4Editor = function() {
  var root = document.getElementById('parties-editor-root');
  if (!root) return;
  root.innerHTML = '';

  var loaiAn = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "";
  var quanHe = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.quanHe : "";
  var rolesInfo = window.getProceduralRoleInfo(loaiAn, quanHe);

  var a4RoleConfigs = [
    { key: 'nd', title: rolesInfo.ndTitle, color: 'role-nd' },
    { key: 'bd', title: rolesInfo.bdTitle, color: 'role-bd' },
    { key: 'lq', title: 'NGƯỜI CÓ QUYỀN LỢI, NGHĨA VỤ LIÊN QUAN', color: 'role-lq' },
    { key: 'lc', title: 'NGƯỜI LÀM CHỨNG', color: 'role-lc' }
  ];

  a4RoleConfigs.forEach(function(roleConfig, groupIdx) {
    var group = window.a4State.find(function(g) { return g.roleKey === roleConfig.key; });
    if (!group) {
      group = { roleKey: roleConfig.key, sameAddress: false, sharedAddress: '', members: [] };
      window.a4State.push(group);
    }

    var blockNum = groupIdx + 1;
    var memberCount = group.members.length;
    var displayRoleTitle = roleConfig.title;

    var blockEl = document.createElement('div');

    if (memberCount === 0) {
      blockEl.className = 'party-block empty-block animate-fadeIn';
      blockEl.onclick = function() { window.a4AddMember(group.roleKey, false); };
      blockEl.innerHTML = `
        <div class="d-flex justify-content-between align-items-center w-100">
          <span class="role-title ${roleConfig.color}">
            ${blockNum}. ${displayRoleTitle}
          </span>
          <span class="badge bg-light text-secondary border px-2 py-1" style="font-size: 11px;">+ Thêm người</span>
        </div>`;
    } else {
      blockEl.className = 'party-block animate-fadeIn';

      var headerHtml = `
        <div class="role-title-row">
          <div class="role-title ${roleConfig.color}">
            <span>${blockNum}. ${displayRoleTitle}:</span>
          </div>
          <div class="d-flex align-items-center gap-2 position-relative">
            <button type="button" class="kebab-btn" onclick="window.a4ToggleMenu(event, '${group.roleKey}')" title="Tùy chọn">⋮</button>
            <div class="kebab-dropdown" id="menu-${group.roleKey}">
              <div class="kebab-item" onclick="window.a4AddMember('${group.roleKey}', false)"><i class="fas fa-user-plus me-2 text-primary"></i>Thêm đương sự (Khác địa chỉ)</div>
              <div class="kebab-item" onclick="window.a4AddMember('${group.roleKey}', true)"><i class="fas fa-house-user me-2 text-success"></i>Thêm đương sự (Cùng địa chỉ)</div>
              <div class="kebab-item text-red border-top" onclick="window.a4ClearBlock('${group.roleKey}')"><i class="fas fa-trash-alt me-2 text-danger"></i>Xóa toàn bộ nhóm này</div>
            </div>
          </div>
        </div>`;

      group.members.forEach(function(m, mIdx) {
        var subPrefix = (memberCount > 1) ? `<b class="text-secondary me-1" style="font-size: 13.5px;">${blockNum}.${mIdx + 1}.</b>` : '';
        var isPhapNhan = (m.title === 'Pháp nhân' || m.title === 'Tổ chức');

        var namSinhPart = !isPhapNhan ? `, năm sinh: <input type="text" class="word-input" placeholder="19xx" value="${m.year || ''}" maxlength="20" oninput="window.a4UpdateField('${group.roleKey}','${m.id}','year',this.value)">` : '';
        var cccdPart = !isPhapNhan ? `, CCCD số: <input type="text" class="word-input" placeholder="Chưa có CCCD" value="${m.idCard || ''}" oninput="window.a4UpdateField('${group.roleKey}','${m.id}','idCard',this.value)">` : '';
        var delBtnPart = (memberCount > 1) ? `<span class="btn-del" title="Xóa đương sự này" onclick="window.a4DeleteMember('${group.roleKey}','${m.id}')">✖</span>` : '';

        headerHtml += `
          <div class="party-member-block">
            <div class="party-line">
              ${subPrefix}
              ${window.a4RenderTitleSelect(group.roleKey, m.id, m.title)}
              <input type="text" class="word-input name-highlight" placeholder="Họ và tên *" value="${m.name || ''}" oninput="window.a4UpdateField('${group.roleKey}','${m.id}','name',this.value)" onblur="this.value = window.toTitleCase(window.cleanHonorificFromName(this.value)); window.a4UpdateField('${group.roleKey}','${m.id}','name',this.value)">
              ${namSinhPart} .
              ${delBtnPart}
            </div>

            ${!group.sameAddress ? `
              <div class="party-line">
                <span class="text-secondary">Địa chỉ:</span>
                <input type="text" class="word-input" placeholder="Nhập địa chỉ cư trú / trụ sở..." value="${m.address || ''}" oninput="window.a4UpdateField('${group.roleKey}','${m.id}','address',this.value)"> .
              </div>` : ''}

            <div class="party-line">
              <span class="text-secondary">Điện thoại:</span>
              <input type="text" class="word-input" placeholder="Chưa có SĐT" value="${m.phone || ''}" oninput="window.formatPhoneVNInput(this); window.a4UpdateField('${group.roleKey}','${m.id}','phone',this.value)">
              ${cccdPart} .
              <span class="btn-add-rep ms-2" onclick="window.a4ShowAddRepDialog('${group.roleKey}','${m.id}')">
                <i class="fas fa-user-shield me-1"></i>+ Thêm đại diện / Luật sư
              </span>
            </div>

            ${window.a4RenderRepsListHtml(group.roleKey, m)}
          </div>`;
      });

      if (group.sameAddress && memberCount > 1) {
        headerHtml += `
          <div class="party-member-block mt-2 pt-2 border-top">
            <div class="party-line">
              <b class="text-primary"><i class="fas fa-map-marker-alt text-danger me-1"></i>Cùng địa chỉ:</b>
              <input type="text" class="word-input" placeholder="Nhập địa chỉ cư trú chung..." value="${group.sharedAddress || ''}" oninput="window.a4UpdateSharedAddress('${group.roleKey}', this.value)"> .
            </div>
          </div>`;
      }

      blockEl.innerHTML = headerHtml;
    }

    root.appendChild(blockEl);
  });
};

window.a4RenderTitleSelect = function(roleKey, memberId, selectedTitle) {
  var titles = ['Ông/Bà', 'Ông', 'Bà', 'Anh', 'Chị', 'Pháp nhân'];
  var optionsHtml = titles.map(function(t) {
    var sel = (t === selectedTitle) ? 'selected' : '';
    return '<option value="' + t + '" ' + sel + '>' + t + '</option>';
  }).join('');
  return '<select class="word-select select-title" onchange="window.a4UpdateTitle(\'' + roleKey + '\',\'' + memberId + '\',this.value)">' + optionsHtml + '</select>';
};

  member.reps.forEach(function(r) {
    html += '<div class="party-line mb-1">';
    if (r.type === 'uq') {
      html += `
        <span class="fw-bold text-warning-emphasis">Đại diện theo ủy quyền:</span>
        <select class="word-select select-title" onchange="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','title',this.value)">
          <option value="Ông/Bà" ${r.title === 'Ông/Bà' ? 'selected' : ''}>Ông/Bà</option>
          <option value="Ông" ${r.title === 'Ông' ? 'selected' : ''}>Ông</option>
          <option value="Bà" ${r.title === 'Bà' ? 'selected' : ''}>Bà</option>
        </select>
        <input type="text" class="word-input fw-bold" placeholder="Họ tên người nhận UQ" value="${r.name || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)" onblur="this.value = window.toTitleCase(window.cleanHonorificFromName(this.value)); window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)"> , 
        sinh năm <input type="text" class="word-input" placeholder="19xx" value="${r.year || ''}" maxlength="20" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','year',this.value)"> , 
        địa chỉ <input type="text" class="word-input" placeholder="Nhập địa chỉ..." value="${r.address || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','address',this.value)"> , 
        SĐT <input type="text" class="word-input" placeholder="09xxxx..." value="${r.phone || ''}" oninput="window.formatPhoneVNInput(this); window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','phone',this.value)"> . 
        Theo văn bản ủy quyền ngày <input type="text" class="word-input" placeholder="dd/mm/yyyy" value="${r.date || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','date',this.value)"> .
      `;
    } else if (r.type === 'pl') {
      html += `
        <span class="fw-bold text-warning-emphasis">Đại diện theo pháp luật:</span>
        <select class="word-select select-title" onchange="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','title',this.value)">
          <option value="Ông/Bà" ${r.title === 'Ông/Bà' ? 'selected' : ''}>Ông/Bà</option>
          <option value="Ông" ${r.title === 'Ông' ? 'selected' : ''}>Ông</option>
          <option value="Bà" ${r.title === 'Bà' ? 'selected' : ''}>Bà</option>
        </select>
        <input type="text" class="word-input fw-bold" placeholder="Họ tên người đại diện" value="${r.name || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)" onblur="this.value = window.toTitleCase(window.cleanHonorificFromName(this.value)); window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)"> - 
        Chức vụ: <input type="text" class="word-input" placeholder="Tổng giám đốc / Giám đốc" value="${r.position || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','position',this.value)"> .
      `;
    } else if (r.type === 'ls') {
      html += `
        <span class="fw-bold text-warning-emphasis">Luật sư bảo vệ quyền lợi:</span> Luật sư 
        <input type="text" class="word-input fw-bold" placeholder="Họ tên Luật sư" value="${r.name || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)" onblur="this.value = window.toTitleCase(window.cleanHonorificFromName(this.value)); window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','name',this.value)"> - 
        Văn phòng Luật sư <input type="text" class="word-input" placeholder="Tên tổ chức hành nghề" value="${r.position || ''}" oninput="window.a4UpdateRepField('${roleKey}','${member.id}','${r.id}','position',this.value)"> .
      `;

window.a4UpdateField = function(roleKey, memberId, field, val) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  var m = group ? group.members.find(function(m) { return m.id === memberId; }) : null;
  if (m) {
    m[field] = val;
    window.triggerA4AutoSave();
  }
};

window.a4UpdateTitle = function(roleKey, memberId, val) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  var m = group ? group.members.find(function(m) { return m.id === memberId; }) : null;
  if (m) {
    m.title = val;
    window.renderA4Editor();
    window.triggerA4AutoSave();
  }
};

window.a4UpdateSharedAddress = function(roleKey, val) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  if (group) {
    group.sharedAddress = val;
    window.triggerA4AutoSave();
  }
};

window.a4UpdateRepField = function(roleKey, memberId, repId, field, val) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  var m = group ? group.members.find(function(m) { return m.id === memberId; }) : null;
  var r = m ? m.reps.find(function(r) { return r.id === repId; }) : null;
  if (r) {
    r[field] = val;
    window.triggerA4AutoSave();
  }
};

window.a4AddMember = function(roleKey, isSameAddr) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  if (!group) return;
  group.sameAddress = isSameAddr;
  if (isSameAddr && !group.sharedAddress && group.members.length > 0) {
    group.sharedAddress = group.members[0].address;
  }

  group.members.push({
    id: 'm_' + Math.random().toString(36).substr(2, 9),
    title: 'Ông/Bà',
    name: '',
    year: '',
    address: '',
    phone: '',
    idCard: '',
    reps: []
  });
  window.renderA4Editor();
  window.triggerA4AutoSave();
};

window.a4DeleteMember = function(roleKey, memberId) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  if (!group) return;
  group.members = group.members.filter(function(m) { return m.id !== memberId; });
  if (group.members.length <= 1) group.sameAddress = false;
  window.renderA4Editor();
  window.triggerA4AutoSave();
};

window.a4ClearBlock = function(roleKey) {
  AppUI.confirm("Xóa khối đương sự", "Bạn có chắc chắn muốn xóa tất cả đương sự trong khối này?", "danger", function() {
    var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
    if (group) {
      group.members = [];
      group.sameAddress = false;
      group.sharedAddress = '';
      window.renderA4Editor();
      window.triggerA4AutoSave();
    }
  });
};
window.a4DeleteGroup = window.a4ClearBlock;

window.a4ShowAddRepDialog = function(roleKey, memberId) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  var m = group ? group.members.find(function(m) { return m.id === memberId; }) : null;
  if (!m) return;
  var hasPL = m.reps.some(function(r) { return r.type === 'pl'; });
  
  var msg = "CHỌN TƯ CÁCH ĐẠI DIỆN:\n1. Đại diện theo ủy quyền\n2. Luật sư bảo vệ quyền lợi";
  if (!hasPL) msg += "\n3. Người đại diện theo pháp luật";
  
  var choice = prompt(msg + "\n\n(Nhập số 1, 2 hoặc 3):", "1");

  if (choice === '1') {
    m.reps.push({ id: 'r_' + Math.random().toString(36).substr(2, 9), type: 'uq', title: 'Ông/Bà', name: '', year: '', address: '', phone: '', date: '', position: '' });
    window.renderA4Editor();
    window.triggerA4AutoSave();
  } else if (choice === '2') {
    m.reps.push({ id: 'r_' + Math.random().toString(36).substr(2, 9), type: 'ls', title: 'Ông/Bà', name: '', year: '', address: '', phone: '', date: '', position: '' });
    window.renderA4Editor();
    window.triggerA4AutoSave();
  } else if (choice === '3') {
    m.reps.push({ id: 'r_' + Math.random().toString(36).substr(2, 9), type: 'pl', title: 'Ông/Bà', name: '', year: '', address: '', phone: '', date: '', position: '' });
    window.renderA4Editor();
    window.triggerA4AutoSave();
  }
};

window.a4DeleteRep = function(roleKey, memberId, repId) {
  var group = window.a4State.find(function(g) { return g.roleKey === roleKey; });
  var m = group ? group.members.find(function(m) { return m.id === memberId; }) : null;
  if (m) {
    m.reps = m.reps.filter(function(r) { return r.id !== repId; });
    window.renderA4Editor();
    window.triggerA4AutoSave();
  }
};

window.a4ToggleMenu = function(e, roleKey) {
  e.stopPropagation();
  var menu = document.getElementById('menu-' + roleKey);
  document.querySelectorAll('.kebab-dropdown').forEach(function(m) { if (m !== menu) m.classList.remove('show'); });
  if (menu) menu.classList.toggle('show');
};

window.triggerA4AutoSave = function() {
  clearTimeout(window.a4AutoSaveTimer);
  var ind = document.getElementById('party_editor_autosave_indicator');
  if (ind) ind.innerHTML = '<i class="fas fa-spinner fa-spin text-warning me-1"></i> <span class="text-warning">Đang chờ lưu...</span>';

  window.a4AutoSaveTimer = setTimeout(function() {
    window.saveA4StateToServer(true);
  }, 1200);
};

window.getA4StateAsPartiesArray = function() {
  var partiesArray = [];
  var loaiAn = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "";
  var quanHe = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.quanHe : "";
  var rolesInfo = window.getProceduralRoleInfo(loaiAn, quanHe);

  window.a4State.forEach(function(group) {
    var roleTitle = "Người có quyền lợi, nghĩa vụ liên quan";
    if (group.roleKey === 'nd') roleTitle = rolesInfo.ndRole;
    else if (group.roleKey === 'bd') roleTitle = rolesInfo.bdRole;
    else if (group.roleKey === 'lq') roleTitle = "Người có quyền lợi, nghĩa vụ liên quan";
    else if (group.roleKey === 'lc') roleTitle = "Người làm chứng";

    group.members.forEach(function(m) {
      if (!m.name || m.name.trim() === '') return;

      var repsJsonStr = '';
      if (m.reps && m.reps.length > 0) {
        var formattedReps = m.reps.map(function(r) {
          return {
            tuCach: r.type === 'pl' ? 'Người đại diện theo pháp luật' : (r.type === 'ls' ? 'Luật sư bảo vệ quyền và lợi ích hợp pháp' : 'Người đại diện theo ủy quyền'),
            xungHo: r.title || 'Ông/Bà',
            hoTen: window.toTitleCase(window.cleanHonorificFromName(r.name || '')),
            namSinh: r.year || '',
            diaChi: r.address || '',
            sdt: r.phone || '',
            chucVu: r.position || '',
            vanBan: r.date || ''
          };
        });
        repsJsonStr = JSON.stringify(formattedReps);
      }

      var finalAddress = group.sameAddress ? group.sharedAddress : m.address;
      var savedXh = (m.title === 'Pháp nhân') ? 'Tổ chức' : (m.title || 'Ông/Bà');

      partiesArray.push({
        tuCach: roleTitle,
        xungHo: savedXh,
        hoTen: window.toTitleCase(window.cleanHonorificFromName(m.name.trim())),
        namSinh: m.year || '',
        diaChi: finalAddress || '',
        sdt: m.phone || '',
        cccd: m.idCard || '',
        daiDien: repsJsonStr
      });
    });
  });
  return partiesArray;
};

window.saveA4StateToServer = function(isAuto) {
  if (!window.currentCaseId) return;

  var partiesToSave = window.getA4StateAsPartiesArray();

  if (window.currentCaseData && window.currentCaseData.info && window.currentCaseData.info.id === window.currentCaseId) {
    window.currentCaseData.ds = partiesToSave;
    
    if (window.CURRENT_APP_CONTEXT && window.CURRENT_APP_CONTEXT.scope === "CASE") {
      window.CURRENT_APP_CONTEXT.caseParties = partiesToSave;
    }

    var an = (window.G_Cases || window.G_An || []).find(function(c) { return c.id === window.currentCaseId; });
    if (an) {
      var ndGroup = window.a4State.find(g => g.roleKey === 'nd');
      var bdGroup = window.a4State.find(g => g.roleKey === 'bd');
      
      an.nguyenDon = (ndGroup && ndGroup.members.length > 0) ? ndGroup.members.map(m => m.name).join(", ") : "";
      an.biDon = (bdGroup && bdGroup.members.length > 0) ? bdGroup.members.map(m => m.name).join(", ") : "";
    }
    if (typeof window.runFilterEngine === 'function') window.runFilterEngine();
  }

  google.script.run
    .withSuccessHandler(function(res) {
      var ind = document.getElementById('party_editor_autosave_indicator');
      if (res && res.success) {
        if (ind) {
          ind.innerHTML = '<i class="fas fa-check-circle text-success me-1"></i> <span class="text-success">Đã tự động lưu</span>';
          setTimeout(function() { if (ind) ind.innerHTML = ''; }, 3000);
        }
      }
    })
    .api_UpdateAllParties(window.currentCaseId, partiesToSave);
};

window.searchCasesForDropdown = function(keyword, resultsContainerId, clickCallbackName) {
  var resultsContainer = document.getElementById(resultsContainerId);
  if (!keyword || keyword.trim().length < 2) {
    if (resultsContainer) resultsContainer.style.display = 'none';
    return;
  }
  var q = window.removeAccents ? window.removeAccents(keyword.toLowerCase().trim()) : keyword.toLowerCase().trim();
  var matches = (window.G_Cases || window.G_An || []).filter(function(c) {

function checkTemplateMatchesResolution(tplName, resLoai) {
  if (!tplName || !resLoai) return false;
  var tClean = window.removeAccents ? window.removeAccents(String(tplName)).toLowerCase() : String(tplName).toLowerCase();
  var rClean = window.removeAccents ? window.removeAccents(String(resLoai)).toLowerCase() : String(resLoai).toLowerCase();

  if (rClean.includes("ttlh") || rClean.includes("thuan tinh")) return tClean.includes("thuan tinh") || tClean.includes("45.") || tClean.includes("ttlh");
  if (rClean.includes("qdcntt") || rClean.includes("thoa thuan") || rClean.includes("hoa giai thanh")) {
    if (rClean.includes("hgdt") || rClean.includes("doi thoai")) return tClean.includes("doi thoai") || tClean.includes("hgdt") || tClean.includes("62.");
    return tClean.includes("thoa thuan") || tClean.includes("25.") || tClean.includes("qdcntt");
  }
  if (rClean.includes("ban an") || rClean.includes("xet xu")) return tClean.includes("ban an") || tClean.includes("40.") || tClean.includes("60.");
  if (rClean.includes("dinh chi") && !rClean.includes("tam dinh chi")) return (tClean.includes("dinh chi") || tClean.includes("29.")) && !tClean.includes("tam dinh chi");
  if (rClean.includes("tam dinh chi")) return tClean.includes("tam dinh chi") || tClean.includes("27.");
  if (rClean.includes("gia han")) return tClean.includes("gia han") || tClean.includes("26.");
  if (rClean.includes("viec dan su") || rClean.includes("vds")) return tClean.includes("viec dan su") || tClean.includes("52.");
  if (rClean.includes("chuyen ho so") || rClean.includes("chuyen vu an")) return tClean.includes("chuyen");
  if (rClean.includes("nhap vu an") || rClean.includes("nhap vu viec")) return tClean.includes("nhap");
  return tClean.includes(rClean);
}

function formatToDateInput(dateStr) {
  if (!dateStr) return "";
  var s = String(dateStr).trim();
  if (s.includes('/')) {
    var p = s.split('/');
    if (p.length === 3) return p[2] + "-" + ('0' + p[1]).slice(-2) + "-" + ('0' + p[0]).slice(-2);
  }
  if (s.includes('-')) {
    var p2 = s.split('-');
    if (p2.length === 3 && p2[0].length === 4) return s;
  }
  return "";
}

window.filterAndRenderTemplates = function(idAn, autoKeywords) {
  var tplContainer = document.getElementById('list-templates');
  if (!tplContainer || !currentLoadedTemplates || currentLoadedTemplates.length === 0) return;

  var htmlRows = [];

  currentLoadedTemplates.forEach(function(t) {
    var matchNum = t.name.match(/^\s*0*(\d+)[a-zA-Z]?\s*\./);
    var num = matchNum ? parseInt(matchNum[1], 10) : 0;
    var nameLower = t.name.toLowerCase();

    var badge = '<span class="badge bg-light text-secondary border ms-2" style="font-size:9px">Chung</span>';
    if (num >= 41 && num <= 45) badge = '<span class="badge bg-danger-subtle text-danger border border-danger ms-2" style="font-size:9px">HNGĐ</span>';
    else if (num >= 53 && num <= 60) badge = '<span class="badge bg-primary-subtle text-primary border border-primary ms-2" style="font-size:9px">Hành chính</span>';
    else if (num >= 46 && num <= 52) badge = '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning ms-2" style="font-size:9px">Việc DS</span>';
    else if (num >= 61 && num <= 62) badge = '<span class="badge bg-success-subtle text-success border border-success ms-2" style="font-size:9px">HGĐT</span>';
    else if ((num >= 18 && num <= 40) || (num >= 1 && num <= 3)) badge = '<span class="badge bg-info-subtle text-info border border-info ms-2" style="font-size:9px">Dân sự</span>';

    var isAutoCheck = false;
    if (autoKeywords && autoKeywords.length > 0) {
      isAutoCheck = autoKeywords.some(function(kw) {
        var kwClean = kw.toLowerCase().trim();
        var mNum = kwClean.match(/^0*(\d+)\./);
        if (mNum) return num === parseInt(mNum[1], 10);
        return nameLower.includes(kwClean);
      });
    }

    var checkedAttr = isAutoCheck ? 'checked' : '';

    htmlRows.push(
      `<label class="list-group-item d-flex gap-3 align-items-center py-2 tpl-item-row" data-name="${t.name.replace(/"/g, '&quot;')}" data-num="${num}">
        <input class="form-check-input flex-shrink-0 tpl-merge-check shadow-sm" type="checkbox" value="${t.id}" data-name="${t.name.replace(/"/g, '&quot;')}" ${checkedAttr} onchange="window.updateDraftBatchSummary()">
        <span class="small fw-bold text-dark d-flex align-items-center flex-grow-1"><i class="far fa-file-word text-primary me-2"></i>${t.name} ${badge}</span>
      </label>`
    );
  });

  tplContainer.innerHTML = htmlRows.join('');
  window.updateDraftBatchSummary();
};

      }).join('');

  var anFromRAM = (window.G_Cases || []).find(c => c.id === idAn);
  if (anFromRAM && anFromRAM.chiTietDuongSu && anFromRAM.chiTietDuongSu.length > 0) {

                 '<span class="badge bg-secondary me-2" style="font-size:8px">' + d.tuCach + '</span>' +
                 '<b>' + d.hoTen + '</b>' +
               '</label>' +
             '</div>';
    }).join('');
    window.updateDraftBatchSummary();
    return;
  }

  dsContainer.innerHTML = '<p class="text-warning small text-center mt-3">Chưa có thông tin đương sự.</p>';
  window.updateDraftBatchSummary();
};

window.doActualMailMergePostflight = function() {
  var payload = window.pendingMergePayload;
  if (!payload) return;

  isMergingDocument = true;
  window.forceCleanupModals();

  var taskId = "task_merge_an_" + new Date().getTime();
  var anInfo = (window.G_Cases || []).find(function(c) { return c.id === payload.idVuAn; });
  var caseName = anInfo ? anInfo.soTL : "Hồ sơ án";
  AppUI.addBackgroundTask(taskId, "Văn bản Án: " + caseName);

  setTimeout(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        isMergingDocument = false;
        if (res && res.success) {
          
          if (payload.trieuTapDate && payload.trieuTapTime) {
            var tenDs = "Đương sự";
            if (payload.partiesOverride && payload.partiesOverride.length > 0) {
              var ndNames = payload.partiesOverride.filter(p => String(p.tuCach).toLowerCase().includes("nguyên đơn") || String(p.tuCach).toLowerCase().includes("yêu cầu")).map(p => p.hoTen);
              var bdNames = payload.partiesOverride.filter(p => String(p.tuCach).toLowerCase().includes("bị đơn")).map(p => p.hoTen);
              if (ndNames.length > 0) { tenDs = ndNames[0] + (bdNames.length > 0 ? " & " + bdNames[0] : ""); } 
              else if (bdNames.length > 0) { tenDs = bdNames[0]; }
            }
            var cleanNo = anInfo ? anInfo.soTL.split('/')[0].trim() : "Hồ sơ";
            var lichNoiDung = `[${cleanNo}] Triệu tập: ${tenDs} - (${payload.noiDungThem || "Làm việc"})`;

            google.script.run.api_LuuLichMoi_Logic({ idVuAn: payload.idVuAn, ngay: payload.trieuTapDate, gio: payload.trieuTapTime, noiDung: lichNoiDung });
          }

          if (payload.reminderDays > 0) {
            google.script.run.api_LuuLichNhacNho({ idVuAn: payload.idVuAn, ngayBatDau: payload.ngayBanHanh, days: payload.reminderDays, noiDung: payload.reminderText });
          }

          if (payload.isFormalPromulgation) {
            var payloadRes = { idVuAn: payload.idVuAn, resultType: payload.changerType, resultNo: payload.soPhatHanh, resultDate: payload.ngayBanHanh };
            google.script.run.withSuccessHandler(function(resUpdate) {
              var an = (window.G_Cases || window.G_An || []).find(function(c) { return c.id === payload.idVuAn; });
              var pParts = String(payload.ngayBanHanh || "").split('-');
              var dateVnFormat = pParts.length === 3 ? (pParts[2]+"/"+pParts[1]+"/"+pParts[0]) : payload.ngayBanHanh;
              
              var isProcedural = payload.changerType.toLowerCase().includes("tạm đình chỉ") || payload.changerType.toLowerCase().includes("gia hạn") || payload.changerType.toLowerCase().includes("tiếp tục");
              var abbrType = window.standardizeResolutionAbbr(payload.changerType);
              var resStr = isProcedural ? "" : (abbrType + "\n" + payload.soPhatHanh + "\n" + dateVnFormat);

              if (an) {
                an.ketQuaGiaiQuyet = resStr;
                if (payload.changerType.toLowerCase().includes("tạm đình chỉ")) an.trangThai = "Tạm đình chỉ";
                else if (payload.changerType.toLowerCase().includes("gia hạn") || payload.changerType.toLowerCase().includes("tiếp tục")) an.trangThai = "Đang giải quyết";
                else an.trangThai = "Đã giải quyết";
                if (resUpdate && resUpdate.hanGQ) an.hanGQ = resUpdate.hanGQ;
                if (typeof calculateLiveStatus === 'function') calculateLiveStatus(an);
              }

              if (window.currentCaseData && window.currentCaseData.info && window.currentCaseData.info.id === payload.idVuAn) {
                window.currentCaseData.info.ketQuaGiaiQuyet = resStr;
                window.currentCaseData.info.trangThai = (an ? an.trangThai : "Đã giải quyết");
                if (resUpdate && resUpdate.hanGQ) window.currentCaseData.info.hanGQ = resUpdate.hanGQ;
              }

              if (typeof window.runFilterEngine === 'function') window.runFilterEngine();
              if (document.getElementById('view-detail').style.display === 'block') window.moChiTiet(payload.idVuAn);
            }).api_UpdateCaseResolution(payloadRes);
          }

          if (payload.isThongBaoThuLy && anInfo) {
            var reversePayload = { idVuAn: payload.idVuAn, loaiAn: anInfo.loaiAn, quanHe: anInfo.quanHe, parties: payload.partiesOverride };
            google.script.run.api_CapNhatNguocTuThongBaoThuLy(reversePayload);
          }

          var linksHtml = (res.files || []).map(function(f) {
            var docxBtn = f.docxUrl ? `<a href="${f.docxUrl}" target="_blank" class="btn btn-sm btn-outline-secondary shadow-sm ms-1" title="Tải file Word (.docx)"><i class="fas fa-download"></i> .docx</a>` : "";
            return `<div class="d-flex align-items-center mb-1 w-100 animate-fadeIn"><a href="${f.url}" target="_blank" class="btn btn-outline-primary btn-sm text-truncate flex-grow-1" style="text-align: left;"><i class="fas fa-file-word me-1"></i>${f.name}</a>${docxBtn}</div>`;
          }).join('');
          
          AppUI.completeBackgroundTask(taskId, true, linksHtml);

          setTimeout(function() {
            if (document.getElementById('view-detail').style.display === 'block') window.moChiTiet(payload.idVuAn);
          }, 1500);

        } else { 
          AppUI.completeBackgroundTask(taskId, false, res.error); 
        }
      })
      .withFailureHandler(function(err) {
        isMergingDocument = false; 
        AppUI.completeBackgroundTask(taskId, false, err.message);
      })
      .api_RunMailMergeV3_Logic(payload);
  }, 50);
};

function analyzeTemplateRequirements(selectedTpls) {
  var requirements = {
    needsSchedule: false,      // Cần ngày/giờ triệu tập, làm việc
    needsAgreement: false,     // Cần nội dung thỏa thuận, hòa giải thành
    needsPartyDetails: false,  // Cần nhân thân chi tiết (năm sinh, địa chỉ)
    scheduleTemplates: [],
    agreementTemplates: []
  };

  selectedTpls.forEach(function(t) {
    var rawName = t.getAttribute('data-name') || "";
    var nameLower = rawName.toLowerCase();
    var matchNum = rawName.match(/^\s*0*(\d+)[a-zA-Z]?\s*\./);
    var num = matchNum ? parseInt(matchNum[1], 10) : 0;

    // Chỉ nhóm biểu mẫu Triệu tập / Phiên họp / Xét xử mới cần ngày giờ
    var isScheduleTpl = (num === 4 || num === 16 || num === 18 || num === 31 || num === 32 || num === 34 || num === 36 || num === 48 || num === 54) ||
                        (nameLower.includes("triệu tập") || nameLower.includes("phiên họp") || nameLower.includes("đưa vụ án ra xét xử") || nameLower.includes("phiên tòa"));
    
    if (isScheduleTpl) {
      requirements.needsSchedule = true;
      requirements.scheduleTemplates.push(rawName);
    }

    // Nhóm biểu mẫu Quyết định thỏa thuận / Ly hôn cần nội dung thỏa thuận
    var isAgreementTpl = (num === 22 || num === 25 || num === 44 || num === 45 || num === 57 || num === 58 || num === 61 || num === 62) ||
                         (nameLower.includes("công nhận sự thỏa thuận") || nameLower.includes("thuận tình ly hôn") || nameLower.includes("kết quả hòa giải"));
    
    if (isAgreementTpl) {
      requirements.needsAgreement = true;
      requirements.agreementTemplates.push(rawName);
    }

    // Nhóm thông báo thụ lý cần nhân thân đầy đủ
    if (num === 3 || num === 41 || num === 46 || num === 53 || nameLower.includes("thụ lý")) {
      requirements.needsPartyDetails = true;
    }
  });

  return requirements;
}

window.executeMailMergeV3 = function() {
  if (isMergingDocument) return;

  var idAn = document.getElementById('draft-selected-case-id').value;
  if (!idAn) return AppUI.alert("Nhắc nhở", "Vui lòng chọn một vụ án ở Bước 1!");

  var tplNodes = document.querySelectorAll('.tpl-merge-check:checked');
  if (tplNodes.length === 0) return AppUI.alert("Nhắc nhở", "Vui lòng chọn ít nhất một biểu mẫu ở Bước 2!");

  var dsNodes = document.querySelectorAll('.ds-merge-check:checked');
  if (dsNodes.length === 0) return AppUI.alert("Nhắc nhở", "Vui lòng chọn ít nhất một đương sự ở Bước 3!");

  var selectedTpls = Array.from(tplNodes);
  var extNgay = document.getElementById('ext_ngayTrieuTap').value;
  var extGio = document.getElementById('ext_gioTrieuTap').value;
  var soPhatHanh = document.getElementById('ext_soPhatHanh').value.trim();
  var ngayBanHanh = document.getElementById('ext_ngayBanHanh').value;
  var extDiaDiem = document.getElementById('ext_diaDiem') ? document.getElementById('ext_diaDiem').value : "Trụ sở Tòa án";
  var noiDungThem = document.getElementById('ext_noiDung').value.trim() || "Làm rõ một số vấn đề liên quan đến vụ án";
  var extXhThuKy = document.getElementById('ext_xhThuKy') ? document.getElementById('ext_xhThuKy').value : "";
  var extTenThuKy = document.getElementById('ext_tenThuKy') ? document.getElementById('ext_tenThuKy').value : "";

  // Phân loại nghiệp vụ phán quyết & Mốc thời hạn 24h
  var reminderDays = 0, reminderText = "";
  var isStatusChanger = false, changerType = "";
  var isThongBaoThuLy = false;

  selectedTpls.forEach(function(t) {
    var name = t.getAttribute('data-name').toLowerCase();
    var isQuyetDinhOrBanAn = name.includes("quyết định") || name.includes("qđ") || name.includes("bản án");

    if (isQuyetDinhOrBanAn) {
      if (name.includes("đình chỉ") && !name.includes("tạm đình chỉ")) { isStatusChanger = true; changerType = "Đình chỉ"; }
      else if (name.includes("tạm đình chỉ")) { isStatusChanger = true; changerType = "Tạm đình chỉ"; }
      else if (name.includes("tiếp tục giải quyết")) { isStatusChanger = true; changerType = "Tiếp tục giải quyết"; }
      else if (name.includes("gia hạn")) { isStatusChanger = true; changerType = "Gia hạn"; }
      else if (name.includes("thỏa thuận") || name.includes("hòa giải thành")) { isStatusChanger = true; changerType = "QĐCNTT"; }
      else if (name.includes("thuận tình ly hôn")) { isStatusChanger = true; changerType = "QĐCN-TTLH"; }
      else if (name.includes("chuyển hồ sơ") || name.includes("chuyển vụ án")) { isStatusChanger = true; changerType = "Chuyển hồ sơ"; }
      else if (name.includes("nhập vụ án") || name.includes("nhập vụ việc")) { isStatusChanger = true; changerType = "Nhập vụ án"; }
      else if (name.includes("trả hồ sơ") || name.includes("điều tra bổ sung")) { isStatusChanger = true; changerType = "Trả hồ sơ ĐTBS"; }
      else if (name.includes("giải quyết việc dân sự") || name.includes("giải quyết việc")) { isStatusChanger = true; changerType = "Quyết định giải quyết việc DS"; }
      else if (name.includes("bản án")) { isStatusChanger = true; changerType = "Bản án sơ thẩm"; }
      else if (name.includes("kết quả hòa giải đối thoại") || name.includes("đối thoại thành")) { isStatusChanger = true; changerType = "QĐCN-HGĐT"; }
    }

    if (name.includes("hòa giải thành") || name.includes("tự nguyện ly hôn") || name.includes("đối thoại thành")) {
      if (name.includes("đối thoại") || name.includes("hgđt")) {
        reminderDays = Math.max(reminderDays, 15); 
        reminderText = "Hết thời hạn 15 ngày có ý kiến (sang ngày thứ 16) - Ra Quyết định công nhận kết quả đối thoại/hòa giải thành.";
      } else {
        reminderDays = Math.max(reminderDays, 7); 
        reminderText = "Đã đủ thời hạn 07 ngày hòa giải thành (sang ngày thứ 8) - Ra Quyết định công nhận sự thỏa thuận của đương sự.";
      }
    }
    if (name.includes("thông báo thụ lý")) isThongBaoThuLy = true;
  });

  var isFormalPromulgation = isStatusChanger && Boolean(soPhatHanh);

  // Lấy danh sách đương sự từ RAM Client
  var currentA4Parties = [];
  if (window.currentCaseData && window.currentCaseData.info && window.currentCaseData.info.id === idAn) {
    currentA4Parties = window.getA4StateAsPartiesArray();
  } else {
    var anFromRAM = (window.G_Cases || window.G_An || []).find(c => c.id === idAn);
    if (anFromRAM && anFromRAM.chiTietDuongSu) currentA4Parties = anFromRAM.chiTietDuongSu;
  }

  if (window.compileDynamicVariables && window.currentCaseVariables) {
    window.compileDynamicVariables(window.currentCaseVariables, currentA4Parties);
  }

  // Tiền kiểm tại chỗ 0ms
  var req = analyzeTemplateRequirements(selectedTpls);
  var missingWarnings = [];

  // Chỉ cảnh báo nếu mẫu được chọn thực sự cần ngày/giờ làm việc
  if (req.needsSchedule && (!extNgay || !extGio)) {
    var tplNamesStr = req.scheduleTemplates.map(function(s) { return `"${s}"`; }).join(", ");
    missingWarnings.push(`Chưa nhập Ngày và Giờ triệu tập (Cần thiết cho: ${tplNamesStr}).`);
  }

  // Chỉ cảnh báo nếu mẫu được chọn là Quyết định thỏa thuận mà chưa có nội dung thỏa thuận
  if (req.needsAgreement) {
    var availableVars = window.currentCaseVariables || {};
    var hasAgreementText = availableVars["{Nội dung thỏa thuận}"] || availableVars["{nội dung thỏa thuận}"] ||
                           availableVars["{Quan hệ hôn nhân}"] || availableVars["{Thỏa thuận con chung}"];
    if (!hasAgreementText || String(hasAgreementText).trim() === "") {
      var agTplNamesStr = req.agreementTemplates.map(function(s) { return `"${s}"`; }).join(", ");
      missingWarnings.push(`Hồ sơ chưa có {Nội dung thỏa thuận} (Cần thiết cho: ${agTplNamesStr}).`);
    }
  }

  // Cảnh báo nếu mẫu thụ lý bị khuyết năm sinh/địa chỉ
  if (req.needsPartyDetails) {
    (currentA4Parties || []).forEach(function(p) {
      if (p.xungHo !== "Tổ chức" && (!p.namSinh || String(p.namSinh).trim() === "")) {
        missingWarnings.push(`Đương sự <b>${p.hoTen}</b> chưa có Năm sinh.`);
      }
      if (!p.diaChi || String(p.diaChi).trim() === "") {
        missingWarnings.push(`Đương sự <b>${p.hoTen}</b> chưa có Địa chỉ cư trú.`);
      }
    });
  }

  window.pendingMergePayload = {
    templateIds: selectedTpls.map(function(t) { return t.value; }), 
    selectedIndices: Array.from(dsNodes).map(function(d) { return parseInt(d.value); }),
    idVuAn: idAn, 
    ngayBanHanh: ngayBanHanh, 
    trieuTapDate: extNgay, 
    trieuTapTime: extGio,
    diaDiemLamViec: extDiaDiem, 
    noiDungThem: noiDungThem, 
    soPhatHanh: soPhatHanh, 
    xhThuKy: extXhThuKy,
    tenThuKy: extTenThuKy,
    isMissingLocation: false,
    partiesOverride: currentA4Parties,
    customVariables: window.currentCaseVariables || {},
    reminderDays: reminderDays,
    reminderText: reminderText,
    isStatusChanger: isStatusChanger,
    changerType: changerType,
    isThongBaoThuLy: isThongBaoThuLy,
    isFormalPromulgation: isFormalPromulgation
  };

  if (missingWarnings.length > 0) {
    var listContainer = document.getElementById('preflight_missing_list_container');
    var countBadge = document.getElementById('preflight_missing_count');
    if (countBadge) countBadge.innerText = missingWarnings.length + " lưu ý";

    if (listContainer) {
      listContainer.innerHTML = missingWarnings.map(function(item) {
        return `<div class="p-2 border rounded bg-white text-danger fw-bold d-flex align-items-center mb-1" style="font-size: 11.5px;">
                  <i class="fas fa-exclamation-triangle me-2 text-warning flex-shrink-0"></i>
                  <span>${item}</span>
                </div>`;
      }).join('');
    }

    var modalEl = document.getElementById('modalPreflightWarning');
    if (modalEl) {
      bootstrap.Modal.getOrCreateInstance(modalEl).show();
    } else {
      window.doActualMailMergePostflight();
    }
  } else {
    window.doActualMailMergePostflight();
  }
};

  if (inSoDonEl) {
    inSoDonEl.setAttribute('list', 'dl_sodon_trichxuat');
    inSoDonEl.value = '';
  }

  var inQhEl = document.getElementById('in_quanHe');
  if (inQhEl) inQhEl.oninput = window.handleCaseTypeChangeV3;

  var modalEl = document.getElementById('modalThemMoi');
  if (modalEl) {

};

window.chuyenDonSangThuLy = function(idDon) {
  if (!idDon) return;
  
  var targetDon = null;
  if (typeof G_Don !== 'undefined' && Array.isArray(G_Don)) {
    targetDon = G_Don.find(function(d) { return d.id === idDon; });
  }

  window.moModalThemMoi();

  if (targetDon) {
    window.fillDonDataToThuLyForm(targetDon);
    AppUI.showToast("Đã chuyển thông tin Đơn số " + targetDon.soDon + " sang biểu mẫu thụ lý!", "success");
  } else {
    AppUI.showToast("Đang tải dữ liệu đơn từ máy chủ...", "");
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && !res.error) {
          var pseudoDon = {
            id: res.idDon || idDon,
            soDon: res.info ? res.info.soDon : "",
            loaiAn: res.info ? res.info.loaiAn : "2. Dân sự",
            quanHe: res.info ? res.info.quanHe : "",
            chiTietDuongSu: res.ds || []
          };
          window.fillDonDataToThuLyForm(pseudoDon);
          AppUI.showToast("Đã trích xuất dữ liệu đơn sang biểu mẫu thụ lý!", "success");
        } else {
          AppUI.alert("Lỗi", "Không thể nạp dữ liệu đơn: " + (res ? res.error : ""));
        }
      })
      .withFailureHandler(function(err) {

      .api_RutTrichThongTinDon(idDon);

window.thucHienRutTrichTuDon = function() {
  var soDonInput = document.getElementById('in_soDon_trichXuat');
  var soDon = soDonInput ? soDonInput.value.trim().toLowerCase() : "";
  if (!soDon) {
    AppUI.alert("Nhắc nhở", "Vui lòng nhập hoặc chọn Số đơn cần trích xuất.");
    return;
  }

  var cleanSearchNo = soDon.split('/')[0].trim();
  var donMatch = (window.G_Don || []).find(function(d) { 
    var cleanDNo = String(d.soDon || "").toLowerCase().split('/')[0].trim();
    return cleanDNo === cleanSearchNo || String(d.soDon || "").toLowerCase() === soDon; 
  });

  if (donMatch) {
    window.fillDonDataToThuLyForm(donMatch);
    AppUI.showToast("Đã rút trích dữ liệu Đơn số " + donMatch.soDon + "!", "success");
    return;
  }

  AppUI.showToast("Đang tra cứu từ máy chủ...", "");
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.error) { AppUI.alert("Lỗi", res.error); return; }
      AppUI.showToast("Trích xuất dữ liệu thành công!", "success");

      var pseudoDon = {
        id: res.idDon || "",
        soDon: soDon,
        loaiAn: res.info ? res.info.loaiAn : "2. Dân sự",
        quanHe: res.info ? res.info.quanHe : "",
        chiTietDuongSu: res.ds || []
      };
      window.fillDonDataToThuLyForm(pseudoDon);
    })
    .withFailureHandler(function(err) { AppUI.showToast("Lỗi mạng: " + err.message, "error"); })
    .api_RutTrichThongTinDon(soDon);
};

window.fillDonDataToThuLyForm = function(don) {
  var modalEl = document.getElementById('modalThemMoi');
  if (modalEl && don.id) modalEl.setAttribute('data-bridge-don-id', don.id);

  if (don.loaiAn && document.getElementById('in_loaiAn')) {
    document.getElementById('in_loaiAn').value = don.loaiAn;
  }

  if (don.quanHe && document.getElementById('in_quanHe')) {
    document.getElementById('in_quanHe').value = don.quanHe;
  }

  window.handleCaseTypeChangeV3();

  ['ND', 'BD'].forEach(function(t) {
    var cont = document.getElementById('container-' + t);
    if (cont) cont.innerHTML = '';
  });

  var qhLower = String(don.quanHe || "").toLowerCase();
  var isThuanTinhLyHon = qhLower.includes("thuận tình") || qhLower.includes("thuan tinh");

  if (don.chiTietDuongSu && don.chiTietDuongSu.length > 0) {
    if (isThuanTinhLyHon) {
      if (don.chiTietDuongSu[0]) window.addPartyRowV3('ND', false, don.chiTietDuongSu[0]);
      else window.addPartyRowV3('ND', false);

      if (don.chiTietDuongSu[1]) window.addPartyRowV3('BD', false, don.chiTietDuongSu[1]);
      else window.addPartyRowV3('BD', false);

      for (var k = 2; k < don.chiTietDuongSu.length; k++) {
        window.addPartyRowV3('BD', true, don.chiTietDuongSu[k]);
      }
    } else {
      var hasND = false, hasBD = false;

      don.chiTietDuongSu.forEach(function(d) {
        var tcLower = String(d.tuCach || "").toLowerCase();
        var targetType = 'BD';
        if (tcLower.includes('khởi kiện') || tcLower.includes('yêu cầu') || tcLower.includes('bị hại') || tcLower.includes('nguyên đơn')) {
          targetType = 'ND';
          hasND = true;
        } else {
          hasBD = true;
        }

        window.addPartyRowV3(targetType, true, d);
      });

      if (!hasND) window.addPartyRowV3('ND', false);
      if (!hasBD) window.addPartyRowV3('BD', false);
    }
  } else {
    window.addPartyRowV3('ND', false);
    window.addPartyRowV3('BD', false);
  }
};

window.thucHienThuLyV3 = function() {
  if (isSavingCase) return;

  var soTL = document.getElementById('in_soTL') ? document.getElementById('in_soTL').value.trim() : "";
  var ngayTL = document.getElementById('in_ngayTL') ? document.getElementById('in_ngayTL').value : "";
  var loaiAn = document.getElementById('in_loaiAn') ? document.getElementById('in_loaiAn').value : "2. Dân sự";
  var quanHe = document.getElementById('in_quanHe') ? document.getElementById('in_quanHe').value.trim() : "";

  if (!soTL || !ngayTL || !quanHe) {
    AppUI.alert("Nhập thiếu", "Vui lòng nhập đầy đủ Số thụ lý, Ngày thụ lý và Quan hệ tranh chấp / Tội danh!");
    return;
  }

  var rolesInfo = window.getProceduralRoleInfo(loaiAn, quanHe);

  var data = {
    soTL: soTL,
    ngayTL: ngayTL,
    loaiAn: loaiAn,
    quanHe: quanHe,
    duongSu: []
  };

  var ndRows = document.querySelectorAll('#container-ND .party-row-v3');
  ndRows.forEach(function(row) {
    var hoTen = row.querySelector('.in-hoten') ? row.querySelector('.in-hoten').value.trim() : "";
    if (hoTen) {
      data.duongSu.push({
        tuCach: rolesInfo.ndRole,
        xungHo: row.querySelector('.in-xungho') ? row.querySelector('.in-xungho').value : "Ông/Bà",
        hoTen: window.toTitleCase(window.cleanHonorificFromName(hoTen)),
        namSinh: row.querySelector('.in-namsinh') ? row.querySelector('.in-namsinh').value.trim() : "",
        diaChi: row.querySelector('.in-diachi') ? row.querySelector('.in-diachi').value.trim() : "",
        sdt: row.querySelector('.in-sdt') ? row.querySelector('.in-sdt').value.trim() : "",
        cccd: row.querySelector('.in-cccd') ? row.querySelector('.in-cccd').value.trim() : "",
        daiDien: ""
      });
    }
  });

  var bdRows = document.querySelectorAll('#container-BD .party-row-v3');
  bdRows.forEach(function(row) {
    var hoTen = row.querySelector('.in-hoten') ? row.querySelector('.in-hoten').value.trim() : "";
    if (hoTen) {
      data.duongSu.push({
        tuCach: rolesInfo.bdRole,
        xungHo: row.querySelector('.in-xungho') ? row.querySelector('.in-xungho').value : "Ông/Bà",
        hoTen: window.toTitleCase(window.cleanHonorificFromName(hoTen)),
        namSinh: row.querySelector('.in-namsinh') ? row.querySelector('.in-namsinh').value.trim() : "",
        diaChi: row.querySelector('.in-diachi') ? row.querySelector('.in-diachi').value.trim() : "",
        sdt: row.querySelector('.in-sdt') ? row.querySelector('.in-sdt').value.trim() : "",
        cccd: row.querySelector('.in-cccd') ? row.querySelector('.in-cccd').value.trim() : "",
        daiDien: ""
      });
    }
  });

  if (data.duongSu.length === 0) {
    AppUI.alert("Nhập thiếu", "Vui lòng nhập ít nhất 1 đương sự!");
    return;
  }

  var feeMode = document.querySelector('input[name="in_fee_mode"]:checked');
  if (feeMode && feeMode.value === 'RECEIPT') {
    var soBL = document.getElementById('in_fee_sobl') ? document.getElementById('in_fee_sobl').value.trim() : "";
    var ngayBL = document.getElementById('in_fee_ngay') ? document.getElementById('in_fee_ngay').value : "";
    var soTienBL = document.getElementById('in_fee_sotien') ? document.getElementById('in_fee_sotien').value.trim() : "";
    var coQuanBL = document.getElementById('in_fee_coquan') ? document.getElementById('in_fee_coquan').value.trim() : "";

    if (soBL || soTienBL) {
      data.anPhiInfo = {
        soBL: soBL,
        ngay: ngayBL,
        soTien: soTienBL,
        coQuan: coQuanBL,
        text: `Số tiền tạm ứng án phí ${soTienBL ? soTienBL + 'đ ' : ''}đã nộp theo Biên lai số ${soBL || '........'} ngày ${ngayBL ? ngayBL.split('-').reverse().join('/') : '........'} của ${coQuanBL || 'Chi cục Thi hành án dân sự tỉnh Lâm Đồng'}`
      };
    }
  }

  isSavingCase = true;
  var modalEl = document.getElementById('modalThemMoi');
  var bridgeDonId = modalEl ? modalEl.getAttribute('data-bridge-don-id') : null;
  if (bridgeDonId) data.idDon = bridgeDonId;

  if (modalEl) {
    var inst = bootstrap.Modal.getInstance(modalEl);
    if (inst) inst.hide();
  }

  AppUI.showToast("Đang thụ lý và khởi tạo hồ sơ...", "");

  google.script.run
    .withSuccessHandler(function(res) {
      isSavingCase = false;
      if (res && res.success) {
        AppUI.showToast("Thụ lý vụ việc thành công!", "success");
        if (typeof loadCaseList === 'function') loadCaseList(true);

        if (bridgeDonId && typeof G_Don !== 'undefined') {
          var donItem = G_Don.find(function(d) { return d.id === bridgeDonId; });
          if (donItem) {
            donItem.trangThai = "Đã thụ lý";
            if (typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine();
          }
        }

        var isVhn = String(loaiAn).includes("Hôn nhân") && (quanHe.toLowerCase().includes("thuận tình") || quanHe.toLowerCase().includes("thuan tinh"));
        var confirmTitle = isVhn ? "Thụ lý Việc HNGĐ thành công!" : "Thụ lý vụ án thành công!";
        var confirmMsg = isVhn 
          ? "Hồ sơ đã được thụ lý với số: <b>" + soTL + "</b> (Thuận tình ly hôn).<br><br>Bạn có muốn mở ngay trình Soạn thảo để xuất <b>Thông báo thụ lý việc HNGĐ</b> không?"
          : "Vụ án đã được thụ lý với số: <b>" + soTL + "</b>.<br><br>Bạn có muốn mở ngay trình Soạn thảo để xuất <b>Thông báo thụ lý vụ án</b> không?";

        AppUI.confirm(
          confirmTitle,
          confirmMsg,
          "primary",
          function() {
            var defaultKw = isVhn ? ["41. thông báo thụ lý việc hngđ"] : ["03. thông báo thụ lý vụ án"];
            window.openDraftingModal(res.id, { autoSelectKeywordsArray: defaultKw });
          }
        );
      } else {
        AppUI.alert("Lỗi hệ thống", res ? res.error : "Không thể thụ lý.");
      }
    })
    .withFailureHandler(function(err) {
      isSavingCase = false;
      AppUI.showToast("Lỗi kết nối: " + err.message, "error");
    })
    .api_LuuVuAnMoi(data);
};

        container.innerHTML = '<div class="alert alert-danger">' + res.error + '</div>';
        return;

              '</select>' +

window.submitResolution = function() {
  var elSo = document.getElementById('det-so');
  if (!elSo) return;
  var idAn = elSo.getAttribute('data-id');
  var rawDate = document.getElementById('res_ngay') ? document.getElementById('res_ngay').value : "";
  
  if (!rawDate) return AppUI.alert("Nhắc nhở", "Vui lòng nhập Ngày ban hành!");

  var resLoai = document.getElementById('res_loai') ? document.getElementById('res_loai').value : "";
  var resSo = document.getElementById('res_so') ? document.getElementById('res_so').value.trim() : "";
  
  var isProceduralOnly = resLoai.toLowerCase().includes("tạm đình chỉ") || 
                         resLoai.toLowerCase().includes("gia hạn") || 
                         resLoai.toLowerCase().includes("tiếp tục");

  var payload = { 
    idVuAn: idAn, 
    resultType: resLoai, 
    resultNo: resSo || "Chưa có số", 
    resultDate: rawDate 
  };

  window.forceCleanupModals();
  AppUI.showToast("Đang đồng bộ kết quả...", "");

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        AppUI.showToast("Đã cập nhật trạng thái/kết quả thành công!", "success");

        var an = (window.G_Cases || window.G_An || []).find(function(c) { return c.id === idAn; });
        var pParts = String(payload.resultDate || "").split('-');
        var dateVnFormat = pParts.length === 3 ? (pParts[2] + "/" + pParts[1] + "/" + pParts[0]) : payload.resultDate;
        
        var abbrType = window.standardizeResolutionAbbr(payload.resultType);
        var resStr = isProceduralOnly ? "" : (abbrType + "\n" + payload.resultNo + "\n" + dateVnFormat);

        if (an) {
          an.ketQuaGiaiQuyet = resStr;
          if (payload.resultType.toLowerCase().includes("tạm đình chỉ")) an.trangThai = "Tạm đình chỉ";
          else if (payload.resultType.toLowerCase().includes("gia hạn") || payload.resultType.toLowerCase().includes("tiếp tục")) an.trangThai = "Đang giải quyết";
          else an.trangThai = "Đã giải quyết";

          if (res && res.hanGQ) an.hanGQ = res.hanGQ;
          if (typeof calculateLiveStatus === 'function') calculateLiveStatus(an);
        }

        if (window.currentCaseData && window.currentCaseData.info && window.currentCaseData.info.id === idAn) {
          window.currentCaseData.info.ketQuaGiaiQuyet = resStr;
          window.currentCaseData.info.trangThai = (an ? an.trangThai : "Đã giải quyết");
          if (res && res.hanGQ) window.currentCaseData.info.hanGQ = res.hanGQ;
        }

        if (typeof window.runFilterEngine === 'function') window.runFilterEngine();
        if (document.getElementById('view-detail').style.display === 'block') window.moChiTiet(idAn);
      } else { AppUI.showToast("Lỗi xử lý: " + res.error, "error"); }
    })
    .withFailureHandler(function(err) { AppUI.showToast("Lỗi kết nối: " + err.message, "error"); })
    .api_UpdateCaseResolution(payload);
};

window.copyDataForQLTA = function(idAn) {
  var id = idAn || (window.currentCaseData ? window.currentCaseData.info.id : null);
  if (!id) return AppUI.alert("Nhắc nhở", "Vui lòng mở một hồ sơ trước khi sao chép.");

  var c = (window.G_Cases || window.G_An || []).find(function(x) { return x.id === id; });
  if (!c) return;

  var dsList = (window.currentCaseData && window.currentCaseData.info && window.currentCaseData.info.id === id) 
    ? window.currentCaseData.ds 
    : (c.chiTietDuongSu || []);

  var ndList = [], bdList = [], lqList = [];
  dsList.forEach(function(d) {
    var tc = String(d.tuCach || "").toLowerCase();
    var text = d.hoTen + ' (' + (d.namSinh || 'Chưa rõ NS') + ', ' + (d.diaChi || 'Chưa rõ ĐC') + ')';
    if (tc.includes("nguyên đơn") || tc.includes("khởi kiện") || tc.includes("yêu cầu") || tc.includes("bị hại")) ndList.push(text);
    else if (tc.includes("bị đơn") || tc.includes("bị cáo") || tc.includes("bị kiện")) bdList.push(text);
    else lqList.push(text);
  });

  var qltaText = "THÔNG TIN VỤ ÁN DÙNG CHO PHẦN MỀM QLTA - TANDTC\n" +
"--------------------------------------------------\n" +
"Số thụ lý: " + c.soTL + "\n" +
"Ngày thụ lý: " + c.ngayTL + "\n" +
"Loại án: " + c.loaiAn + "\n" +
"Quan hệ pháp luật tranh chấp: " + c.quanHe + "\n" +
"Hạn giải quyết: " + c.hanGQ + "\n" +
"Trạng thái hiện tại: " + (c.liveStatus || c.trangThai) + "\n" +
"Kết quả giải quyết: " + (c.ketQuaGiaiQuyet ? c.ketQuaGiaiQuyet.replace(/\n/g, ' - ') : 'Chưa có') + "\n\n" +
"DANH SÁCH ĐƯƠNG SỰ:\n" +
"- Bên khởi kiện / Yêu cầu: " + (ndList.join('; ') || 'Chưa có') + "\n" +
"- Bên bị kiện / Bị yêu cầu: " + (bdList.join('; ') || 'Chưa có') + "\n" +
"- Người liên quan: " + (lqList.join('; ') || 'Không có') + "\n" +
"--------------------------------------------------";

  navigator.clipboard.writeText(qltaText).then(function() {
    AppUI.showToast("Đã chép thông tin chuẩn QLTA vào bộ nhớ tạm!", "success");
  }).catch(function(err) {
    AppUI.alert("Lỗi sao chép", "Trình duyệt chặn sao chép: " + err.message);
  });
};
