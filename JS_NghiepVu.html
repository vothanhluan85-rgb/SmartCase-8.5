window.createSmartTemplate = function(fileInput) {
  if (!fileInput.files || fileInput.files.length === 0) return;
  var file = fileInput.files[0];
  var reader = new FileReader();

  AppUI.showToast(`Đang đọc tệp "${file.name}"...`, "");

  reader.onload = function(e) {
    var base64Data = e.target.result.split(',')[1];
    
    window.currentStagedAITplFile = {
      name: file.name,
      type: file.type || "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      base64: base64Data
    };

    var fnEl = document.getElementById('ai_tpl_filename');
    if (fnEl) fnEl.innerText = file.name;

    var newNameInput = document.getElementById('ai_tpl_new_name');
    if (newNameInput) newNameInput.value = file.name.replace(/\.[^/.]+$/, "");

    var listContainer = document.getElementById('ai_tpl_list_modal');
    if (listContainer) {
      listContainer.innerHTML = '<div class="p-3 text-center text-muted small"><div class="spinner-border spinner-border-sm me-2 text-primary"></div> Đang nạp danh mục mẫu...</div>';
      
      var tplsToUse = (window.currentLoadedTemplates && window.currentLoadedTemplates.length > 0) 
        ? window.currentLoadedTemplates 
        : [];

      if (tplsToUse.length > 0) {
        window.renderAiTplModalList(tplsToUse);
      } else {
        google.script.run
          .withSuccessHandler(function(templates) {
            window.currentLoadedTemplates = templates || [];
            window.renderAiTplModalList(window.currentLoadedTemplates);
          })
          .withFailureHandler(function(err) {
            listContainer.innerHTML = '<div class="p-3 text-danger small">Lỗi tải danh mục mẫu: ' + err.message + '</div>';
          })
          .api_GetBieuMauTemplates();
      }
    }

    document.getElementById('ai_selected_target_tpl_id').value = "";
    var alertEl = document.getElementById('ai_selected_tpl_alert');
    if (alertEl) alertEl.style.display = 'none';

    var rOverwrite = document.getElementById('aiTplMode_Overwrite');
    if (rOverwrite) rOverwrite.checked = true;
    window.toggleAiTplMode();

    AppUI.hideToast();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalAITemplateConfig')).show();
    fileInput.value = "";
  };
  reader.readAsDataURL(file);
};

window.renderAiTplModalList = function(templates) {
  var listContainer = document.getElementById('ai_tpl_list_modal');
  if (!listContainer) return;

  if (!templates || templates.length === 0) {
    listContainer.innerHTML = '<div class="p-3 text-muted small text-center">Chưa có biểu mẫu nào trong kho Drive.</div>';
    return;
  }

  var html = templates.map(function(t) {
    var matchNum = t.name.match(/^\s*0*(\d+)[a-zA-Z]?\s*\./);
    var num = matchNum ? parseInt(matchNum[1], 10) : 0;
    
    var badge = '<span class="badge bg-light text-secondary border" style="font-size:9px">Chung</span>';
    if (num >= 41 && num <= 45) badge = '<span class="badge bg-danger-subtle text-danger border border-danger" style="font-size:9px">HNGĐ</span>';
    else if (num >= 53 && num <= 60) badge = '<span class="badge bg-primary-subtle text-primary border border-primary" style="font-size:9px">Hành chính</span>';
    else if (num >= 46 && num <= 52) badge = '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning" style="font-size:9px">Việc DS</span>';
    else if (num >= 61 && num <= 62) badge = '<span class="badge bg-success-subtle text-success border border-success" style="font-size:9px">HGĐT</span>';
    else if ((num >= 18 && num <= 40) || (num >= 1 && num <= 3)) badge = '<span class="badge bg-info-subtle text-info border border-info" style="font-size:9px">Dân sự</span>';

    return `
      <div class="ai-tpl-select-card d-flex justify-content-between align-items-center mb-1 tpl-modal-item" id="tpl_card_${t.id}" data-name="${t.name.replace(/"/g, '&quot;')}" onclick="window.selectTargetTplForAI('${t.id}', '${t.name.replace(/'/g, "\\'")}')">
        <span class="small fw-bold text-dark text-truncate me-2"><i class="far fa-file-word text-primary me-2"></i>${t.name}</span>
        ${badge}
      </div>
    `;
  }).join('');

  listContainer.innerHTML = html;
};

      if (res && res.success) {
        var modeText = isOverwrite ? `Ghi đè thành công vào biểu mẫu: <b>${res.name}</b>` : `Đã tạo biểu mẫu mới: <b>${res.name}</b>`;
        AppUI.alert("TẠO PHÔI MẪU THÀNH CÔNG!", `✅ ${modeText}<br><br>- Đã tự động cấy <b>${res.replacementCount}</b> mã Placeholder chuẩn.<br>- Tệp đã được lưu an toàn vào thư mục Biểu mẫu trên Drive.`);
        
        google.script.run
          .withSuccessHandler(function(templates) {
            window.currentLoadedTemplates = templates || [];
            var selId = document.getElementById('draft-selected-case-id') ? document.getElementById('draft-selected-case-id').value : "";
            if (typeof window.filterAndRenderTemplates === 'function') {
              window.filterAndRenderTemplates(selId);
            }
          })
          .api_GetBieuMauTemplates();

      } else {
        AppUI.alert("Lỗi AI Tạo Mẫu", res ? res.error : "Không thể tạo biểu mẫu.");
      }
      window.currentStagedAITplFile = null;
    })
    .withFailureHandler(function(err) {
      AppUI.hideToast();
      AppUI.alert("Lỗi kết nối máy chủ", err.message);
      window.currentStagedAITplFile = null;
    })
    .api_CreateTemplateFromDoc(fileInfo.name, fileInfo.type, fileInfo.base64, targetFileId, newFileName);
};
</script>
