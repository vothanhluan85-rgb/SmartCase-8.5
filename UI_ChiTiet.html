                <option value="{Biên lai tạm ứng án phí}">{Biên lai tạm ứng án phí}</option>
                <option value="{Tài sản tranh chấp}">{Tài sản tranh chấp}</option>
                <option value="{Vị trí tài sản tranh chấp}">{Vị trí tài sản tranh chấp}</option>
                <option value="{Hợp đồng tín dụng}">{Hợp đồng tín dụng}</option>
                <option value="{Dư nợ tín dụng}">{Dư nợ tín dụng}</option>
                <option value="{Di sản thừa kế}">{Di sản thừa kế}</option>
              </optgroup>
            </select>
          </div>
        </div>

        <div id="case_open_canvas_wrapper">
          <textarea id="case_free_narrative_text" class="canvas-free-textarea" placeholder="Vùng dữ liệu đang trống. Thông tin bóc tách từ tài liệu hoặc nội dung tóm tắt vụ việc sẽ được hiển thị và tự động lưu trữ tại đây để phục vụ soạn thảo văn bản tố tụng..." oninput="window.saveOpenCanvasText()"></textarea>
        </div>
      </div>

    </div>

    <!-- CỘT PHẢI: HỒ SƠ ĐIỆN TỬ & DÒNG THỜI GIAN TỐ TỤNG -->
    <div class="col-lg-4 col-xl-3 d-flex flex-column gap-2">
      
      <!-- KHỐI HỒ SƠ ĐIỆN TỬ -->
      <div class="sidebar-widget-card">
        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
          <h6 class="widget-header-title d-flex align-items-center">
            <i class="fab fa-google-drive me-2 text-warning" style="font-size: 13px;"></i>HỒ SƠ ĐIỆN TỬ
          </h6>
          <button class="btn btn-sm btn-outline-secondary border rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 22px; height: 22px;" onclick="window.refreshDetailFiles()" title="Cập nhật danh sách tệp">
            <i class="fas fa-sync-alt" style="font-size: 9px;"></i>
          </button>
        </div>
        
        <div id="det-files" class="overflow-auto mb-2" style="max-height: 200px;">
          <div class="text-center p-2 text-muted small">Chưa có tệp lưu trữ.</div>
        </div>
        
        <input type="file" id="local-file-uploader" class="d-none" multiple onchange="window.handleLocalFileUpload(this)">
        
        <div class="d-flex flex-column gap-1 mt-2">
          <button class="btn btn-sm btn-action-outline w-100 justify-content-center" id="btn-open-drive" onclick="window.openDetailDrive()" style="font-size: 11px; height: 28px;">
            <i class="fas fa-folder-open text-warning me-1"></i> Mở thư mục hồ sơ
          </button>
          <button class="btn btn-sm btn-action-tonal w-100 justify-content-center" style="font-size: 11px; height: 28px;" onclick="document.getElementById('local-file-uploader').click()">
            <i class="fas fa-cloud-arrow-up text-primary me-1"></i> Tải lên tệp tin
          </button>
        </div>
      </div>

      <!-- KHỐI DÒNG THỜI GIAN TỐ TỤNG -->
      <div class="sidebar-widget-card flex-grow-1 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
          <h6 class="widget-header-title d-flex align-items-center">
            <i class="fas fa-stream me-2 text-primary" style="font-size: 11px;"></i>DÒNG THỜI GIAN
          </h6>
          <button class="btn btn-sm btn-action-tonal py-0 px-2 fw-bold" style="font-size: 10px; border-radius: 6px; height: 22px;" onclick="window.openTaskModal(window.currentCaseId, document.getElementById('det-so').innerText)">
            <i class="fas fa-plus me-1"></i> Lập lịch
          </button>
        </div>
        
        <div id="det-timeline-list" class="overflow-auto flex-grow-1" style="min-height: 240px;">
          <div class="text-center p-3 text-muted small"><div class="spinner-border spinner-border-sm me-1 text-primary"></div>Đang nạp dòng thời gian...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Chuẩn hóa tiêu đề động theo tính chất pháp lý của từng loại vụ việc
  window.updateCaseTypeDynamicLabels = function(loaiAn, quanHe) {
    var la = String(loaiAn || "").toLowerCase();
    var qh = String(quanHe || "").toLowerCase();

    var elSo = document.getElementById('lbl-meta-so');
    var elQuanHe = document.getElementById('lbl-meta-quanhe');
    var elPanelDuongSu = document.getElementById('lbl-panel-duongsu');
    var elPanelDuLieu = document.getElementById('lbl-panel-dulieu');

    // 1. Án Hình sự
    if (la.includes("hình sự") || la.includes("1.")) {
      if (elSo) elSo.innerText = "Số thụ lý vụ án hình sự";
      if (elQuanHe) elQuanHe.innerText = "Tội danh truy tố";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>NGƯỜI THAM GIA TỐ TỤNG';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU ÁN HÌNH SỰ";
    }
    // 2. Án Hành chính
    else if (la.includes("hành chính") || la.includes("6.")) {
      if (elSo) elSo.innerText = "Số thụ lý vụ án hành chính";
      if (elQuanHe) elQuanHe.innerText = "Đối tượng khởi kiện";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>THÀNH PHẦN ĐƯƠNG SỰ';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU ÁN HÀNH CHÍNH";
    }
    // 3. Việc dân sự hoặc Thuận tình ly hôn
    else if (la.includes("việc") || qh.includes("thuận tình") || qh.includes("thuan tinh")) {
      if (elSo) elSo.innerText = "Số thụ lý việc dân sự";
      if (elQuanHe) elQuanHe.innerText = "Nội dung yêu cầu giải quyết";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>NGƯỜI YÊU CẦU VÀ NGƯỜI LIÊN QUAN';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU VIỆC DÂN SỰ";
    }
    // 4. Hòa giải đối thoại tại Tòa án
    else if (la.includes("hòa giải") || la.includes("đối thoại") || la.includes("8.")) {
      if (elSo) elSo.innerText = "Số thụ lý hòa giải đối thoại";
      if (elQuanHe) elQuanHe.innerText = "Nội dung hòa giải đối thoại";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>CÁC BÊN THAM GIA HÒA GIẢI';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU HÒA GIẢI ĐỐI THOẠI";
    }
    // 5. Tranh chấp Hôn nhân và gia đình
    else if (la.includes("hôn nhân") || la.includes("3.")) {
      if (elSo) elSo.innerText = "Số thụ lý vụ án hôn nhân và gia đình";
      if (elQuanHe) elQuanHe.innerText = "Quan hệ hôn nhân tranh chấp";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>THÀNH PHẦN ĐƯƠNG SỰ';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU VỤ ÁN HÔN NHÂN VÀ GIA ĐÌNH";
    }
    // 6. Án Dân sự, Kinh doanh thương mại, Lao động thông thường
    else {
      if (elSo) elSo.innerText = "Số thụ lý vụ án sơ thẩm";
      if (elQuanHe) elQuanHe.innerText = "Quan hệ pháp luật tranh chấp";
      if (elPanelDuongSu) elPanelDuongSu.innerHTML = '<i class="fas fa-users text-primary me-2"></i>THÀNH PHẦN ĐƯƠNG SỰ';
      if (elPanelDuLieu) elPanelDuLieu.innerText = "DỮ LIỆU VỤ ÁN";
    }
  };

  // Giám sát cập nhật tiêu đề tự động mỗi khi nạp hồ sơ mới
  (function() {
    var observer = new MutationObserver(function() {
      var qhText = document.getElementById('det-quanhe') ? document.getElementById('det-quanhe').innerText : "";
      var loaiAn = "";
      if (window.currentCaseData && window.currentCaseData.info) {
        loaiAn = window.currentCaseData.info.loaiAn || "";
      } else if (window.currentCaseId && (window.G_An || window.G_Cases)) {
        var c = (window.G_An || window.G_Cases).find(function(x) { return x.id === window.currentCaseId; });
        if (c) loaiAn = c.loaiAn || "";
      }
      window.updateCaseTypeDynamicLabels(loaiAn, qhText);
    });

    var targetEl = document.getElementById('det-quanhe');
    if (targetEl) {
      observer.observe(targetEl, { childList: true, characterData: true, subtree: true });
    }
  })();
</script>
