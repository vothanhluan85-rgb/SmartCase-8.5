<script>
  // Hàm sao chép toàn văn Vùng Dữ liệu vụ án
  function copyCanvasContent() {
    var ta = document.getElementById('case_free_narrative_text');
    if (!ta || !ta.value.trim()) {
      AppUI.showToast("Vùng dữ liệu hiện đang trống!", "info");
      return;
    }
    navigator.clipboard.writeText(ta.value.trim()).then(function() {
      AppUI.showToast("Đã sao chép toàn bộ dữ liệu vụ án vào bộ nhớ tạm!", "success");
    }).catch(function() {
      AppUI.showToast("Trình duyệt chặn sao chép tự động", "info");
    });
  }

  // Hàm chèn Thẻ Placeholder vào ô văn bản mở
  window.insertPlaceholderToCanvas = function(selectEl) {
    var val = selectEl.value;
    if (!val) return;

    var textarea = document.getElementById('case_free_narrative_text');
    if (!textarea) return;

    var curText = textarea.value;
    var insertion = "\n" + val + ": ";
    if (!curText.trim()) insertion = val + ": ";

    textarea.value = curText + insertion;
    textarea.focus();
    selectEl.value = "";
    if (typeof window.saveOpenCanvasText === 'function') {
      window.saveOpenCanvasText();
    }
  };
</script>
