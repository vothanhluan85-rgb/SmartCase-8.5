/**
 * Hiển thị các khối dữ liệu:
 * - Khối nào có dữ liệu mới hiển thị tiêu đề và nội dung.
 * - Khối nào chưa có thì tạm thời ẩn hoàn toàn.
 * - Chú thích size 8pt in nghiêng chỉ rõ placeholder tương ứng.
 */
window.renderAllSavedVariableCards = function(v, loaiAn, narratives) {
  v = v || window.currentCaseVariables || {};
  narratives = narratives || window.currentCaseNarratives || {};

  var wrapper = document.getElementById('case_open_canvas_wrapper');
  if (!wrapper) return;

  var loaiAnStr = String(loaiAn || (window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "")).toLowerCase();
  var isHNGD = loaiAnStr.includes("hôn nhân") || loaiAnStr.includes("3.");

  var htmlCards = [];
  var hasAnyData = false;

  window.allFieldDefinitions.forEach(function(field) {
    // Lọc theo tính chất ngành án
    if (field.isHNGDOnly && !isHNGD) return;
    if (field.isNonHNGD && isHNGD) return;

    // Tìm dữ liệu trong biến hoặc narrative
    var val = v[field.key] || narratives[field.key] || "";
    if (!val && field.altKeys && field.altKeys.length > 0) {
      for (var i = 0; i < field.altKeys.length; i++) {
        var altVal = v[field.altKeys[i]] || narratives[field.altKeys[i]] || "";
        if (altVal) { val = altVal; break; }
      }
    }

    var cleanVal = String(val || "").trim();

    // Loại bỏ nội dung gộp lỗi lặp lại từ trước
    if (field.key === "{Nội dung vụ án}" && cleanVal.includes("[BIÊN LAI")) {
      return;
    }

    // NGUYÊN TẮC: Khối nào CHƯA CÓ dữ liệu thì tuyệt đối KHÔNG hiển thị tiêu đề
    if (!cleanVal || cleanVal === "---" || cleanVal === "..." || cleanVal === "undefined" || cleanVal === "null" || cleanVal === "Không nhắc tới cụ thể.") {
      return;
    }

    hasAnyData = true;
    var safeFieldKey = field.key.replace(/"/g, '&quot;');

    htmlCards.push(`
      <div class="data-variable-card p-3 mb-2 bg-white rounded-3 border shadow-sm animate-fadeIn" style="border-color: #cbd5e1 !important;" data-variable-key="${safeFieldKey}">
        <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom flex-wrap gap-1">
          <div class="d-flex align-items-baseline flex-wrap gap-2">
            <span class="fw-bold text-dark text-uppercase" style="font-size: 11.5px; letter-spacing: 0.3px;">
              <i class="${field.icon} me-1"></i> ${field.title}
            </span>
            <!-- Chú thích size 8pt in nghiêng chỉ rõ trường placeholder tương ứng -->
            <span style="font-size: 8pt; font-style: italic; color: #64748b; font-weight: 500;">
              Tương ứng: <code class="text-primary fw-semibold" style="font-size: 8pt; background: transparent; padding: 0;">${field.placeholderTag}</code>
            </span>
          </div>
          <button type="button" class="btn btn-sm btn-link text-danger p-0 text-decoration-none shadow-none" style="font-size: 13px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;" onclick="window.removeVariableCard('${safeFieldKey}', this)" title="Xóa thẻ này">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <textarea class="form-control border-0 p-0 shadow-none text-dark fw-normal card-variable-textarea" 
          rows="2" 
          style="font-size: 13px; line-height: 1.6; resize: vertical; background: transparent;" 
          oninput="window.updateVariableCardValue('${safeFieldKey}', this.value); window.autoResizeCardTextarea(this);">${cleanVal}</textarea>
      </div>
    `);
  });

  // Nếu hoàn toàn chưa có khối dữ liệu nào
  if (!hasAnyData) {
    wrapper.innerHTML = `
      <div class="text-center p-5 text-muted fst-italic animate-fadeIn" id="case_data_empty_state" style="font-size: 13px;">
        <i class="fas fa-folder-open fa-2x mb-2 d-block opacity-25 text-secondary"></i>
        Vùng dữ liệu đang trống. Khi bạn bấm <b>"Nạp dữ liệu"</b> hoặc <b>"Quét ảnh tài liệu"</b>, các khối thông tin bóc tách được sẽ tự động hiển thị tại đây.
      </div>
      <textarea id="case_free_narrative_text" class="d-none"></textarea>
    `;
    return;
  }

  wrapper.innerHTML = `
    <div id="case_structured_cards_container" class="d-flex flex-column">
      ${htmlCards.join('')}
    </div>
    <textarea id="case_free_narrative_text" class="d-none"></textarea>
  `;

  // Tự động căn chỉnh chiều cao các ô văn bản
  setTimeout(function() {
    wrapper.querySelectorAll('.card-variable-textarea').forEach(function(ta) {
      window.autoResizeCardTextarea(ta);
    });
  }, 50);
};

// =========================================================================
// 2. TỰ ĐỘNG LƯU TRỰC TIẾP, XÓA THẺ TỨC THÌ (0MS) VÀ ĐỒNG BỘ DRIVE
// =========================================================================

/**
 * Tự động mở rộng chiều cao ô nhập liệu theo độ dài văn bản
 */
window.autoResizeCardTextarea = function(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 4) + 'px';
};

/**
 * Cập nhật biến số khi chỉnh sửa trực tiếp trên từng thẻ
 */
window.updateVariableCardValue = function(fieldKey, newValue) {
  if (!fieldKey) return;

  window.currentCaseVariables = window.currentCaseVariables || {};
  window.currentCaseVariables[fieldKey] = newValue;

  if (fieldKey.includes("Lời khai") || fieldKey.includes("Nội dung")) {
    window.currentCaseNarratives = window.currentCaseNarratives || {};
    window.currentCaseNarratives[fieldKey] = newValue;
  }

  // Đồng bộ vào textarea ngầm phục vụ chức năng sao chép
  var hiddenTa = document.getElementById('case_free_narrative_text');
  if (hiddenTa) {
    var compiledParts = [];
    document.querySelectorAll('.data-variable-card').forEach(function(card) {
      var k = card.getAttribute('data-variable-key');
      var ta = card.querySelector('.card-variable-textarea');
      if (ta && ta.value.trim()) {
        compiledParts.push(`[${k.replace(/[{}]/g, '').toUpperCase()}]:\n${ta.value.trim()}`);
      }
    });
    hiddenTa.value = compiledParts.join("\n\n");
  }

  window.saveOpenCanvasText();
};

/**
 * XÓA THẺ TỨC THÌ (0MS TRÊN GIAO DIỆN) VÀ XÓA VĨNH VIỄN KHỎI BỘ NHỚ
 */
window.removeVariableCard = function(fieldKey, btnEl) {
  if (!fieldKey) return;

  // 1. XÓA NGAY LẬP TỨC THẺ TRÊN GIAO DIỆN (0ms)
  var cardEl = btnEl ? btnEl.closest('.data-variable-card') : document.querySelector(`[data-variable-key="${fieldKey}"]`);
  if (cardEl) {
    cardEl.style.transition = 'all 0.2s ease';
    cardEl.style.opacity = '0';
    cardEl.style.transform = 'translateY(-6px)';
    setTimeout(function() { cardEl.remove(); }, 200);
  }

  // 2. Thu thập toàn bộ các biến thể của key (chính, phụ, chữ thường, chữ hoa)
  var keysToDelete = [fieldKey, fieldKey.toLowerCase(), fieldKey.toUpperCase()];
  var matchDef = (window.allFieldDefinitions || []).find(function(d) {
    return d.key.toLowerCase() === fieldKey.toLowerCase() || 
           (d.altKeys && d.altKeys.some(function(ak) { return ak.toLowerCase() === fieldKey.toLowerCase(); }));
  });

  if (matchDef) {
    keysToDelete.push(matchDef.key, matchDef.key.toLowerCase(), matchDef.key.toUpperCase());
    if (matchDef.altKeys) {
      matchDef.altKeys.forEach(function(ak) {
        keysToDelete.push(ak, ak.toLowerCase(), ak.toUpperCase());
      });
    }
  }

  // 3. Xóa sạch khỏi bộ nhớ RAM
  keysToDelete.forEach(function(k) {
    if (window.currentCaseVariables) delete window.currentCaseVariables[k];
    if (window.currentCaseNarratives) delete window.currentCaseNarratives[k];
  });

  // 4. Nếu xóa hết thẻ thì hiện lại thông báo trống
  setTimeout(function() {
    var remaining = document.querySelectorAll('.data-variable-card');
    var wrapper = document.getElementById('case_open_canvas_wrapper');
    if (remaining.length === 0 && wrapper) {
      wrapper.innerHTML = `
        <div class="text-center p-5 text-muted fst-italic animate-fadeIn" id="case_data_empty_state" style="font-size: 13px;">
          <i class="fas fa-folder-open fa-2x mb-2 d-block opacity-25 text-secondary"></i>
          Vùng dữ liệu đang trống. Khi bạn bấm <b>"Nạp dữ liệu"</b> hoặc <b>"Quét ảnh tài liệu"</b>, các khối thông tin bóc tách được sẽ tự động hiển thị tại đây.
        </div>
        <textarea id="case_free_narrative_text" class="d-none"></textarea>
      `;
    }
  }, 220);

  // 5. Lưu trực tiếp xuống Drive kèm danh sách keysToDelete để server dọn sạch vĩnh viễn
  window.saveCaseVariables(true, keysToDelete);
  if (typeof AppUI !== 'undefined') AppUI.showToast("Đã xóa thẻ dữ liệu!", "info");
};

/**
 * Hẹn giờ tự động lưu ngầm (debounce 1.2s)
 */
window.saveOpenCanvasText = function() {
  clearTimeout(window.openCanvasAutoSaveTimer);
  var ind = document.getElementById('open_canvas_autosave_indicator');
  if (ind) ind.innerHTML = '<i class="fas fa-spinner fa-spin text-warning me-1"></i> <span class="text-warning">Đang chờ lưu...</span>';

  window.openCanvasAutoSaveTimer = setTimeout(function() {
    window.saveCaseVariables(true);
  }, 1200);
};

/**
 * Lưu biến số vào Google Drive _case_memory.json (Tuyệt đối không tự hồi sinh thẻ)
 */
window.saveCaseVariables = function(isAuto, deletedKeys) {
  if (!window.currentCaseId) return;

  var vars = Object.assign({}, window.currentCaseVariables || {});
  var narratives = Object.assign({}, window.currentCaseNarratives || {});

  // Đảm bảo các key đã bị xóa không bao giờ xuất hiện lại trong mảng lưu
  if (deletedKeys && Array.isArray(deletedKeys)) {
    deletedKeys.forEach(function(k) {
      delete vars[k];
      delete narratives[k];
    });
  }

  window.currentCaseVariables = vars;
  window.currentCaseNarratives = narratives;

  if (window.currentCaseData) {
    window.currentCaseData.variables = vars;
    window.currentCaseData.narratives = narratives;
  }

  google.script.run
    .withSuccessHandler(function(res) {
      var ind = document.getElementById('open_canvas_autosave_indicator');
      if (res && res.success && ind) {
        ind.innerHTML = '<i class="fas fa-check-circle text-success me-1"></i> <span class="text-success">Đã tự động lưu</span>';
        setTimeout(function() { if (ind) ind.innerHTML = ''; }, 2500);
      }
    })
    .api_LuuThongSoNghiepVuAn({
      idVuAn: window.currentCaseId,
      variables: vars,
      narratives: narratives,
      deletedKeys: deletedKeys || []
    });
};

/**
 * Xóa sạch toàn bộ dữ liệu vụ án sau khi người dùng xác nhận
 */
window.clearCanvasDataWithConfirm = function() {
  if (typeof AppUI !== 'undefined') {
    AppUI.confirm(
      "XÓA TRẮNG DỮ LIỆU VỤ ÁN",
      "⚠️ Bạn có chắc chắn muốn xóa toàn bộ các khối thông tin đã bóc tách của vụ việc này?\nThao tác này sẽ làm sạch vùng dữ liệu để bạn nhập hoặc quét lại từ đầu.",
      "danger",
      function() {
        // Lấy toàn bộ keys hiện có để gửi xóa triệt để trên Drive
        var allKeys = Object.keys(window.currentCaseVariables || {});

        window.currentCaseVariables = {};
        window.currentCaseNarratives = {};

        var loaiAn = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "";
        window.renderAllSavedVariableCards({}, loaiAn, {});
        window.saveCaseVariables(false, allKeys);
        AppUI.showToast("Đã xóa sạch dữ liệu vụ án!", "success");
      }
    );
  }
};

/**
 * Sao chép toàn bộ nội dung dữ liệu của các khối vào bộ nhớ tạm
 */
window.copyCanvasContent = function() {
  var cards = document.querySelectorAll('.data-variable-card');
  if (cards.length === 0) {
    if (typeof AppUI !== 'undefined') AppUI.showToast("Dữ liệu vụ án đang trống!", "info");
    return;
  }

  var compiledParts = [];
  cards.forEach(function(card) {
    var titleEl = card.querySelector('.fw-bold.text-dark');
    var ta = card.querySelector('.card-variable-textarea');
    var title = titleEl ? titleEl.innerText.trim() : "";
    var content = ta ? ta.value.trim() : "";
    if (content) {
      compiledParts.push(`[${title}]:\n${content}`);
    }
  });

  if (compiledParts.length === 0) {
    if (typeof AppUI !== 'undefined') AppUI.showToast("Dữ liệu vụ án đang trống!", "info");
    return;
  }

  navigator.clipboard.writeText(compiledParts.join("\n\n")).then(function() {
    if (typeof AppUI !== 'undefined') AppUI.showToast("Đã sao chép toàn bộ dữ liệu vào bộ nhớ tạm!", "success");
  }).catch(function() {
    if (typeof AppUI !== 'undefined') AppUI.showToast("Trình duyệt không hỗ trợ sao chép tự động", "info");
  });
};

/**
 * Chèn một khối dữ liệu mới từ danh sách dropdown
 */
window.insertPlaceholderToCanvas = function(selectEl) {
  var tag = selectEl ? selectEl.value : "";
  if (!tag) return;

  window.currentCaseVariables = window.currentCaseVariables || {};
  if (!window.currentCaseVariables[tag] || window.currentCaseVariables[tag] === "...") {
    window.currentCaseVariables[tag] = "...";
  }

  var loaiAn = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "";
  window.renderAllSavedVariableCards(window.currentCaseVariables, loaiAn, window.currentCaseNarratives);
  
  selectEl.value = "";

  setTimeout(function() {
    var newCard = document.querySelector(`[data-variable-key="${tag.replace(/"/g, '&quot;')}"] textarea`);
    if (newCard) {
      newCard.focus();
      newCard.select();
    }
  }, 120);
};

// =========================================================================
// 3. ĐÓNG GÓI BIẾN ĐỘNG CHO ĐỘNG CƠ TRỘN THƯ V3
// =========================================================================

window.compileDynamicVariables = function(vars, currentA4Parties) {
  vars = vars || {};
  var caseInfo = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info : {};
  var loaiAn = String(caseInfo.loaiAn || "");
  var quanHe = String(caseInfo.quanHe || "");

  // A. Biên lai thu tạm ứng án phí NQ 326
  if (!vars["{Biên lai tạm ứng án phí}"]) {
    vars["{Biên lai tạm ứng án phí}"] = "Biên lai thu tạm ứng án phí, lệ phí Tòa án số............... ngày...../...../202... của Chi cục Thi hành án dân sự tỉnh Lâm Đồng.";
  }
  vars["{biên lai tạm ứng án phí}"] = vars["{Biên lai tạm ứng án phí}"];
  vars["{Thông tin biên lai án phí}"] = vars["{Biên lai tạm ứng án phí}"];

  // B. Nhận diện quan hệ con chung và cấp dưỡng
  var rawThoaThuanCon = vars["{Thỏa thuận con chung}"] || vars["{Con chung}"] || "";
  var rawNoiDungFull = vars["{Nội dung thỏa thuận}"] || vars["{Nội dung vụ án}"] || "";
  var checkConText = (rawThoaThuanCon + " " + rawNoiDungFull).toLowerCase();

  var hasConChung = checkConText.includes("con chung") && !checkConText.includes("không có con chung");
  var hasCapDuongTien = false;

  var mConSection = rawNoiDungFull.match(/(?:(?:2\.\s*)?(?:Về\s*)?con chung:?|- Con chung:)([\s\S]*?)(?=(?:(?:3\.\s*)?(?:Về\s*)?tài sản|- Tài sản:|4\.\s*Về|5\.\s*Về|\[|$))/i);
  var conSectionText = mConSection ? mConSection[1].toLowerCase() : rawThoaThuanCon.toLowerCase();

  if (conSectionText.includes("cấp dưỡng") && !conSectionText.includes("không tranh chấp") && !conSectionText.includes("không yêu cầu")) {
    if (conSectionText.includes("đồng") || conSectionText.includes("đ/") || /\d+[\.,]?\d*\s*(?:đồng|đ)/i.test(conSectionText)) {
      hasCapDuongTien = true;
    }
  }

  var hasChiaTaiSan = checkConText.includes("tài sản") && !checkConText.includes("tự thỏa thuận, không yêu cầu") && !checkConText.includes("không có tài sản");

  // C. Thiết lập điều khoản quyền thăm nom và lãi suất chậm thi hành án
  if (hasConChung) {
    vars["{Quyền thăm nom con}"] = "Quyền thăm nom, chăm sóc, nuôi dưỡng, giáo dục con; quyền thay đổi người trực tiếp nuôi con; thay đổi mức cấp dưỡng được thực hiện theo quy định của Luật hôn nhân và gia đình.";
    vars["{quyền thăm nom con}"] = vars["{Quyền thăm nom con}"];
    vars["{Quyền thăm con}"] = vars["{Quyền thăm nom con}"];
    vars["{quyền thăm con}"] = vars["{Quyền thăm nom con}"];
  } else {
    vars["{Quyền thăm nom con}"] = "";
    vars["{quyền thăm nom con}"] = "";
    vars["{Quyền thăm con}"] = "";
    vars["{quyền thăm con}"] = "";
  }

  if (hasCapDuongTien) {
    vars["{Lãi suất chậm thi hành án}"] = "Kể từ ngày có đơn yêu cầu thi hành án của người được thi hành án (đối với các khoản tiền phải trả cho người được thi hành án) cho đến khi thi hành án xong, bên phải thi hành án còn phải chịu khoản tiền lãi của số tiền còn phải thi hành án theo mức lãi suất quy định tại Điều 357, Điều 468 của Bộ luật dân sự năm 2015.";
    vars["{lãi suất chậm thi hành án}"] = vars["{Lãi suất chậm thi hành án}"];
    vars["{Lãi chậm trả}"] = vars["{Lãi suất chậm thi hành án}"];
    vars["{lãi chậm trả}"] = vars["{Lãi suất chậm thi hành án}"];
  } else {
    vars["{Lãi suất chậm thi hành án}"] = "";
    vars["{lãi suất chậm thi hành án}"] = "";
    vars["{Lãi chậm trả}"] = "";
    vars["{lãi chậm trả}"] = "";
  }
  vars["{Điều luật chậm trả}"] = "";
  vars["{điều luật chậm trả}"] = "";

  // D. Chuỗi điều luật viện dẫn chuẩn mực cho vụ việc Hôn nhân & Gia đình
  var dieuLuatList = ["Điều 51", "Điều 55"];
  if (hasConChung) dieuLuatList.push("Điều 57", "Điều 58", "Điều 81", "Điều 82", "Điều 83");
  if (hasCapDuongTien) dieuLuatList.push("Điều 84");
  if (hasChiaTaiSan) dieuLuatList.push("Điều 59", "Điều 60");

  var dieuLuatHNGD_Str = "các " + dieuLuatList.join(", ") + " Luật hôn nhân và gia đình năm 2014";
  if (hasCapDuongTien) dieuLuatHNGD_Str += "; Điều 357, Điều 468 của Bộ luật dân sự năm 2015";
  vars["{Điều luật HNGĐ}"] = dieuLuatHNGD_Str;
  vars["{điều luật hngđ}"] = dieuLuatHNGD_Str;

  // E. Nhân bản bộ 3 thể thức Viết hoa - Chữ thường - Viết hoa toàn bộ cho toàn bộ biến
  for (var key in vars) {
    if (vars[key] !== undefined && vars[key] !== null) {
      var valStr = String(vars[key]);
      var lowerKey = key.toLowerCase();
      var upperKey = key.toUpperCase();
      if (!vars.hasOwnProperty(lowerKey)) vars[lowerKey] = valStr;
      if (!vars.hasOwnProperty(upperKey)) vars[upperKey] = valStr.toUpperCase();
    }
  }
};

// 4. CHỤP / QUÉT NHIỀU TRANG TÀI LIỆU (MULTI-PHOTO OCR)

window.handleMultiPhotoSelect = function(input) {
  if (!input.files || input.files.length === 0) return;
  var files = Array.from(input.files);
  var idVuAn = window.currentCaseId;

  if (!idVuAn) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Nhắc nhở", "Vui lòng mở hồ sơ vụ việc trước khi quét tài liệu!");
    return;
  }

  if (typeof AppUI !== 'undefined') AppUI.showToast(`Trợ lý thẩm phán đang xử lý ${files.length} ảnh chụp tài liệu...`, "");
  var processed = 0;

  files.forEach(function(file) {
    window.compressImageFile(file, 1400, 0.75, function(res) {
      window.stagedOcrPhotos.push({
        id: 'ocr_' + Date.now() + Math.floor(Math.random() * 100),
        fileName: res.name,
        mimeType: res.mimeType,
        base64Data: res.base64,
        dataUrl: res.dataUrl
      });
      processed++;
      if (processed === files.length) {
        if (typeof AppUI !== 'undefined') AppUI.hideToast();
        window.renderOcrStagingModal();
      }
    });
  });
  input.value = "";
};

window.renderOcrStagingModal = function() {
  var count = window.stagedOcrPhotos.length;
  if (count === 0) return;

  var containerHtml = `
    <div class="modal fade" id="modalOcrStaging" tabindex="-1" data-bs-backdrop="static">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
          <div class="modal-header bg-white border-bottom py-3">
            <h6 class="modal-title fw-bold text-dark text-uppercase" style="font-size: 13.5px;">
              <i class="fas fa-images text-primary me-2"></i>DANH SÁCH ẢNH CHỤP TÀI LIỆU (${count} TRANG)
            </h6>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-3 bg-light">
            <div class="p-2 px-3 bg-white rounded-3 border mb-3 small text-muted">
              <i class="fas fa-info-circle text-primary me-1"></i> Bạn có thể chụp thêm các trang tiếp theo hoặc nhấn <b>"Tiến hành bóc tách dữ liệu"</b> để Trợ lý thẩm phán phân tích và đưa thông tin vào các khối dữ liệu vụ án.
            </div>
            <div class="row g-2" id="ocr_staging_gallery"></div>
          </div>
          <div class="modal-footer bg-white border-top justify-content-between p-3">
            <button type="button" class="btn btn-action-outline btn-action-tool" onclick="document.getElementById('input_camera_multi').click()">
              <i class="fas fa-camera text-success me-1"></i> Chụp thêm trang
            </button>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-action-outline btn-action-tool" data-bs-dismiss="modal" onclick="window.stagedOcrPhotos=[]">Hủy</button>
              <button type="button" class="btn btn-action-primary btn-action-tool shadow-sm" onclick="window.executeMultiPhotoExtraction()">
                <i class="fas fa-bolt me-1"></i> Tiến hành bóc tách dữ liệu (${count} ảnh)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  var oldModal = document.getElementById('modalOcrStaging');
  if (oldModal) oldModal.remove();
  document.body.insertAdjacentHTML('beforeend', containerHtml);

  var gallery = document.getElementById('ocr_staging_gallery');
  gallery.innerHTML = window.stagedOcrPhotos.map(function(item, idx) {
    return `
      <div class="col-4 col-md-3 position-relative" id="thumb_${item.id}">
        <div class="border rounded-3 p-1 bg-white shadow-sm text-center">
          <img src="${item.dataUrl}" style="height: 110px; width: 100%; object-fit: cover; border-radius: 4px;">
          <div class="small text-truncate mt-1 text-muted fw-bold" style="font-size: 11px;">Trang ${idx + 1}</div>
          <button type="button" class="btn btn-sm btn-danger position-absolute" style="top: 4px; right: 8px; border-radius: 50%; width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center;" onclick="window.removeStagedOcrPhoto('${item.id}')">
            <i class="fas fa-times" style="font-size: 10px;"></i>
          </button>
        </div>
      </div>
    `;
  }).join('');

  bootstrap.Modal.getOrCreateInstance(document.getElementById('modalOcrStaging')).show();
};

window.removeStagedOcrPhoto = function(id) {
  window.stagedOcrPhotos = window.stagedOcrPhotos.filter(function(p) { return p.id !== id; });
  var el = document.getElementById('thumb_' + id);
  if (el) el.remove();
  
  if (window.stagedOcrPhotos.length === 0) {
    var modalEl = document.getElementById('modalOcrStaging');
    if (modalEl) bootstrap.Modal.getInstance(modalEl).hide();
  }
};

window.executeMultiPhotoExtraction = function() {
  if (window.stagedOcrPhotos.length === 0) return;
  var idVuAn = window.currentCaseId;

  var modalEl = document.getElementById('modalOcrStaging');
  if (modalEl) bootstrap.Modal.getInstance(modalEl).hide();

  if (typeof AppUI !== 'undefined') AppUI.showToast(`Trợ lý thẩm phán đang phân tích ${window.stagedOcrPhotos.length} ảnh chụp tài liệu...`, "");

  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof AppUI !== 'undefined') AppUI.hideToast();
      window.stagedOcrPhotos = [];

      if (res && res.success) {
        if (typeof window.applyEvidenceDirectToCanvas === 'function') {
          window.applyEvidenceDirectToCanvas(res.extractedVariables, res.extractedNarratives);
        } else {
          window.currentCaseVariables = Object.assign({}, window.currentCaseVariables || {}, res.extractedVariables || {});
          window.currentCaseNarratives = Object.assign({}, window.currentCaseNarratives || {}, res.extractedNarratives || {});
          var loaiAn = window.currentCaseData && window.currentCaseData.info ? window.currentCaseData.info.loaiAn : "";
          window.renderAllSavedVariableCards(window.currentCaseVariables, loaiAn, window.currentCaseNarratives);
          window.saveCaseVariables(true);
        }
        if (typeof AppUI !== 'undefined') AppUI.showToast("Đã trích xuất và lưu dữ liệu vụ án thành công!", "success");
      } else {
        if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi bóc tách", res ? res.error : "Không thể nhận diện nội dung tài liệu.");
      }
    })
    .withFailureHandler(function(err) {
      if (typeof AppUI !== 'undefined') AppUI.hideToast();
      window.stagedOcrPhotos = [];
      if (typeof AppUI !== 'undefined') AppUI.showToast("Lỗi kết nối máy chủ: " + err.message, "error");
    })
    .api_ParseEvidenceDocument(idVuAn, "Anh_chup_da_trang.jpg", "image/jpeg", null, 'EVIDENCE_ONLY', window.stagedOcrPhotos);
};
</script>
