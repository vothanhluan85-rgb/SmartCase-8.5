<script>
  var calCurrentDate = new Date();
  var calSelectedDate = new Date();
  
  // KHỞI TẠO NGAY TỪ RAM ĐỂ HIỂN THỊ TỨC THÌ 0MS KHI MỞ TAB
  var calEventsList = (window.G_LichTrinh && Array.isArray(window.G_LichTrinh)) ? window.G_LichTrinh : [];
  var calFilterCategory = 'ALL';

  function getShortPartyName(fullName) {
    if (!fullName) return "";
    var clean = String(fullName).trim()
      .replace(/^(ông|bà|anh|chị|tổ chức|công ty|ngân hàng|ubnd)\s+/i, '')
      .replace(/\(.*?\)/g, '')
      .trim();
    var words = clean.split(/\s+/);
    return words[words.length - 1];
  }

  function getShortActionVerb(title) {
    if (!title) return "Lịch làm việc";
    var t = title.toLowerCase();
    if (t.includes("hòa giải")) return "Hòa giải";
    if (t.includes("đối thoại")) return "Đối thoại";
    if (t.includes("đo vẽ") || t.includes("thẩm định") || t.includes("định giá")) return "Đo vẽ/Thẩm định";
    if (t.includes("triệu tập")) return "Triệu tập";
    if (t.includes("lấy lời khai") || t.includes("bản tự khai")) return "Lấy lời khai";
    if (t.includes("đối chất")) return "Đối chất";
    if (t.includes("xét xử") || t.includes("phiên tòa")) return "Xét xử";
    if (t.includes("tuyên án")) return "Tuyên án";
    if (t.includes("ngày thứ 8") || t.includes("ngày thứ 16") || t.includes("nhắc") || t.includes("mốc 24h")) return "Mốc 24h";
    if (t.includes("tiếp dân") || t.includes("tiếp công dân")) return "Tiếp dân";
    
    var clean = title.replace(/^\[.*?\]\s*/, '').trim();
    var w = clean.split(/\s+/);
    return w.slice(0, 2).join(" ");
  }

  function formatCompactCalendarPill(ev) {
    var action = getShortActionVerb(ev.title || ev.noiDung || "");

    var an = null;
    if (ev.idVuAn && ev.idVuAn !== "GENERAL" && window.G_An && Array.isArray(window.G_An)) {
      an = window.G_An.find(function(c) { return c.id === ev.idVuAn; });
    }

    if (an) {
      var ndShort = getShortPartyName(an.nguyenDon);
      var bdShort = getShortPartyName(an.biDon);

      if (ndShort && bdShort) {
        return `${action} vụ ${ndShort} - ${bdShort}`;
      } else if (ndShort) {
        return `${action} vụ ${ndShort}`;
      }
    }

    if (ev.duongSuText) {
      var parts = ev.duongSuText.split(/(?:v\.|và|vs|-|,)/i);
      if (parts.length >= 2) {
        var p1 = getShortPartyName(parts[0]);
        var p2 = getShortPartyName(parts[1]);
        if (p1 && p2) return `${action} vụ ${p1} - ${p2}`;
      } else if (parts.length === 1) {
        var pSingle = getShortPartyName(parts[0]);
        if (pSingle) return `${action} vụ ${pSingle}`;
      }
    }

    var cleanT = (ev.title || "").replace(/^\[.*?\]\s*/, '').trim();
    return cleanT.length > 24 ? cleanT.substring(0, 22) + "..." : cleanT;
  }

  function renderCalendarGrid() {
    var gridEl = document.getElementById('cal-days-grid');
    var titleEl = document.getElementById('cal-month-title');
    if (!gridEl) return;

    var year = calCurrentDate.getFullYear();
    var month = calCurrentDate.getMonth();
    if (titleEl) titleEl.innerText = `THÁNG ${month + 1} NĂM ${year}`;

    var firstDayOfMonth = new Date(year, month, 1);
    var lastDayOfMonth = new Date(year, month + 1, 0);
    var startDayIndex = firstDayOfMonth.getDay();
    var offset = (startDayIndex === 0) ? 6 : (startDayIndex - 1);

    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var todayTs = today.getTime();

    var html = "";

    // HÀM RENDER SỰ KIỆN: LÀM MỜ QUÁ KHỨ VÀ HIỂN THỊ ĐẬM NÉT CHO HIỆN TẠI / TƯƠNG LAI
    function getEventsHtmlForDate(cYear, cMonth, cDay) {
      var cellDateObj = new Date(cYear, cMonth, cDay);
      cellDateObj.setHours(0, 0, 0, 0);
      var isCellInPast = cellDateObj.getTime() < todayTs;

      var dayEvents = calEventsList.filter(function(ev) {
        if (!ev.start) return false;
        var evDate = new Date(ev.start);
        var isMatchDate = (evDate.getFullYear() === cYear && evDate.getMonth() === cMonth && evDate.getDate() === cDay);
        if (!isMatchDate) return false;

        var tLow = (ev.title || "").toLowerCase();
        if (calFilterCategory === 'TRIAL') return tLow.includes("xét xử") || tLow.includes("tuyên án");
        if (calFilterCategory === 'MEDIATE') return tLow.includes("hòa giải") || tLow.includes("đối thoại") || tLow.includes("chứng cứ");
        if (calFilterCategory === 'REMIND') return tLow.includes("nhắc") || tLow.includes("hạn") || tLow.includes("ra qđ") || tLow.includes("ngày thứ 8") || tLow.includes("ngày thứ 16");
        if (calFilterCategory === 'THAM_DINH') return tLow.includes("thẩm định") || tLow.includes("định giá") || tLow.includes("đo vẽ");
        return true;
      });

      var evHtml = "";
      dayEvents.slice(0, 3).forEach(function(ev) {
        var tLow = (ev.title || "").toLowerCase();
        var pillClass = "cal-event-pill";

        // GÁN MÃ MÀU CHUẨN
        if (tLow.includes("ngày thứ 8") || tLow.includes("ngày thứ 16") || (tLow.includes("ra qđ") && (tLow.includes("hòa giải") || tLow.includes("đối thoại")))) {
          pillClass += " pill-milestone";
        } else if (tLow.includes("xét xử") || tLow.includes("tuyên án")) {
          pillClass += " pill-trial";
        } else if (tLow.includes("nhắc") || tLow.includes("hạn") || tLow.includes("ra qđ")) {
          pillClass += " pill-remind";
        } else if (tLow.includes("hòa giải") || tLow.includes("đối thoại") || tLow.includes("chứng cứ")) {
          pillClass += " pill-session";
        } else if (tLow.includes("thẩm định") || tLow.includes("định giá") || tLow.includes("đo vẽ")) {
          pillClass += " pill-thamdinh";
        } else {
          pillClass += " pill-future-general";
        }

        // TỰ ĐỘNG LÀM MỜ NẾU LÀ NGÀY QUÁ KHỨ HOẶC ĐÃ HOÀN THÀNH
        if (isCellInPast) {
          pillClass += " pill-past";
        }
        if (ev.trangThai === 'Hoàn thành') {
          pillClass += " pill-done";
        }

        var compactTitle = formatCompactCalendarPill(ev);
        var taskIdVal = ev.idLich || ev.id || "";
        evHtml += `<div class="${pillClass}" onclick="event.stopPropagation(); window.openEditCalendarEventModal('${taskIdVal}')" title="${ev.title || ''}"><i class="fas fa-clock me-1 opacity-75"></i>${compactTitle}</div>`;
      });

      if (dayEvents.length > 3) {
        evHtml += `<div class="text-primary fw-bold ps-1" style="font-size:9.5px;">+${dayEvents.length - 3} việc nữa</div>`;
      }
      return evHtml;
    }

    // 1. Các ngày của tháng trước (Mở khóa hoàn toàn: Cho phép chọn & nhấp đúp để lập lịch)
    var prevMonthLastDay = new Date(year, month, 0).getDate();
    for (var i = offset - 1; i >= 0; i--) {
      var prevDateNum = prevMonthLastDay - i;
      var pDate = new Date(year, month - 1, prevDateNum);
      var pDateStr = `${pDate.getFullYear()}-${("0" + (pDate.getMonth() + 1)).slice(-2)}-${("0" + prevDateNum).slice(-2)}`;
      var pIsSelected = (calSelectedDate.getFullYear() === pDate.getFullYear() && calSelectedDate.getMonth() === pDate.getMonth() && calSelectedDate.getDate() === prevDateNum);
      var pCellClass = "cal-day-cell other-month" + (pIsSelected ? " is-selected" : "");
      var pEvHtml = getEventsHtmlForDate(pDate.getFullYear(), pDate.getMonth(), prevDateNum);
      
      html += `
        <div class="${pCellClass}" onclick="window.calSelectDay('${pDateStr}')" ondblclick="window.openCaseTaskModal('${pDateStr}')" title="Nhấp đúp để lập lịch cho ngày ${prevDateNum}/${pDate.getMonth() + 1}">
          <div class="cal-cell-header"><span class="cal-date-num">${prevDateNum}</span></div>
          <div class="flex-grow-1 overflow-hidden">${pEvHtml}</div>
        </div>`;
    }

    // 2. Các ngày của tháng hiện tại
    for (var d = 1; d <= lastDayOfMonth.getDate(); d++) {
      var isToday = (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d);
      var isSelected = (calSelectedDate.getFullYear() === year && calSelectedDate.getMonth() === month && calSelectedDate.getDate() === d);

      var cellClass = "cal-day-cell";
      if (isToday) cellClass += " is-today";
      if (isSelected) cellClass += " is-selected";

      var eventsHtml = getEventsHtmlForDate(year, month, d);
      var dateParam = `${year}-${("0" + (month + 1)).slice(-2)}-${("0" + d).slice(-2)}`;
      html += `
        <div class="${cellClass}" onclick="window.calSelectDay('${dateParam}')" ondblclick="window.openCaseTaskModal('${dateParam}')" title="Nhấp đúp để lập lịch cho ngày ${d}/${month + 1}">
          <div class="cal-cell-header"><span class="cal-date-num">${d}</span></div>
          <div class="flex-grow-1 overflow-hidden">${eventsHtml}</div>
        </div>`;
    }

    // 3. Các ngày của tháng sau (Mở khóa hoàn toàn: Cho phép chọn & nhấp đúp để lập lịch)
    var totalCells = offset + lastDayOfMonth.getDate();
    var nextMonthDays = (totalCells % 7 === 0) ? 0 : (7 - (totalCells % 7));
    for (var n = 1; n <= nextMonthDays; n++) {
      var nDate = new Date(year, month + 1, n);
      var nDateStr = `${nDate.getFullYear()}-${("0" + (nDate.getMonth() + 1)).slice(-2)}-${("0" + n).slice(-2)}`;
      var nIsSelected = (calSelectedDate.getFullYear() === nDate.getFullYear() && calSelectedDate.getMonth() === nDate.getMonth() && calSelectedDate.getDate() === n);
      var nCellClass = "cal-day-cell other-month" + (nIsSelected ? " is-selected" : "");
      var nEvHtml = getEventsHtmlForDate(nDate.getFullYear(), nDate.getMonth(), n);
      
      html += `
        <div class="${nCellClass}" onclick="window.calSelectDay('${nDateStr}')" ondblclick="window.openCaseTaskModal('${nDateStr}')" title="Nhấp đúp để lập lịch cho ngày ${n}/${nDate.getMonth() + 1}">
          <div class="cal-cell-header"><span class="cal-date-num">${n}</span></div>
          <div class="flex-grow-1 overflow-hidden">${nEvHtml}</div>
        </div>`;
    }

    gridEl.innerHTML = html;
  }

  window.calSelectDay = function(dateISO) {
    if (!dateISO) return;
    var p = dateISO.split("-");
    if (p.length === 3) {
      calSelectedDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    } else {
      calSelectedDate = new Date(dateISO);
    }
    renderCalendarGrid();
    renderTimelineView(calSelectedDate);
  };

  function renderTimelineView(targetDate) {
    var listEl = document.getElementById('timeline-task-list');
    var badgeEl = document.getElementById('timeline-count-badge');
    var titleEl = document.getElementById('timeline-header-title');
    if (!listEl) return;

    var filterD = targetDate || new Date(); 
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    
    var isToday = (filterD.getFullYear() === today.getFullYear() && filterD.getMonth() === today.getMonth() && filterD.getDate() === today.getDate());

    if (titleEl) {
      titleEl.innerText = isToday ? "LỊCH HÔM NAY" : `LỊCH NGÀY ${("0" + filterD.getDate()).slice(-2)}/${("0" + (filterD.getMonth() + 1)).slice(-2)}/${filterD.getFullYear()}`;
    }

    var dayTasks = calEventsList.filter(function(ev) {
      if (!ev.start) return false;
      var evDate = new Date(ev.start);
      return (evDate.getFullYear() === filterD.getFullYear() && evDate.getMonth() === filterD.getMonth() && evDate.getDate() === filterD.getDate());
    });

    if (badgeEl) badgeEl.innerText = `${dayTasks.length} việc`;

    if (dayTasks.length === 0) {
      listEl.innerHTML = `
        <div class="text-center p-4 bg-white rounded-3 border text-muted" style="border-color: #cbd5e1 !important;">
          <i class="far fa-calendar-check fa-2x mb-2 d-block opacity-50 text-success"></i>
          <div class="fw-bold text-dark small">${isToday ? "Hôm nay không có lịch công tác" : "Không có lịch trong ngày này"}</div>
          <div class="small mt-1 text-muted" style="font-size: 11px;">Nhấp đúp chuột vào ô ngày trên lịch để lên lịch mới.</div>
        </div>`;
      return;
    }

    var html = "";
    dayTasks.forEach(function(task) {
      var dObj = new Date(task.start);
      var timeStr = ("0" + dObj.getHours()).slice(-2) + ":" + ("0" + dObj.getMinutes()).slice(-2);
      var isDone = (task.trangThai === 'Hoàn thành');
      var isPast = dObj.getTime() < today.getTime();
      var taskIdVal = task.idLich || task.id || "";

      var cardClass = "agenda-task-card";
      if (isToday) cardClass += " is-today-card";
      if (isDone) cardClass += " is-completed";
      else if (isPast) cardClass += " is-past-card";

      var isMilestone = (task.title || "").includes("ngày thứ 8") || (task.title || "").includes("ngày thứ 16") || (task.title || "").includes("Mốc 24h");

      var caseDetailsHtml = "";
      if (task.idVuAn && task.idVuAn !== "GENERAL") {
        caseDetailsHtml = `
          <div class="mb-2 pb-2 border-bottom">
            <div class="d-flex align-items-center gap-1 mb-1">
              <span class="badge bg-primary text-white fw-bold">${task.soTL || 'Hồ sơ'}</span>
              <span class="text-muted text-truncate small">${task.quanHe || ''}</span>
            </div>
            ${task.duongSuText ? `<div class="small text-dark fw-bold" style="font-size:12px;"><i class="fas fa-users text-secondary me-1"></i>${task.duongSuText}</div>` : ''}
          </div>`;
      }

      html += `
        <div class="${cardClass}">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="small fw-bold text-primary"><i class="far fa-clock me-1"></i>${timeStr}</span>
            <div class="d-flex align-items-center gap-2">
              ${isMilestone ? '<span class="badge bg-warning text-dark border" style="font-size:10px;"><i class="fas fa-bell me-1"></i>MỐC 24H</span>' : ''}
              <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" ${isDone ? 'checked' : ''} onchange="window.toggleTaskDone('${taskIdVal}', this.checked)" title="Đánh dấu hoàn thành">
              </div>
            </div>
          </div>
          
          ${caseDetailsHtml}
          <div class="small fw-bold text-dark mb-1 ${isDone ? 'text-decoration-line-through text-muted' : ''}">${task.title}</div>
          ${task.ghiChu ? `<div class="small text-muted mb-2 fst-italic"><i class="fas fa-map-marker-alt me-1 text-danger"></i>${task.ghiChu}</div>` : ''}

          <div class="d-flex justify-content-end gap-1 pt-2 border-top mt-2">
            ${task.idVuAn && task.idVuAn !== 'GENERAL' ? `
              <button class="btn btn-sm btn-action-tonal py-0 px-2 fw-bold" style="font-size: 11px; height: 26px; border-radius: 6px;" onclick="window.openDraftingModal('${task.idVuAn}', { trieuTapDate: '${task.start.split('T')[0]}', trieuTapTime: '${timeStr}', noiDungThem: '${task.title.replace(/'/g, "\\'")}' })" title="Soạn văn bản tố tụng theo mốc này">
                <i class="fas fa-file-signature me-1"></i> Soạn văn bản
              </button>
              <button class="btn btn-sm btn-action-outline py-0 px-2 text-primary" style="font-size: 11px; height: 26px; border-radius: 6px;" onclick="window.moChiTiet('${task.idVuAn}')" title="Mở hồ sơ vụ án">
                <i class="fas fa-folder-open"></i>
              </button>
            ` : ''}

            <button class="btn btn-sm btn-action-outline py-0 px-2 text-warning fw-bold" style="font-size: 11px; height: 26px; border-radius: 6px;" onclick="window.openEditCalendarEventModal('${taskIdVal}')" title="Sửa lịch này">
              <i class="fas fa-edit me-1"></i> Sửa
            </button>

            <button class="btn btn-sm btn-action-outline py-0 px-2 text-danger" style="font-size: 11px; height: 26px; border-radius: 6px;" onclick="window.deleteCalendarEvent('${taskIdVal}')" title="Xóa lịch">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>`;
    });

    listEl.innerHTML = html;
  }

  window.openEditCalendarEventModal = function(idLich) {
    if (!idLich) return;

    var ev = calEventsList.find(function(x) { 
      return x.idLich === idLich || x.id === idLich; 
    });
    if (!ev) return;

      var dStr = ev.start.includes("T") ? ev.start.split("T")[0] : ev.start.split(" ")[0];

  window.liveSearchCaseForCal = function(query) {
    var dropdown = document.getElementById('cal_search_case_results');
    var q = (query || "").trim().toLowerCase();
    if (!q) {
      dropdown.style.display = 'none';
      return;
    }

    var cases = window.G_An || window.G_Cases || [];
    var matched = cases.filter(function(c) {
      var soTL = (c.soTL || "").toLowerCase();
      var quanHe = (c.quanHe || "").toLowerCase();
      var parties = (c.duongSuText || c.partiesSummary || (c.nguyenDon + " " + c.biDon) || "").toLowerCase();
      return soTL.includes(q) || quanHe.includes(q) || parties.includes(q);
    }).slice(0, 10);

    if (matched.length === 0) {
      dropdown.innerHTML = '<div class="p-3 text-muted text-center small">Không tìm thấy vụ án phù hợp</div>';
    } else {
      var html = "";
      matched.forEach(function(c) {
        var pSummary = c.duongSuText || c.partiesSummary || (c.nguyenDon ? c.nguyenDon + " - " + c.biDon : "");
        html += `
          <div class="case-search-item" onclick="window.selectCaseForCal('${c.id}', '${(c.soTL || '').replace(/'/g, "\\'")}', '${(c.quanHe || '').replace(/'/g, "\\'")}')">
            <div class="fw-bold text-primary">${c.soTL || 'Hồ sơ'} - <span class="text-dark">${c.quanHe || ''}</span></div>
            <div class="text-muted small">${pSummary}</div>
          </div>`;
      });
      dropdown.innerHTML = html;
    }
    dropdown.style.display = 'block';
  };

  window.clearSelectedCaseForCal = function() {

    document.getElementById('cal_search_case_input').value = "";
    document.getElementById('cal_search_case_results').style.display = 'none';
  };

  window.submitLiveSearchCal = function(isDraftNext) {
    var editingIdLich = document.getElementById('cal_editing_idLich').value;
    var idVuAn = document.getElementById('cal_selected_idVuAn').value || "GENERAL";
    var ngay = document.getElementById('cal_modal_ngay').value;
    var gio = document.getElementById('cal_modal_gio').value;
    var noiDung = document.getElementById('cal_modal_noiDung').value.trim();
    var ghiChu = document.getElementById('cal_modal_ghiChu').value.trim();

    if (!ngay || !noiDung) {
      AppUI.showToast("Vui lòng điền ngày và nội dung công việc", "error");
      return;
    }

    var payload = {
      idLich: editingIdLich || "",
      idVuAn: idVuAn,
      ngay: ngay,
      gio: gio,
      noiDung: noiDung,
      ghiChu: ghiChu
    };

    var modalInst = bootstrap.Modal.getInstance(document.getElementById('modalLiveSearchLich'));
    if (modalInst) modalInst.hide();
    
    AppUI.showToast(editingIdLich ? "Đang cập nhật lịch..." : "Đang lưu lịch...", "");

    var handleSuccess = function(res) {
      if (res && res.success) {
        AppUI.showToast(editingIdLich ? "Đã cập nhật lịch thành công!" : "Đã lưu lịch công tác thành công!", "success");
        window.loadSchedule();

        if (isDraftNext && idVuAn !== 'GENERAL') {
          window.openDraftingModal(idVuAn, {
            trieuTapDate: ngay,
            trieuTapTime: gio,
            noiDungThem: noiDung
          });
        }
      } else {
        AppUI.showToast("Lỗi: " + (res ? res.error : "Không thể lưu"), "error");
      }
    };

    if (editingIdLich) {
      google.script.run
        .withSuccessHandler(handleSuccess)
        .withFailureHandler(function(err) { AppUI.showToast("Lỗi: " + err.message, "error"); })
        .api_CapNhatLich(payload);
    } else {
      google.script.run
        .withSuccessHandler(handleSuccess)
        .withFailureHandler(function(err) { AppUI.showToast("Lỗi: " + err.message, "error"); })
        .api_LuuLichMoi(payload);
    }
  };

  window.toggleTaskDone = function(idLich, isChecked) {
    var newStatus = isChecked ? "Hoàn thành" : "Chưa thực hiện";
    google.script.run
      .withSuccessHandler(function() {
        var item = calEventsList.find(function(x) { return (x.idLich === idLich || x.id === idLich); });
        if (item) item.trangThai = newStatus;
        renderCalendarGrid();
        renderTimelineView(calSelectedDate);
        if (typeof window.runFilterEngine === 'function') window.runFilterEngine();
      })
      .api_CapNhatTrangThaiLich(idLich, newStatus);
  };

  window.syncGCal = function() {
    AppUI.showToast("Đang đồng bộ Google Calendar...", "");
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          AppUI.showToast(`Đã đồng bộ ${res.synced || 0} lịch sang Google Calendar!`, "success");
          window.loadSchedule();
        } else {
          AppUI.showToast("Đồng bộ hoàn tất!", "success");
        }
      })
      .api_DongBoLichCaNhan();
  };

  window.deleteCalendarEvent = function(idLich) {
    if (!idLich) return;
    AppUI.confirm("Xóa lịch công tác", "Bạn có chắc muốn xóa lịch làm việc này?", "danger", function() {
      calEventsList = calEventsList.filter(function(x) { return x.idLich !== idLich && x.id !== idLich; });
      window.G_LichTrinh = calEventsList;
      renderCalendarGrid();
      renderTimelineView(calSelectedDate);
      AppUI.showToast("Đã xóa lịch làm việc!", "success");

      google.script.run
        .withFailureHandler(function(err) {
          AppUI.showToast("Lỗi đồng bộ máy chủ: " + err.message, "error");
          window.loadSchedule();
        })
        .api_XoaLich(idLich);
    });
  };

  // TỰ ĐỘNG KHỞI TẠO LƯỚI LỊCH
  renderCalendarGrid();
  renderTimelineView(calSelectedDate);
</script>
