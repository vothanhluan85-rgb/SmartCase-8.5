window.removeAccents = function(str) {
  if (!str) return "";
  return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
};

window.cleanHonorificFromName = function(name) {
  if (!name) return "";
  return String(name).trim().replace(/^(ông\/bà|ông\/bà\.|ông|bà|anh|chị|cô|chú|bác|cháu)\s*[:.\-]?\s+/i, '').trim();
};

window.isIndividualHonorific = function(xh) {
  if (!xh) return false;
  var x = String(xh).trim().toLowerCase();
  var legalEntities = ["tổ chức", "pháp nhân", "công ty", "doanh nghiệp", "ubnd", "ngân hàng", "chi nhánh", "hợp tác xã", "cơ quan"];
  if (legalEntities.includes(x)) return false;
  return ["ông", "bà", "anh", "chị", "cháu", "ông/bà"].includes(x);
};

window.toTitleCase = function(str) {
  if (!str) return "";
  var acronyms = [
    "TMCP", "TNHH", "CP", "MTV", "UBND", "TAND", "VKSND", "VN", "JSC", "BHTG", 
    "HTX", "NHCSXH", "NHTMCP", "NH", "BIDV", "ACB", "MB", "VPBANK", "VIETINBANK", 
    "VIETCOMBANK", "AGRIBANK", "SHB", "TPBANK", "HDBANK", "VIB", "MSB", "OCB", 
    "SEABANK", "LPBANK", "SCB", "SACOMBANK", "ABBANK", "BAB", "NCB", "QLTA"
  ];
  var words = String(str).trim().toLowerCase().split(/\s+/);
  return words.map(function(w) {
    var upperW = w.toUpperCase();
    if (acronyms.includes(upperW)) return upperW;
    if (w.includes("'") || w.includes("’")) {
      return w.split(/['’]/).map(function(p) { return p ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : ""; }).join("'");
    }
    return upperW.charAt(0) + w.slice(1).toLowerCase();
  }).join(" ");
};
window.toTitleCaseLocal = window.toTitleCase;
window.local_toTitleCase = window.toTitleCase;

window.formatPhoneNumber = function(phone) {
  if (!phone) return "";
  var str = String(phone).trim().replace(/[^0-9+]/g, '');
  if (str.length > 0 && str.charAt(0) !== '0' && str.charAt(0) !== '+') str = '0' + str;
  return str;
};
window.local_formatPhoneNumber = window.formatPhoneNumber;

window.formatPhoneVNInput = function(input) {
  if (!input) return;
  var val = input.value.replace(/\D/g, '');
  if (val.length > 10) val = val.substring(0, 10);
  var formatted = val;
  if (val.length > 7) formatted = val.substring(0, 4) + '.' + val.substring(4, 7) + '.' + val.substring(7);
  else if (val.length > 4) formatted = val.substring(0, 4) + '.' + val.substring(4);
  input.value = formatted;
};

window.standardizeResolutionAbbr = function(raw) {
  if (!raw) return "Đã giải quyết";
  var s = String(raw).trim();
  var sLow = window.removeAccents(s.toLowerCase());

  if (sLow.includes("thuan tinh ly hon") || sLow.includes("cong nhan thuan tinh")) return "QĐCN-TTLH";
  if (sLow.includes("su thoa thuan") || sLow.includes("thoa thuan") || sLow.includes("hoa giai thanh")) {
    if (sLow.includes("hgdt") || sLow.includes("doi thoai")) return "QĐCN-HGĐT";
    return "QĐCNTT";
  }
  if (sLow.includes("ban an") || sLow.includes("xet xu")) return "Bản án";
  if (sLow.includes("tam dinh chi")) return "Tạm đình chỉ";
  if (sLow.includes("dinh chi")) return "Đình chỉ";
  if (sLow.includes("tra ho so") || sLow.includes("dieu tra bo sung")) return "Trả HS ĐTBS";
  if (sLow.includes("gia han")) return "Gia hạn";
  if (sLow.includes("tiep tuc")) return "Tiếp tục giải quyết";
  if (sLow.includes("chuyen ho so") || sLow.includes("chuyen vu an")) return "Chuyển hồ sơ";
  if (sLow.includes("nhap vu an") || sLow.includes("nhap vu viec")) return "Nhập vụ án";
  if (sLow.includes("viec dan su") || sLow.includes("giai quyet viec")) return "QĐGQ-VDS";
  return s;
};

window.numberToWordsVi = function(so) {
  if (so === 0 || so === "0" || so === "") return "Không đồng";
  so = parseInt(String(so).replace(/[^\d]/g, ''), 10);
  if (isNaN(so) || so === 0) return "Không đồng";
  var chuSo = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
  var donVi = ["", "nghìn", "triệu", "tỷ", "nghìn tỷ", "triệu tỷ"];
  var numStr = String(so);
  var blocks = [];
  while (numStr.length > 0) { blocks.push(numStr.slice(-3)); numStr = numStr.slice(0, -3); }
  var str = "";
  for (var i = 0; i < blocks.length; i++) {
    var blockStr = blocks[i];
    var val = parseInt(blockStr, 10);
    if (val > 0) {
      var isHighest = (i === blocks.length - 1);
      if (!isHighest) { while (blockStr.length < 3) blockStr = "0" + blockStr; }
      var tram = blockStr.length === 3 ? parseInt(blockStr[0], 10) : -1;
      var chuc = blockStr.length >= 2 ? parseInt(blockStr[blockStr.length - 2], 10) : 0;
      if (blockStr.length === 1) chuc = -1;
      var donvi = parseInt(blockStr[blockStr.length - 1], 10);
      var kq = "";
      if (tram !== -1) kq += chuSo[tram] + " trăm ";
      if (chuc > 1) {
        kq += chuSo[chuc] + " mươi ";
        if (donvi === 1) kq += "mốt"; else if (donvi === 5) kq += "lăm"; else if (donvi > 0) kq += chuSo[donvi];
      } else if (chuc === 1) {
        kq += "mười ";
        if (donvi === 5) kq += "lăm"; else if (donvi > 0) kq += chuSo[donvi];
      } else if (chuc === 0) {
        if (donvi > 0) { if (tram !== -1) kq += "lẻ "; kq += chuSo[donvi]; }
      } else { kq += chuSo[donvi]; }
      str = kq.trim() + " " + donVi[i] + " " + str;
    }
  }
  return str.replace(/\s+/g, " ").trim().charAt(0).toUpperCase() + str.replace(/\s+/g, " ").trim().slice(1) + " đồng";
};
window.local_numberToWordsVi = window.numberToWordsVi;

window.calculateCourtFee = function(loaiAn, giaTriRaw) {
  var fee = 0; var tamUng = 0;
  var la = String(loaiAn || "").toLowerCase();
  
  if (la.includes("hinhsu") || la.includes("hình sự") || la.includes("1.")) {
    fee = 200000; tamUng = 0;
  } else if (la.includes("hanhchinh") || la.includes("hành chính") || la.includes("6.")) {
    fee = 300000; tamUng = 300000;
  } else {
    var giaTri = parseInt(String(giaTriRaw).replace(/[^\d]/g, ''), 10) || 0;
    var isKDTM = la.includes("kinhdoanh") || la.includes("kinh doanh") || la.includes("4.");
    var noPriceFee = isKDTM ? 3000000 : 300000;

    if (giaTri <= 0) {
      fee = noPriceFee;
    } else {
      if (giaTri <= 6000000) fee = 300000;
      else if (giaTri <= 400000000) fee = isKDTM ? (3000000 + (giaTri - 6000000) * 0.05) : (giaTri * 0.05);
      else if (giaTri <= 800000000) fee = (isKDTM ? 22700000 : 20000000) + (giaTri - 400000000) * 0.04;
      else if (giaTri <= 2000000000) fee = (isKDTM ? 38700000 : 36000000) + (giaTri - 800000000) * 0.03;
      else if (giaTri <= 4000000000) fee = (isKDTM ? 74700000 : 72000000) + (giaTri - 2000000000) * 0.02;
      else fee = (isKDTM ? 114700000 : 112000000) + (giaTri - 4000000000) * 0.001;
    }
    fee = Math.round(fee);
    tamUng = fee * 0.5;
    if (tamUng < noPriceFee) tamUng = noPriceFee;
    if (giaTri === 0) tamUng = fee;
  }
  return {
    anPhiSo: fee.toLocaleString('vi-VN'),
    anPhiChu: window.numberToWordsVi(fee),
    tamUngSo: Math.round(tamUng).toLocaleString('vi-VN'),
    tamUngChu: window.numberToWordsVi(Math.round(tamUng))
  };
};
window.local_calculateCourtFee = window.calculateCourtFee;

window.compressImageFile = function(file, maxWidth, quality, callback) {
  if (!file.type || !file.type.startsWith('image/')) {
    var reader = new FileReader();
    reader.onload = function(e) {
      callback({
        name: file.name,
        mimeType: file.type || "application/pdf",
        base64: e.target.result.split(',')[1],
        dataUrl: e.target.result
      });
    };
    reader.readAsDataURL(file);
    return;
  }
  var img = new Image();
  var reader = new FileReader();
  reader.onload = function(e) {
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var width = img.width, height = img.height;
      var maxW = maxWidth || 1200;
      if (width > maxW) { height = Math.round((height * maxW) / width); width = maxW; }
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      var compressedDataUrl = canvas.toDataURL('image/jpeg', quality || 0.7);
      callback({
        name: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
        mimeType: "image/jpeg",
        base64: compressedDataUrl.split(',')[1],
        dataUrl: compressedDataUrl
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

function ensureAppUIDOM() {
  if (!document.getElementById('global-toast-container')) {
    var toastHtml = 
      '<div id="global-toast-container">' +
        '<i id="global-toast-icon" class="fas fa-spinner fa-spin me-2"></i>' +
        '<span id="global-toast-text">Đang làm việc...</span>' +
      '</div>' +
      '<div id="app-dialog" class="app-dialog-overlay">' +
        '<div class="app-dialog-box animate-fadeIn">' +
          '<div class="app-dialog-header" id="dialog-title">Xác nhận</div>' +
          '<div class="app-dialog-body" id="dialog-message">Bạn có chắc chắn không?</div>' +
          '<div class="app-dialog-footer">' +
            '<button class="btn-dialog btn-dialog-cancel" id="dialog-btn-cancel">Hủy</button>' +
            '<button class="btn-dialog btn-dialog-confirm" id="dialog-btn-confirm">Đồng ý</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="background-task-queue"></div>';
    document.body.insertAdjacentHTML('beforeend', toastHtml);
  }
}

const AppUI = {
  showToast: function(msg, type) {
    ensureAppUIDOM();
    const toast = document.getElementById('global-toast-container');
    const icon = document.getElementById('global-toast-icon');
    const textEl = document.getElementById('global-toast-text');
    if (!toast || !textEl) return;

    textEl.innerText = msg;
    toast.className = 'show ' + (type || '');
    
    if (type === 'success') icon.className = 'fas fa-check-circle me-2 text-white';
    else if (type === 'error') icon.className = 'fas fa-exclamation-triangle me-2 text-white';
    else if (type === 'info') icon.className = 'fas fa-info-circle me-2 text-white';
    else icon.className = 'fas fa-spinner fa-spin me-2 text-white';

    if (globalToastTimeout) clearTimeout(globalToastTimeout);
    if (type === 'success' || type === 'error' || type === 'info') {
      globalToastTimeout = setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }
  },

  hideToast: function() {
    const toast = document.getElementById('global-toast-container');
    if (toast) toast.classList.remove('show');
  },

  confirm: function(title, message, type, onConfirm) {
    ensureAppUIDOM();
    const overlay = document.getElementById('app-dialog');
    if (!overlay) return;
    
    document.getElementById('dialog-title').innerHTML = title;
    document.getElementById('dialog-message').innerHTML = String(message).replace(/\n/g, '<br>');
    
    const btnConfirm = document.getElementById('dialog-btn-confirm');
    const btnCancel = document.getElementById('dialog-btn-cancel');
    btnConfirm.className = 'btn-dialog ' + (type === 'danger' ? 'btn-dialog-danger' : 'btn-dialog-confirm');
    btnConfirm.innerText = type === 'danger' ? 'Đồng ý xóa' : 'Xác nhận';
    btnCancel.style.display = 'block';

    overlay.classList.add('show');
    const cleanup = function() { overlay.classList.remove('show'); };
    btnCancel.onclick = cleanup;
    btnConfirm.onclick = function() { cleanup(); if (typeof onConfirm === 'function') onConfirm(); };
  },

  alert: function(title, message) {
    ensureAppUIDOM();
    const overlay = document.getElementById('app-dialog');
    if (!overlay) return;
    
    document.getElementById('dialog-title').innerHTML = title;
    document.getElementById('dialog-message').innerHTML = String(message).replace(/\n/g, '<br>');
    
    const btnConfirm = document.getElementById('dialog-btn-confirm');
    const btnCancel = document.getElementById('dialog-btn-cancel');
    btnConfirm.className = 'btn-dialog btn-dialog-confirm';
    btnConfirm.innerText = 'Đã hiểu';
    btnCancel.style.display = 'none'; 

    overlay.classList.add('show');
    btnConfirm.onclick = function() { overlay.classList.remove('show'); btnCancel.style.display = 'block'; };
  },

  addBackgroundTask: function(taskId, message) {
    ensureAppUIDOM();
    let queue = document.getElementById('background-task-queue');
    if (!queue) return;
    
    let taskHtml = 
      '<div id="' + taskId + '" class="bg-task-card p-2 px-3 d-flex align-items-center gap-2 animate-fadeIn">' +
        '<div class="spinner-border text-primary flex-shrink-0" style="width: 14px; height: 14px; border-width: 2px;" role="status"></div>' +
        '<div class="flex-grow-1 overflow-hidden" style="min-width: 0;">' +
          '<div class="fw-bold text-dark" style="font-size: 11.5px; line-height: 1.2;">Đang xuất văn bản...</div>' +
          '<div class="text-muted text-truncate" style="font-size: 10.5px;">' + message + '</div>' +
        '</div>' +
      '</div>';
    queue.insertAdjacentHTML('beforeend', taskHtml);
  },

  completeBackgroundTask: function(taskId, success, linksHtml) {
    ensureAppUIDOM();
    let queue = document.getElementById('background-task-queue');
    if (!queue) return;

    let task = document.getElementById(taskId);
    if (!task) { 
      task = document.createElement('div');
      task.id = taskId;
      task.className = 'bg-task-card animate-fadeIn';
      queue.appendChild(task);
    }

    task.style.borderLeftColor = success ? "#15803d" : "#dc2626";
    task.innerHTML = 
      '<button class="btn btn-sm text-secondary position-absolute" style="top: 2px; right: 2px; border:none; box-shadow:none; padding: 1px 5px; z-index: 10; font-size: 11px; cursor: pointer;" onclick="this.parentElement.remove()" title="Đóng thông báo"><i class="fas fa-times"></i></button>' +
      '<div class="d-flex align-items-start gap-2 w-100 p-2">' +
        '<i class="fas ' + (success ? 'fa-check-circle text-success' : 'fa-times-circle text-danger') + ' mt-1 flex-shrink-0" style="font-size: 13px;"></i>' +
        '<div class="flex-grow-1 overflow-hidden" style="min-width: 0;">' +
          '<div class="fw-bold text-dark" style="font-size: 11px; line-height: 1.2; margin-bottom: 3px;">' + (success ? 'Hoàn tất xuất văn bản!' : 'Lỗi xử lý') + '</div>' +
          '<div class="w-100 d-flex flex-column gap-1" style="font-size: 11px;">' + (success ? linksHtml : '<span class="text-danger fw-bold" style="font-size: 10.5px;">' + linksHtml + '</span>') + '</div>' +
        '</div>' +
      '</div>';
  }
};

document.addEventListener('hidden.bs.modal', function() {
  setTimeout(function() {
    if (!document.querySelector('.modal.show')) {
      document.querySelectorAll('.modal-backdrop').forEach(function(b) { b.remove(); });
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  }, 100);
});

window.forceCleanupModals = function() {
  document.querySelectorAll('.modal.show').forEach(function(mEl) {
    const inst = bootstrap.Modal.getInstance(mEl);
    if (inst) inst.hide();
  });
  
  setTimeout(function() {
    document.querySelectorAll('.modal-backdrop').forEach(function(b) { b.remove(); });
    document.body.classList.remove('modal-open');
    document.body.style.overflow = '';
    document.body.style.paddingRight = '';
    document.querySelectorAll('.modal').forEach(function(m) { 
      m.classList.remove('show'); 
      m.style.display = 'none'; 
    });
  }, 150);
};

// ĐÃ KHẮC PHỤC LỖI REGEX TRONG FORMAT MARKDOWN
window.formatCopilotMarkdown = function(text) {
  if (!text) return "";
  var html = text
    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.*?)\*/g, '<i>$1</i>')
    .replace(/\n/g, '<br>');

  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="fw-bold text-primary text-decoration-underline">$1</a>');

  // Xử lý Cú pháp [ACTION:...] bằng split thay vì Regex tĩnh để giải quyết các tham số rỗng (:::)
  html = html.replace(/\[ACTION:([^\]]+)\]/g, function(match, innerContent) {
    var parts = innerContent.split(':');
    var fnName = (parts[0] || "").trim();
    var param1 = (parts[1] || "").trim();
    var param2 = (parts[2] || "").trim();
    var btnTitle = parts.slice(3).join(':').trim(); // Cho phép tiêu đề chứa dấu hai chấm
    
    if (!btnTitle || btnTitle === fnName) {
      btnTitle = "👉 Thực hiện thao tác";
    }

    return '<button type="button" class="copilot-action-btn" onclick="window.handleCopilotAction(\'' + fnName + '\', \'' + param1.replace(/'/g, "\\'") + '\', \'' + param2.replace(/'/g, "\\'") + '\')">' + btnTitle + '</button>';
  });

  return html;
};

// ĐÃ BỔ SUNG ĐỊNH TUYẾN moChiTietDon
window.handleCopilotAction = function(fnName, p1, p2) {
  if (fnName === 'moChiTiet' || fnName === 'moHoSo') {
    var targetId = p1;
    if (p1 && window.G_An && Array.isArray(window.G_An)) {
      var cleanSearch = String(p1).trim().toLowerCase();
      var matched = window.G_An.find(function(c) {
        return c.id === p1 || String(c.soTL || '').toLowerCase() === cleanSearch || String(c.soTL || '').toLowerCase().includes(cleanSearch);
      });
      if (matched) targetId = matched.id;
    }
    if (typeof window.moChiTiet === 'function') window.moChiTiet(targetId);
  } else if (fnName === 'moChiTietDon') {
    var targetDonId = p1;
    if (p1 && window.G_Don && Array.isArray(window.G_Don)) {
      var cleanDonSearch = String(p1).trim().toLowerCase();
      var matchedDon = window.G_Don.find(function(d) {
        return d.id === p1 || String(d.soDon || '').toLowerCase() === cleanDonSearch || String(d.soDon || '').toLowerCase().includes(cleanDonSearch);
      });
      if (matchedDon) targetDonId = matchedDon.id;
    }
    if (typeof window.moChiTietDon === 'function') window.moChiTietDon(targetDonId);
  } else if (fnName === 'openDraftingModal') {
    var draftTargetId = (p1 === 'CURRENT_CASE' || !p1) ? (window.currentCaseId || 'CURRENT_CASE') : p1;
    if (p1 && p1 !== 'CURRENT_CASE' && window.G_An) {
      var cDraft = window.G_An.find(function(c) { return c.id === p1 || String(c.soTL || '').toLowerCase().includes(String(p1).toLowerCase()); });
      if (cDraft) draftTargetId = cDraft.id;
    }
    if (typeof window.openDraftingModal === 'function') {
      window.openDraftingModal(draftTargetId, p2 ? { autoSelectKeywordsArray: [p2] } : null);
    }
  } else if (fnName === 'openTaskModal') {
    var taskCaseId = p1;
    var taskSoTL = p2 || "";
    if (p1 && window.G_An) {
      var cTask = window.G_An.find(function(c) { return c.id === p1 || String(c.soTL || '').toLowerCase().includes(String(p1).toLowerCase()); });
      if (cTask) { taskCaseId = cTask.id; taskSoTL = cTask.soTL; }
    }
    if (typeof window.openTaskModal === 'function') {
      window.openTaskModal(taskCaseId, taskSoTL);
    }
  } else if (fnName === 'openResolutionModal' && typeof window.openResolutionModal === 'function') {
    window.openResolutionModal();
  } else if (fnName === 'openAnPhiModal' || fnName === 'openCalculatorModal' || fnName === 'moModalTinhAnPhi') {
    if (typeof window.openAnPhiModal === 'function') window.openAnPhiModal();
  } else if (fnName === 'openWizardCapNhatDuongSu') {
    if (typeof window.openWizardCapNhatDuongSu === 'function') window.openWizardCapNhatDuongSu();
  } else if (fnName === 'openTemplateFolder' || fnName === 'openKhoBieuMau') {
    if (typeof window.openTemplateFolder === 'function') window.openTemplateFolder();
  } else if (fnName === 'moModalThemMoi') {
    if (typeof window.moModalThemMoi === 'function') window.moModalThemMoi();
  } else if (fnName === 'chuyenDonSangThuLy' && typeof window.chuyenDonSangThuLy === 'function') {
    window.chuyenDonSangThuLy(p1);
  } else if (fnName === 'sendQuickSMS' && typeof window.sendQuickSMS === 'function') {
    window.sendQuickSMS(p1);
  } else if (fnName === 'appNavigate' && typeof window.appNavigate === 'function') {
    window.appNavigate(p1);
  } else {
    AppUI.showToast("Kích hoạt thao tác: " + fnName, "info");
  }
};

window.sendCopilotMessage = function() {
  var input = document.getElementById('copilot-user-input');
  var body = document.getElementById('copilot-msg-body');
  var sendBtn = document.getElementById('copilot-send-btn');
  var stopBtn = document.getElementById('copilot-stop-btn');
  if (!input || !body) return;

  var msg = input.value.trim();
  if (!msg && window.copilotAttachments.length === 0) return;

  var displayMsg = msg;
  if (window.copilotAttachments.length > 0) {
    var filesBadge = window.copilotAttachments.map(function(f) {
      var icon = f.name.toLowerCase().endsWith('.pdf') ? 'fa-file-pdf text-danger' : (f.mimeType.startsWith('image/') ? 'fa-image text-success' : 'fa-file-word text-primary');
      return '<span class="badge bg-light text-secondary border mt-1 me-1"><i class="fas ' + icon + ' me-1"></i> ' + f.name + '</span>';
    }).join('');
    displayMsg += '<br>' + filesBadge;
  }

  var userMsgEl = document.createElement('div');
  userMsgEl.className = 'copilot-msg copilot-msg-user animate-fadeIn';
  userMsgEl.innerHTML = displayMsg || "(Đã gửi " + window.copilotAttachments.length + " ảnh/tệp)";
  body.appendChild(userMsgEl);

  input.value = '';
  input.style.height = 'auto';
  body.scrollTop = body.scrollHeight;

  window.isCopilotThinking = true;
  if (sendBtn) sendBtn.style.display = 'none';
  if (stopBtn) stopBtn.style.display = 'flex';

  var loadingId = 'ai-loading-' + Date.now();
  var aiLoadingEl = document.createElement('div');
  aiLoadingEl.id = loadingId;
  aiLoadingEl.className = 'ai-typing-indicator animate-fadeIn';
  aiLoadingEl.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(aiLoadingEl);
  body.scrollTop = body.scrollHeight;

  var daysOfWeek = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
  var now = new Date();
  var currentDateVN = daysOfWeek[now.getDay()] + ", ngày " + ("0" + now.getDate()).slice(-2) + "/" + ("0" + (now.getMonth() + 1)).slice(-2) + "/" + now.getFullYear();

  var attachmentsList = [];
  if (window.copilotAttachments && window.copilotAttachments.length > 0) {
    window.copilotAttachments.forEach(function(f) {
      attachmentsList.push({ fileName: f.name, mimeType: f.mimeType, base64Data: f.base64 });
    });
    window.copilotAttachments = []; 
    window.renderCopilotAttachmentZone();
  }

  var contextPayload = {
    scope: window.CURRENT_APP_CONTEXT.scope,
    caseInfo: window.CURRENT_APP_CONTEXT.caseInfo,
    caseParties: window.CURRENT_APP_CONTEXT.caseParties,
    donInfo: window.CURRENT_APP_CONTEXT.donInfo,
    currentDateVN: currentDateVN,
    attachments: attachmentsList
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (!window.isCopilotThinking) return;
      window.stopCopilotGeneration();

      var el = document.getElementById(loadingId);
      if (el) el.remove();

      var aiMsgEl = document.createElement('div');
      aiMsgEl.className = 'copilot-msg copilot-msg-ai animate-fadeIn';

      if (res && res.success) {
        var rawReply = res.reply || "";
        aiMsgEl.innerHTML = window.formatCopilotMarkdown(rawReply);
      } else {
        aiMsgEl.innerHTML = '<span class="text-danger"><i class="fas fa-triangle-exclamation me-1"></i>' + (res ? res.error : "Không thể nhận phản hồi.") + '</span>';
      }

      body.appendChild(aiMsgEl);
      body.scrollTop = body.scrollHeight;
    })
    .withFailureHandler(function(err) {
      if (!window.isCopilotThinking) return;
      window.stopCopilotGeneration();

      var el = document.getElementById(loadingId);
      if (el) el.remove();

      var aiMsgEl = document.createElement('div');
      aiMsgEl.className = 'copilot-msg copilot-msg-ai text-danger animate-fadeIn';
      aiMsgEl.innerHTML = '<i class="fas fa-wifi me-1"></i> Lỗi kết nối: ' + err.message;
      body.appendChild(aiMsgEl);
      body.scrollTop = body.scrollHeight;
    })
    .api_AskGeminiCopilot(msg, contextPayload);
};

function normalizeCategoryCode(rawCat) {
  if (!rawCat) return 'ALL';
  var c = String(rawCat).toUpperCase().trim();
  if (c === 'ALL' || c === 'TONG_SO' || c === 'TOTAL' || c === 'TẤT CẢ' || c === 'TỔNG THỤ LÝ') return 'ALL';
  if (c === 'ACTIVE' || c === 'PENDING' || c === 'DANG_XU_LY' || c === 'DANG_GIAI_QUYET' || c === 'ĐANG GIẢI QUYẾT') return 'ACTIVE';
  if (c === 'FINISHED' || c === 'DONE' || c === 'HOAN_THANH' || c === 'DA_GIAI_QUYET' || c === 'ĐÃ HOÀN THÀNH' || c === 'ĐÃ GIẢI QUYẾT') return 'FINISHED';
  if (c === 'URGENT' || c === 'SAP_HET_HAN' || c === 'SAP_QUA_HAN' || c === 'WARNING' || c === 'SẮP HẾT HẠN') return 'URGENT';
  if (c === 'OVERDUE' || c === 'QUA_HAN' || c === 'DA_QUA_HAN' || c === 'QUÁ HẠN') return 'OVERDUE';
  if (c === 'FROZEN' || c === 'TDC' || c === 'TAM_DINH_CHI' || c === 'TẠM ĐÌNH CHỈ') return 'FROZEN';
  if (c === 'HGDT' || c === 'HGĐT' || c === 'HOA_GIAI' || c === 'HÒA GIẢI ĐỐI THOẠI' || c === 'HOAGIAI') return 'HGDT';
  return c;
}

window.setFilter = function(key, value, ev) {
  window.G_Filter[key] = value;
  
  if (key === 'category') {
    document.querySelectorAll('.stat-box, .stat-card').forEach(function(el) { el.classList.remove('active-filter'); });
    
    var currentEv = ev || (typeof window !== 'undefined' && window.event ? window.event : null);
    var targetCard = currentEv && currentEv.currentTarget ? currentEv.currentTarget : null;

    if (targetCard && (targetCard.classList.contains('stat-box') || targetCard.classList.contains('stat-card'))) {
      targetCard.classList.add('active-filter');
    } else {
      var norm = String(value).toUpperCase();
      document.querySelectorAll('.stat-box, .stat-card').forEach(function(card) {
        var txt = card.innerText.toUpperCase();
        if (norm === 'ALL' && txt.includes('TỔNG')) card.classList.add('active-filter');
        else if (norm === 'FINISHED' && (txt.includes('HOÀN THÀNH') || txt.includes('ĐÃ GIẢI QUYẾT'))) card.classList.add('active-filter');
        else if (norm === 'ACTIVE' && (txt.includes('ĐANG GIẢI QUYẾT') || txt.includes('ĐANG XỬ LÝ'))) card.classList.add('active-filter');
        else if (norm === 'URGENT' && txt.includes('SẮP HẾT HẠN')) card.classList.add('active-filter');
        else if (norm === 'OVERDUE' && txt.includes('QUÁ HẠN')) card.classList.add('active-filter');
        else if (norm === 'FROZEN' && txt.includes('TẠM ĐÌNH CHỈ')) card.classList.add('active-filter');
        else if ((norm === 'HGDT' || norm === 'HOAGIAI' || norm === 'HGĐT') && (txt.includes('HÒA GIẢI') || txt.includes('HG ĐỐI THOẠI'))) card.classList.add('active-filter');
      });
    }
  }
  window.runFilterEngine();
};

};

function getStatisticalStartDate() {
  var now = new Date();
  var startYear = (now.getMonth() >= 9) ? now.getFullYear() : (now.getFullYear() - 1);

}

  return dateObj.getFullYear() + "-" + ("0" + (dateObj.getMonth() + 1)).slice(-2) + "-" + ("0" + dateObj.getDate()).slice(-2);

/**
 * XÁC THỰC GOOGLE ACCOUNT & PHÂN QUYỀN VAI TRÒ (THẨM PHÁN / THƯ KÝ)
 */
function loadJudgeIdentity() {
  google.script.run
    .withSuccessHandler(function(auth) {
      if (!auth) return;
      window.CURRENT_USER_AUTH = auth;

      // TRƯỜNG HỢP 1: TÀI KHOẢN KHÔNG CÓ QUYỀN TRUY CẬP (KHÓA TOÀN BỘ ỨNG DỤNG)
      if (!auth.success || auth.role === 'UNAUTHORIZED') {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.display = 'flex';
          splash.style.opacity = '1';
          splash.style.pointerEvents = 'auto';
          splash.innerHTML = `
            <div class="p-4 p-md-5 bg-white rounded-4 shadow-lg border text-center animate-fadeIn" style="max-width: 520px; margin: 15px; border-color: #cbd5e1 !important;">
              <div class="mb-3">
                <i class="fas fa-user-lock fa-3x text-danger" style="filter: drop-shadow(0 4px 6px rgba(220, 38, 38, 0.2));"></i>
              </div>
              <h5 class="fw-bold text-dark text-uppercase mb-2" style="letter-spacing: 0.5px;">TRUY CẬP BỊ TỪ CHỐI</h5>
              <p class="text-secondary small mb-3" style="line-height: 1.6;">
                Tài khoản Google <b>${auth.email || 'Ẩn danh'}</b> chưa được phân quyền trong hệ thống của Thẩm phán.
              </p>
              <div class="alert alert-warning border-0 small text-start mb-3" style="background-color: #fffbeb; color: #b45309; line-height: 1.5; border-radius: 8px;">
                <i class="fas fa-info-circle me-1"></i> <b>Dành cho Thư ký giúp việc:</b><br>
                Vui lòng liên hệ Thẩm phán phụ trách để thêm địa chỉ Gmail này vào danh sách phân quyền tại mục <b>Cài đặt &gt; Quản lý Thư ký</b>.
              </div>
              <button type="button" class="btn btn-sm btn-outline-secondary px-4 fw-bold" onclick="location.reload()">
                <i class="fas fa-rotate me-1"></i> Tải lại trang sau khi được cấp quyền
              </button>
            </div>
          `;
        }
        return;
      }

      // TRƯỜNG HỢP 2: TÀI KHOẢN HỢP LỆ -> CẬP NHẬT HEADER & GIAO DIỆN
      var headerTP = document.getElementById('header-ten-tp');
      var headerToa = document.getElementById('header-ten-toa');
      var aiBadge = document.getElementById('header-ai-status-badge');

      if (auth.role === 'JUDGE') {
        if (headerTP) headerTP.innerHTML = `<span class="badge bg-primary me-1" style="font-size: 9.5px; vertical-align: middle;">Thẩm phán</span> ${auth.displayName}`;
        if (headerToa) headerToa.innerText = auth.courtName;
      } else if (auth.role === 'CLERK') {
        if (headerTP) headerTP.innerHTML = `<span class="badge bg-success me-1" style="font-size: 9.5px; vertical-align: middle;">Thư ký</span> ${auth.displayName}`;
        if (headerToa) headerToa.innerText = `Giúp việc cho Thẩm phán ${auth.judgeName || ''}`;
      }

      // Cập nhật trạng thái kích hoạt Gemini AI trên Header
      if (aiBadge) {
        if (auth.hasAI) {
          aiBadge.className = 'badge bg-success-subtle text-success border border-success px-2 py-1 d-none d-sm-inline-flex align-items-center';
          aiBadge.innerHTML = '<i class="fas fa-robot me-1"></i> AI Sẵn sàng';
          aiBadge.title = 'Google Gemini Flash Engine đang hoạt động';
        } else {
          aiBadge.className = 'badge bg-secondary-subtle text-muted border px-2 py-1 d-none d-sm-inline-flex align-items-center';
          aiBadge.innerHTML = '<i class="fas fa-robot me-1"></i> AI Chưa bật';
          aiBadge.title = 'Chưa cấu hình GEMINI_API_KEY. Vào Cài đặt để kích hoạt';
        }
      }

      // Áp dụng giới hạn quyền trên các nút thao tác
      applyRolePermissions(auth);

      // KIỂM TRA BẢN SAO MỚI (CHƯA CẤU HÌNH) -> TỰ ĐỘNG BẬT ONBOARDING WIZARD
      if (auth.role === 'JUDGE') {
        google.script.run
          .withSuccessHandler(function(setupStatus) {
            if (setupStatus && setupStatus.needsSetup) {
              window.openOnboardingWizard(setupStatus);
            }
          })
          .api_CheckSetupStatus();
      }
    })
    .withFailureHandler(function(err) {
      console.warn("Lỗi kiểm tra phiên đăng nhập:", err);
    })
    .api_GetCurrentUserIdentity();
}

/**
 * GIỚI HẠN GIAO DIỆN THEO VAI TRÒ (BẢO VỆ DỮ LIỆU CỦA THẨM PHÁN)
 */
function applyRolePermissions(auth) {
  if (!auth) return;

  // Nếu là Thư ký: Ẩn các chức năng quản trị nhạy cảm
  if (auth.role === 'CLERK') {
    // 1. Không cho xóa vĩnh viễn hồ sơ vụ án ngoài danh sách
    var btnBulkDelete = document.getElementById('btn-bulk-delete-case');
    if (btnBulkDelete) btnBulkDelete.style.display = 'none';

    // 2. Ẩn khối Quản lý Thư ký trong Cài đặt (Thư ký không thêm/xóa thư ký khác)
    var cardThuKy = document.getElementById('card_quanly_thuky');
    if (cardThuKy) cardThuKy.style.display = 'none';

    // 3. Khóa ô nhập API Key trong Cài đặt (tránh lộ hoặc sửa key của Thẩm phán)
    var keyInput = document.getElementById('set_geminiKey');
    if (keyInput) {
      var cardAI = keyInput.closest('.set-card');
      if (cardAI) cardAI.style.display = 'none';
    }

    // 4. Ẩn nút Reset tẩy trắng dữ liệu
    var btnReset = document.getElementById('btn-factory-reset');
    if (btnReset) btnReset.style.display = 'none';
  }
}

  var elEmail = document.getElementById('wiz_user_email_badge');
  if (elEmail) elEmail.innerText = `Google: ${prefillData.currentEmail || 'Chủ tài khoản'}`;

  }
  if (prefillData.courtName && document.getElementById('wiz_tenToa')) {

  }
  if (prefillData.courtAddress && document.getElementById('wiz_diaChiToa')) {
    document.getElementById('wiz_diaChiToa').value = prefillData.courtAddress;
  }

  var modalEl = document.getElementById('modalOnboardingWizard');
  if (modalEl && typeof bootstrap !== 'undefined') {
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
  }
};

window.submitFirstTimeOnboardingWizard = function() {
  var tenTP = document.getElementById('wiz_tenTP') ? document.getElementById('wiz_tenTP').value.trim() : "";
  var tenToa = document.getElementById('wiz_tenToa') ? document.getElementById('wiz_tenToa').value.trim() : "";
  var diaChiToa = document.getElementById('wiz_diaChiToa') ? document.getElementById('wiz_diaChiToa').value.trim() : "";
  var geminiKey = document.getElementById('wiz_gemini_key') ? document.getElementById('wiz_gemini_key').value.trim() : "";

  if (!tenTP || !tenToa) {
    if (typeof AppUI !== 'undefined') AppUI.alert("Thiếu thông tin", "Vui lòng nhập Họ tên Thẩm phán và Tên đơn vị Tòa án!");
    else alert("Vui lòng nhập Họ tên Thẩm phán và Tên đơn vị Tòa án!");
    return;
  }

  var dsThuKy = [];
  var rows = document.querySelectorAll('#wiz_table_thuky_body tr');
  rows.forEach(function(r) {
    var xh = r.querySelector('.wiz-tk-xh') ? r.querySelector('.wiz-tk-xh').value : "Bà";
    var ten = r.querySelector('.wiz-tk-ten') ? r.querySelector('.wiz-tk-ten').value.trim() : "";
    var email = r.querySelector('.wiz-tk-email') ? r.querySelector('.wiz-tk-email').value.trim() : "";
    if (ten) {
      dsThuKy.push({
        xh: xh,
        ten: typeof window.toTitleCase === 'function' ? window.toTitleCase(typeof window.cleanHonorificFromName === 'function' ? window.cleanHonorificFromName(ten) : ten) : ten,
        email: email
      });
    }
  });

  var payload = {
    tenThamPhan: tenTP,
    tenToaAn: tenToa,
    diaChiToa: diaChiToa,
    chucVu: "Thẩm phán",
    dsThuKy: dsThuKy,
    geminiApiKey: geminiKey
  };

  var modalEl = document.getElementById('modalOnboardingWizard');
  if (modalEl && typeof bootstrap !== 'undefined') {
    var inst = bootstrap.Modal.getInstance(modalEl);
    if (inst) inst.hide();
  }

  if (typeof AppUI !== 'undefined') AppUI.showToast("Đang tạo cây thư mục Drive và nhân bản kho mẫu chuẩn...", "");

  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof AppUI !== 'undefined') AppUI.hideToast();
      if (res && res.success) {
        var msg = `✅ THIẾT LẬP THÀNH CÔNG DỰ ÁN CHO THẨM PHÁN: <b>${tenTP}</b>!<br><br>` +
                  `- Đã tự động tạo 4 thư mục tác nghiệp trên Google Drive.<br>` +
                  `- Đã sao chép <b>${res.folderInfo.copiedAn}</b> biểu mẫu Án & <b>${res.folderInfo.copiedDon}</b> biểu mẫu Đơn.<br>` +
                  `- Đã chia sẻ quyền chỉnh sửa Drive cho <b>${dsThuKy.length}</b> Thư ký.<br><br>` +
                  `Ứng dụng đã sẵn sàng tác nghiệp!`;
        if (typeof AppUI !== 'undefined') AppUI.alert("HOÀN TẤT THIẾT LẬP", msg);
        else alert("Thiết lập dự án thành công!");
        loadJudgeIdentity();
      } else {
        if (typeof AppUI !== 'undefined') AppUI.alert("Lỗi thiết lập", res ? res.error : "Không thể hoàn tất cài đặt.");
        else alert("Lỗi thiết lập: " + (res ? res.error : ""));
      }
    })
    .withFailureHandler(function(err) {
      if (typeof AppUI !== 'undefined') {
        AppUI.hideToast();
        AppUI.alert("Lỗi kết nối", err.message);
      } else {
        alert("Lỗi kết nối: " + err.message);
      }
    })
    .api_ExecuteFirstTimeSetup(payload);
};

function hideSplashScreen() {
  // KHÓA BẢO VỆ: Nếu chưa xác thực hoặc bị TỪ CHỐI thì tuyệt đối không được ẩn splash-screen
  if (window.CURRENT_USER_AUTH && window.CURRENT_USER_AUTH.role === 'UNAUTHORIZED') {
    return;
  }

  const splash = document.getElementById('splash-screen');
  if (splash && splash.style.display !== 'none') {
    splash.style.opacity = '0';
    setTimeout(function() { 
      if (!window.CURRENT_USER_AUTH || window.CURRENT_USER_AUTH.role !== 'UNAUTHORIZED') {
        splash.style.display = 'none'; 
      }
    }, 300);
  }
}

function parseVNDate(dateStr) {
  if (!dateStr) return null;
  var parts = String(dateStr).split('\n');
  var dStr = parts.length > 2 ? parts[2] : parts[0];
  dStr = dStr.trim();
  if (dStr.indexOf('/') !== -1) {
    var p = dStr.split('/');
    if (p.length === 3 && p[2] && p[2].length === 4) {
      return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10)).getTime();
    }
  }
  if (dStr.indexOf('-') !== -1) {
    var p2 = dStr.split('-');
    if (p2.length === 3 && p2[0].length === 4) {
      return new Date(parseInt(p2[0], 10), parseInt(p2[1], 10) - 1, parseInt(p2[2], 10)).getTime();
    }
  }
  return null;
}

function safeParseDateTS(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val.getTime();
  var s = String(val).trim();
  if (s.includes("/")) {
    var p = s.split(" ")[0].split("/");
    if (p.length === 3) {
      var d = new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
      return isNaN(d.getTime()) ? null : d.getTime();
    }
  }
  if (s.includes("-")) {
    var p2 = s.split(" ")[0].split("-");
    if (p2.length === 3 && p2[0].length === 4) {
      var d2 = new Date(parseInt(p2[0], 10), parseInt(p2[1], 10) - 1, parseInt(p2[2], 10));
      return isNaN(d2.getTime()) ? null : d2.getTime();
    }
  }
  var dDef = new Date(val);
  return isNaN(dDef.getTime()) ? null : dDef.getTime();
}

window.appNavigate = function(viewId) {

  if (window.CURRENT_USER_AUTH && window.CURRENT_USER_AUTH.role === 'UNAUTHORIZED') {
    return;
  }

  if (window.a4AutoSaveTimer) { clearTimeout(window.a4AutoSaveTimer); window.a4AutoSaveTimer = null; }

  if (window.donAutoSaveTimer) { clearTimeout(window.donAutoSaveTimer); window.donAutoSaveTimer = null; }

  window.forceCleanupModals();

  var sidebar = document.getElementById('main-sidebar');
  var overlay = document.getElementById('mobile-overlay');
  if (sidebar && sidebar.classList.contains('show')) {
    sidebar.classList.remove('show'); 
    if (overlay) overlay.style.display = 'none';
  }

  document.querySelectorAll('.spa-view').forEach(function(v) { 
    v.style.display = 'none'; 
    v.classList.remove('active'); 
  });
  
  var targetView = document.getElementById(viewId);

    targetView.style.display = 'block';
    targetView.classList.add('active');
  }

  document.querySelectorAll('.nav-menu-item').forEach(function(m) { m.classList.remove('active'); });
  var menuBtn = document.getElementById('menu-' + viewId);
  if (menuBtn) menuBtn.classList.add('active');

  var isDonDetail = (viewId === 'view-chi-tiet-don');
  var isAnDetail = (viewId === 'view-detail');

  var menuDonDetail = document.getElementById('menu-view-chi-tiet-don');
  var menuAnDetail = document.getElementById('menu-view-detail');

  if (isDonDetail) {
    if(menuDonDetail) menuDonDetail.style.display = 'flex';
    if(menuAnDetail) menuAnDetail.style.display = 'none';
  } else if (isAnDetail) {
    if(menuDonDetail) menuDonDetail.style.display = 'none'; 
    if(menuAnDetail) menuAnDetail.style.display = 'flex';
  } else {
    if(menuDonDetail) menuDonDetail.style.display = 'none';
    if(menuAnDetail) menuAnDetail.style.display = 'none';
  }

  if (viewId === 'view-list' || viewId === 'view-schedule' || viewId === 'view-stats' || viewId === 'view-hub') {
    window.CURRENT_APP_CONTEXT.scope = "GLOBAL";
    window.CURRENT_APP_CONTEXT.caseInfo = null;
    window.CURRENT_APP_CONTEXT.donInfo = null;
  }
  if (typeof window.updateCopilotScopeBadge === 'function') window.updateCopilotScopeBadge();

  var titles = {
    'view-hub': 'TRUNG TÂM HỢP NHẤT TỐ TỤNG (SMARTCASE HUB)',
    'view-danh-sach-don': 'SỔ NHẬN ĐƠN ĐIỆN TỬ',
    'view-chi-tiet-don': 'CHI TIẾT ĐƠN KHỞI KIỆN',
    'view-list': 'SỔ THỤ LÝ ĐIỆN TỬ',
    'view-detail': 'HỒ SƠ VỤ ÁN CHUYÊN SÂU',
    'view-schedule': 'LỊCH CÔNG TÁC',
    'view-stats': 'THỐNG KÊ DỮ LIỆU',
    'view-settings': 'THIẾT LẬP HỆ THỐNG'
  };
  var titleEl = document.getElementById('current-page-title');
  if (titleEl) {
    titleEl.innerText = titles[viewId] || "TRỢ LÝ 8.5";
  }

  // Điều hướng kích hoạt dữ liệu tương ứng 0ms từ RAM
  if (viewId === 'view-hub') {
    if (typeof window.loadHubData === 'function') window.loadHubData();
  }
  else if (viewId === 'view-danh-sach-don') {
    if (window.G_Don && window.G_Don.length > 0 && typeof window.runFilterDonEngine === 'function') window.runFilterDonEngine(); 
    else if (typeof window.loadDanhSachDon === 'function') window.loadDanhSachDon(true);
  }
  else if (viewId === 'view-list') {

  else if (viewId === 'view-schedule' && typeof window.loadSchedule === 'function') window.loadSchedule();
  else if (viewId === 'view-stats' && typeof window.loadStatsPage === 'function') window.loadStatsPage();
  else if (viewId === 'view-settings' && typeof window.loadSettingsData === 'function') window.loadSettingsData();
};

function checkIsHGDT(an) {
  if (an.isHGDT === true) return true;
  var la = window.removeAccents(String(an.loaiAn || "")).toLowerCase();
  var so = String(an.soTL || "").toLowerCase();
  return la.includes("hoa giai") || la.includes("doi thoai") || la.includes("hgdt") || so.includes("hgdt") || so.includes("hgđt");
}

function calculateLiveStatus(an) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  if (an.trangThai === "Tạm đình chỉ") {
    an.liveStatus = "Tạm đình chỉ";
    an.liveClass = "text-secondary";
    return;
  }

  var hasFinalResult = (an.ketQuaGiaiQuyet && 
                        String(an.ketQuaGiaiQuyet).trim() !== "" && 
                        an.ketQuaGiaiQuyet.indexOf("---") === -1 && 
                        an.ketQuaGiaiQuyet.indexOf("Tạm đình chỉ") === -1 && 
                        an.ketQuaGiaiQuyet.indexOf("Gia hạn") === -1 && 
                        an.ketQuaGiaiQuyet.indexOf("Tiếp tục giải quyết") === -1);
  
  if (an.trangThai === "Đã giải quyết" || hasFinalResult) {
    an.liveStatus = "Đã giải quyết";
    an.liveClass = "text-success";
    return;
  }

  if (an.rawHanDate > 0) {
    var diffDays = Math.ceil((an.rawHanDate - today.getTime()) / 86400000);
    if (diffDays < 0) { 
      an.liveStatus = "Đã quá hạn"; 
      an.liveClass = "text-danger fw-bold"; 
    } else if (diffDays <= 15) { 
      an.liveStatus = "Sắp quá hạn"; 
      an.liveClass = "text-warning fw-bold"; 
    } else { 
      an.liveStatus = "Đang giải quyết"; 
      an.liveClass = "text-primary"; 
    }
  } else {
    an.liveStatus = "Đang giải quyết";
    an.liveClass = "text-primary";
  }
}

function getCaseTbodyElement() {
  return document.getElementById('list-data') || 
         document.getElementById('case-list-data') || 
         document.getElementById('table-body') || 
         document.querySelector('#view-list tbody');
}

window.loadCaseList = function(isForceRefresh) {
  if (window.G_An && window.G_An.length > 0 && !isForceRefresh) { window.runFilterEngine(); return; }
  
  var tbody = getCaseTbodyElement();
  if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center p-5"><div class="spinner-grow text-primary me-2"></div><span class="text-muted fw-bold">Đang tải Dữ liệu Sổ thụ lý...</span></td></tr>';

  setTimeout(hideSplashScreen, 4000);

  google.script.run
    .withSuccessHandler(function(data) {
      hideSplashScreen();
      if (data && data.error) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center p-5 text-danger">' + data.error + '</td></tr>';
        return;
      }
      window.G_An = data || [];
      for (var i = 0; i < window.G_An.length; i++) calculateLiveStatus(window.G_An[i]);
      
      window.requestAnimationFrame(function() {
        window.runFilterEngine();
        // Tự động đẩy số liệu sang Hub ngay khi RAM Sổ thụ lý đã sẵn sàng
        if (typeof window.loadHubData === 'function') {
          window.loadHubData();
        }
      });
    })
    .withFailureHandler(function(err) {
      hideSplashScreen();
      if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center p-5 text-danger">Lỗi kết nối Server: ' + err.message + '</td></tr>';
    })
    .api_LayDanhSachAn();
};

window.runFilterEngine = function() {
  if (!window.G_An || window.G_An.length === 0) { 
    window.G_FilteredCases = [];
    renderCaseTable([]); 
    return; 
  }
  
  var startInput = document.getElementById('filter-start');
  var endInput = document.getElementById('filter-end');
  var filterStart = startInput ? startInput.value : (window.G_Filter.start || getStatisticalStartDate());
  var filterEnd = endInput ? endInput.value : window.G_Filter.end;

  var searchInput = document.getElementById('txtSearchMain') || document.getElementById('txtSearch');
  var filterKw = searchInput ? searchInput.value : window.G_Filter.keyword;
  window.G_Filter.keyword = filterKw;
  var q = filterKw ? window.removeAccents(String(filterKw).toLowerCase().trim()) : "";

  var loaiAnSelect = document.getElementById('filter-loaiAn');
  var currentCat = normalizeCategoryCode(window.G_Filter.category);
  var filterLoaiAn = (loaiAnSelect && loaiAnSelect.value && loaiAnSelect.value !== "ALL" && loaiAnSelect.value !== "-- Tất cả loại án --") ? loaiAnSelect.value : window.G_Filter.loaiAn;
  
  var ketQuaSelect = document.getElementById('filter-ketQua');
  var filterKetQua = ketQuaSelect ? ketQuaSelect.value : (window.G_Filter.ketQua || "ALL");
  window.G_Filter.ketQua = filterKetQua;

  if (filterLoaiAn === 'HGĐT' || String(filterLoaiAn).toLowerCase().includes('hòa giải')) {
    currentCat = 'HGDT';
  }

  var sTime = safeParseDateTS(filterStart) || 0;
  var eTime = window.G_Filter.end ? (safeParseDateTS(window.G_Filter.end) + 86399999) : Infinity;
  var isPeriodFilter = Boolean(window.G_Filter.start || window.G_Filter.end);

  var cuChuyenSang = 0, thuLyMoi = 0;
  var cFinishedTotal = 0;
  var cFinishedFiltered = 0;
  var cPending = 0, cTDC = 0, cUrgent = 0, cOverdue = 0;
  var cHGDT_Total = 0, cHGDT_Success = 0;
  var urgentCasesList = [], displayList = [];

  var KET_QUA_TITLES = {
    "BAN_AN": "BẢN ÁN",
    "THOA_THUAN": "THỎA THUẬN",
    "THUAN_TINH": "THUẬN TÌNH LH",
    "DINH_CHI": "ĐÌNH CHỈ",
    "TRA_HO_SO": "TRẢ HS ĐTBS",
    "VIEC_DAN_SU": "VIỆC DÂN SỰ",
    "CHUYEN_DI": "CHUYỂN ĐI",
    "NHAP_VU": "NHẬP VỤ ÁN"
  };

  for (var j = 0; j < window.G_An.length; j++) {
    var an = window.G_An[j];
    var isHGDT = checkIsHGDT(an);

    var kqRaw = String(an.ketQuaGiaiQuyet || "").trim();
    var kqLower = window.removeAccents(kqRaw).toLowerCase();

    var hasFinalResult = (kqRaw !== "" && 
                          kqRaw.indexOf("---") === -1 && 
                          kqLower.indexOf("tam dinh chi") === -1 && 
                          kqLower.indexOf("gia han") === -1 && 
                          kqLower.indexOf("tiep tuc") === -1);

    var isDone = (an.trangThai === "Đã giải quyết" || hasFinalResult);
    var kqDateTS = isDone ? parseVNDate(an.ketQuaGiaiQuyet) : null;
    var acceptedTime = an.rawDate || 0;

    var isInPeriod = true;
    if (isPeriodFilter) {
      if (acceptedTime > eTime) isInPeriod = false; 
      if (isDone && kqDateTS && kqDateTS < sTime) isInPeriod = false; 
    }

    if (!isInPeriod) continue;

    if (isHGDT) {
      cHGDT_Total++;
      if (isDone) cHGDT_Success++;
    } else {
      if (acceptedTime < sTime) cuChuyenSang++; 
      else thuLyMoi++;
      
      if (isDone) {
        cFinishedTotal++;

        var isMatchFilteredResult = false;
        if (filterKetQua === "ALL") {
          isMatchFilteredResult = true;
        } else if (filterKetQua === "BAN_AN") {
          isMatchFilteredResult = kqLower.includes("ban an") || kqLower.includes("xet xu") || kqLower.includes("tuyen an");
        } else if (filterKetQua === "THOA_THUAN") {
          isMatchFilteredResult = (kqLower.includes("thoa thuan") || kqLower.includes("qdcntt") || kqLower.includes("qđcntt") || kqLower.includes("hoa giai thanh")) && !kqLower.includes("thuan tinh");
        } else if (filterKetQua === "THUAN_TINH") {
          isMatchFilteredResult = kqLower.includes("thuan tinh") || kqLower.includes("ttlh") || kqLower.includes("qdcnttlh") || kqLower.includes("qđcnttlh");
        } else if (filterKetQua === "DINH_CHI") {
          isMatchFilteredResult = kqLower.includes("dinh chi") && !kqLower.includes("tam dinh chi");
        } else if (filterKetQua === "TRA_HO_SO") {
          isMatchFilteredResult = kqLower.includes("tra ho so") || kqLower.includes("dieu tra bo sung") || kqLower.includes("dtbs");
        } else if (filterKetQua === "VIEC_DAN_SU") {
          isMatchFilteredResult = kqLower.includes("giai quyet viec") || kqLower.includes("viec dan su") || kqLower.includes("vds") || kqLower.includes("qdgq-vds");
        } else if (filterKetQua === "CHUYEN_DI") {
          isMatchFilteredResult = kqLower.includes("chuyen ho so") || kqLower.includes("chuyen vu an") || kqLower.includes("chuyen di");
        } else if (filterKetQua === "NHAP_VU") {
          isMatchFilteredResult = kqLower.includes("nhap vu an") || kqLower.includes("nhap vu viec") || kqLower.includes("nhap vu");
        }

        if (isMatchFilteredResult) {
          cFinishedFiltered++;
        }
      } else {
        cPending++;
        if (an.liveStatus === "Tạm đình chỉ" || an.trangThai === "Tạm đình chỉ") {
          cTDC++;
        } else if (an.liveStatus === "Sắp quá hạn") { 
          cUrgent++; 
          urgentCasesList.push(an); 
        } else if (an.liveStatus === "Đã quá hạn") { 
          cOverdue++; 
          urgentCasesList.push(an); 
        }
      }
    }

    if (filterLoaiAn && filterLoaiAn !== "ALL") {
      if (filterLoaiAn === 'HGĐT' || filterLoaiAn === '8. Hòa giải đối thoại') {
        if (!isHGDT) continue;
      } else {
        var fLower = window.removeAccents(String(filterLoaiAn)).toLowerCase();
        if (window.removeAccents(String(an.loaiAn || "")).toLowerCase().indexOf(fLower) === -1) continue;
      }
    }

    if (filterKetQua && filterKetQua !== "ALL") {
      var matchKq = false;
      if (filterKetQua === "BAN_AN") matchKq = kqLower.includes("ban an") || kqLower.includes("xet xu") || kqLower.includes("tuyen an");
      else if (filterKetQua === "THOA_THUAN") matchKq = (kqLower.includes("thoa thuan") || kqLower.includes("qdcntt") || kqLower.includes("qđcntt") || kqLower.includes("hoa giai thanh")) && !kqLower.includes("thuan tinh");
      else if (filterKetQua === "THUAN_TINH") matchKq = kqLower.includes("thuan tinh") || kqLower.includes("ttlh") || kqLower.includes("qdcnttlh") || kqLower.includes("qđcnttlh");
      else if (filterKetQua === "DINH_CHI") matchKq = kqLower.includes("dinh chi") && !kqLower.includes("tam dinh chi");
      else if (filterKetQua === "TRA_HO_SO") matchKq = kqLower.includes("tra ho so") || kqLower.includes("dieu tra bo sung") || kqLower.includes("dtbs");
      else if (filterKetQua === "VIEC_DAN_SU") matchKq = kqLower.includes("giai quyet viec") || kqLower.includes("viec dan su") || kqLower.includes("vds") || kqLower.includes("qdgq-vds");
      else if (filterKetQua === "CHUYEN_DI") matchKq = kqLower.includes("chuyen ho so") || kqLower.includes("chuyen vu an") || kqLower.includes("chuyen di");
      else if (filterKetQua === "NHAP_VU") matchKq = kqLower.includes("nhap vu an") || kqLower.includes("nhap vu viec") || kqLower.includes("nhap vu");
      
      if (!matchKq) continue;
    }

    var passCat = false;
    if (currentCat === 'HGDT') {
      if (isHGDT) passCat = true;
    } else {
      if (!isHGDT) {
        if (currentCat === 'ALL') passCat = true;
        else if (currentCat === 'ACTIVE' && !isDone && an.liveStatus !== "Tạm đình chỉ") passCat = true;
        else if (currentCat === 'FINISHED' && isDone) passCat = true;
        else if (currentCat === 'FROZEN' && (an.liveStatus === "Tạm đình chỉ" || an.trangThai === "Tạm đình chỉ")) passCat = true;
        else if (currentCat === 'URGENT' && an.liveStatus === "Sắp quá hạn") passCat = true;
        else if (currentCat === 'OVERDUE' && an.liveStatus === "Đã quá hạn") passCat = true;
      }
    }

    if (passCat && q !== "") {
      var sTL = window.removeAccents(String(an.soTL || "").toLowerCase());
      var sND = window.removeAccents(String(an.nguyenDon || "").toLowerCase());
      var sBD = window.removeAccents(String(an.biDon || "").toLowerCase());
      var sQH = window.removeAccents(String(an.quanHe || "").toLowerCase());
      var sGC = window.removeAccents(String(an.ghiChu || "").toLowerCase());
      
      if (sTL.indexOf(q) === -1 && sND.indexOf(q) === -1 && sBD.indexOf(q) === -1 && sQH.indexOf(q) === -1 && sGC.indexOf(q) === -1) {
        passCat = false;
      }
    }

    if (passCat) displayList.push(an);
  }

  function safeSetText(id, text) { let el = document.getElementById(id); if (el) el.innerText = text; }

  var totalAn = cuChuyenSang + thuLyMoi;
  safeSetText('stat-total', totalAn);
  safeSetText('stat-sub-total', "Mới: " + thuLyMoi + " | Cũ: " + cuChuyenSang);
  safeSetText('stat-active', cPending);
  safeSetText('stat-urgent', cUrgent);
  safeSetText('stat-overdue', cOverdue);
  safeSetText('stat-frozen', cTDC);
  safeSetText('stat-hgdt-total', cHGDT_Total);
  safeSetText('stat-hgdt-success', cHGDT_Success);

  var finishedTitleEl = document.getElementById('stat-finished-title');
  var rateLabelEl = document.getElementById('stat-rate-label');

  if (filterKetQua === "ALL") {
    if (finishedTitleEl) finishedTitleEl.innerText = "ĐÃ HOÀN THÀNH";
    safeSetText('stat-finished', cFinishedTotal);
    
    var tyLeChung = (totalAn > 0) ? Math.round((cFinishedTotal / totalAn) * 100) : 0;
    if (rateLabelEl) rateLabelEl.innerText = "Tỷ lệ:";
    safeSetText('stat-rate-text', tyLeChung + "%");
  } else {
    var shortTitle = KET_QUA_TITLES[filterKetQua] || "KẾT QUẢ";
    if (finishedTitleEl) finishedTitleEl.innerText = "ĐÃ XONG (" + shortTitle + ")";
    safeSetText('stat-finished', cFinishedFiltered);
    
    var pctOnResolved = (cFinishedTotal > 0) ? ((cFinishedFiltered / cFinishedTotal) * 100).toFixed(1) : "0.0";
    if (rateLabelEl) rateLabelEl.innerText = "% / Đã xong:";
    safeSetText('stat-rate-text', pctOnResolved + "%");
  }

  window.G_FilteredCases = displayList;

  initNotificationSystem(urgentCasesList);
  window.requestAnimationFrame(function() { renderCaseTable(displayList); });
};

// =========================================================================
// 10. TRỢ LÝ NHẮC VIỆC (3 NGÀY & BACKLOG 7 NGÀY)
// =========================================================================

function initNotificationSystem(urgentCasesList) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  var yest = new Date(today);
  yest.setDate(yest.getDate() - 1);

  var tomo = new Date(today);
  tomo.setDate(tomo.getDate() + 1);

  var sevenDaysAgo = new Date(today);
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  var sevenDaysAgoMid = sevenDaysAgo.getTime();

  var strYest = formatDateToYMD(yest);
  var strToday = formatDateToYMD(today);
  var strTomo = formatDateToYMD(tomo);
  var todayMid = today.getTime();

  dailyRemindersList = [];
  backlogRemindersList = [];

  if (window.G_LichTrinh && Array.isArray(window.G_LichTrinh)) {
    window.G_LichTrinh.forEach(function(ev) {
      if (ev.trangThai === "Hoàn thành") return;
      
      var evDateISO = "";
      if (ev.start) {
        evDateISO = ev.start.includes("T") ? ev.start.split("T")[0] : ev.start.split(" ")[0];
      }
      if (!evDateISO) return;

      var dParts = evDateISO.split("-");
      var evDateObj = new Date(parseInt(dParts[0], 10), parseInt(dParts[1], 10) - 1, parseInt(dParts[2], 10));
      var evTimeMid = evDateObj.getTime();
      var tLow = (ev.title || "").toLowerCase();

      var actionTitle = ev.title;
      var actionType = "OPEN_SCHEDULE";
      var suggestedTpls = [];

      if (tLow.includes("nhắc") || tLow.includes("hạn 7") || tLow.includes("thỏa thuận") || tLow.includes("thuận tình") || tLow.includes("ngày thứ 8")) {
        actionTitle = "Ra QĐ công nhận thỏa thuận / Thuận tình LH";
        actionType = "DRAFT_CNTT";
        suggestedTpls = ["25.", "45.", "công nhận sự thỏa thuận", "thuận tình ly hôn"];
      } else if (tLow.includes("15 ngày") || tLow.includes("hgđt") || tLow.includes("đối thoại thành") || tLow.includes("ngày thứ 16")) {
        actionTitle = "Ra QĐ công nhận kết quả HGĐT";
        actionType = "DRAFT_HGDT";
        suggestedTpls = ["62.", "kết quả hòa giải đối thoại"];
      } else if (tLow.includes("chứng cứ") || tLow.includes("cung cấp")) {
        actionTitle = "Giao nhận & thu thập tài liệu chứng cứ";
        actionType = "DRAFT_BIEN_BAN_HG";
        suggestedTpls = ["04.", "09.", "giao nhận tài liệu"];
      } else if (tLow.includes("hòa giải")) {
        actionTitle = "Mở phiên họp kiểm tra CC & Hòa giải";
        actionType = "DRAFT_BIEN_BAN_HG";
        suggestedTpls = ["18.", "19.", "21."];
      } else if (tLow.includes("đối thoại")) {
        actionTitle = "Mở phiên đối thoại (Luật HGĐT)";
        actionType = "DRAFT_BIEN_BAN_HG";
        suggestedTpls = ["54.", "55.", "56."];
      } else if (tLow.includes("xét xử") || tLow.includes("phiên tòa")) {
        actionTitle = "Mở phiên tòa xét xử sơ thẩm";
        actionType = "DRAFT_XET_XU";
        suggestedTpls = ["31.", "04."];
      } else if (tLow.includes("thẩm định") || tLow.includes("định giá") || tLow.includes("đo vẽ")) {
        actionTitle = "Xem xét thẩm định tại chỗ / Định giá";
        actionType = "DRAFT_XET_XU";
        suggestedTpls = ["13.", "14.", "16."];
      }

      var itemObj = {
        actionTitle: actionTitle,
        caseNo: ev.soTL ? "[" + ev.soTL + "]" : "",
        quanHe: ev.quanHe || "",
        partyText: ev.duongSuText || "Lịch làm việc",
        actionType: actionType,
        idVuAn: ev.idVuAn,
        dateISO: evDateISO,
        rawEvent: ev,
        suggestedTpls: suggestedTpls
      };

      if (evDateISO === strToday) {
        itemObj.priority = 2;
        itemObj.timeLabel = "H.Nay";
        itemObj.timeBadgeClass = "bg-primary text-white";
        dailyRemindersList.push(itemObj);
      } else if (evDateISO === strYest) {
        itemObj.priority = 1;
        itemObj.timeLabel = "H.Qua";
        itemObj.timeBadgeClass = "bg-danger text-white";
        dailyRemindersList.push(itemObj);
      } else if (evDateISO === strTomo) {
        itemObj.priority = 3;
        itemObj.timeLabel = "N.Mai";
        itemObj.timeBadgeClass = "bg-warning text-dark";
        dailyRemindersList.push(itemObj);
      } else if (evTimeMid >= sevenDaysAgoMid && evTimeMid < todayMid) {
        itemObj.priority = 0;
        itemObj.timeLabel = evDateISO.slice(5);
        itemObj.timeBadgeClass = "bg-danger text-white";
        backlogRemindersList.push(itemObj);
      }
    });
  }

  (window.G_An || []).forEach(function(an) {
    if (an.liveStatus === "Đã giải quyết" || an.liveStatus === "Tạm đình chỉ") return;
    if (!an.rawHanDate) return;

    var hanDate = new Date(an.rawHanDate);
    hanDate.setHours(0, 0, 0, 0);
    var diffDays = Math.ceil((hanDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));

    if (diffDays >= 0 && diffDays <= 15) {
      dailyRemindersList.push({
        priority: 2,
        timeLabel: diffDays + "N",
        timeBadgeClass: "bg-warning text-dark",
        actionTitle: "Soạn QĐ Gia hạn chuẩn bị xét xử",
        caseNo: "[" + an.soTL + "]",
        quanHe: an.quanHe || "",
        partyText: (an.nguyenDon || '') + " v. " + (an.biDon || ''),
        actionType: "DRAFT_GIA_HAN",
        idVuAn: an.id,
        rawCase: an,
        suggestedTpls: ["26.", "gia hạn thời hạn", "chuẩn bị xét xử"]
      });
    } else if (diffDays < 0 && Math.abs(diffDays) <= 30) {
      backlogRemindersList.push({
        priority: 0,
        timeLabel: "Quá " + Math.abs(diffDays) + "N",
        timeBadgeClass: "bg-danger text-white",
        actionTitle: "Án đã quá hạn - Cần giải quyết gấp",
        caseNo: "[" + an.soTL + "]",
        quanHe: an.quanHe || "",
        partyText: (an.nguyenDon || '') + " v. " + (an.biDon || ''),
        actionType: "OPEN_CASE",
        idVuAn: an.id,
        rawCase: an,
        suggestedTpls: []
      });
    }
  });

  dailyRemindersList.sort(function(a, b) { return a.priority - b.priority; });
  currentReminderIdx = 0;
  renderReminderCard();
}

function renderReminderCard() {
  var hubEl = document.getElementById('notification-hub');
  if (!hubEl) return;

  hubEl.className = "stat-box";
  hubEl.style.cssText = "background: #ffffff !important; border: 1px solid #e2e8f0 !important; border-radius: 12px; padding: 8px 10px; height: 100px; max-height: 100px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 3px rgba(15,23,42,0.06); cursor: pointer;";

  var totalItems = dailyRemindersList.length;
  var backlogCount = backlogRemindersList.length;

  var backlogBtnHtml = backlogCount > 0 
    ? '<button type="button" class="btn btn-sm btn-danger p-0 d-inline-flex align-items-center justify-content-center shadow-sm" style="height: 18px; min-width: 22px; font-size: 9.5px; font-weight: 800; border-radius: 10px; padding: 0 5px;" onclick="event.stopPropagation(); window.openBacklogModal();" title="' + backlogCount + ' việc chưa làm trong 7 ngày qua">' + backlogCount + '</button>'
    : '<span class="text-muted" style="font-size: 11px;"><i class="far fa-bell"></i></span>';

  if (totalItems === 0) {
    hubEl.onclick = null;
    hubEl.innerHTML = 
      '<div class="d-flex align-items-center justify-content-between w-100" style="height: 20px;">' +
        backlogBtnHtml +
        '<span class="badge bg-light text-secondary border" style="font-size: 9px;">Hôm nay</span>' +
      '</div>' +
      '<div class="text-center text-success fw-bold py-2" style="font-size: 11.5px;">' +
        '<i class="fas fa-check-circle me-1"></i> 3 ngày tới không có lịch gấp!' +
      '</div>' +
      '<div class="text-muted text-end" style="font-size: 9.5px;">Hệ thống ổn định</div>';
    return;
  }

  if (currentReminderIdx >= totalItems) currentReminderIdx = 0;
  if (currentReminderIdx < 0) currentReminderIdx = totalItems - 1;

  var item = dailyRemindersList[currentReminderIdx];

  hubEl.onclick = function() {
    window.executeCurrentReminderAction();
  };

  hubEl.innerHTML = 
    '<div class="d-flex align-items-center justify-content-between w-100" style="height: 20px;" onclick="event.stopPropagation();">' +
      '<div class="d-flex align-items-center gap-1">' +
        backlogBtnHtml +
        '<span class="badge ' + item.timeBadgeClass + '" style="font-size: 9px; font-weight: 700; padding: 2px 5px;">' + item.timeLabel + '</span>' +
      '</div>' +
      '<div class="d-flex align-items-center gap-1">' +
        '<button type="button" class="btn btn-sm btn-light border p-0 d-flex align-items-center justify-content-center" style="width: 18px; height: 18px; font-size: 8px; border-radius: 3px;" onclick="window.prevReminderItem()">◀</button>' +
        '<span class="text-muted fw-bold" style="font-size: 9px; min-width: 22px; text-align: center;">' + (currentReminderIdx + 1) + '/' + totalItems + '</span>' +
        '<button type="button" class="btn btn-sm btn-light border p-0 d-flex align-items-center justify-content-center" style="width: 18px; height: 18px; font-size: 8px; border-radius: 3px;" onclick="window.nextReminderItem()">▶</button>' +
      '</div>' +
    '</div>' +
    '<div class="w-100 text-start mt-1" style="overflow: hidden;">' +
      '<div class="fw-bold text-primary text-truncate" style="font-size: 12px; line-height: 1.3;" title="' + item.actionTitle + '">' +
        '<i class="fas fa-bolt text-warning me-1"></i>' + item.actionTitle +
      '</div>' +
    '</div>' +
    '<div class="w-100 text-start border-top pt-1 text-truncate" style="height: 20px; font-size: 10px; line-height: 1.2;" title="' + item.caseNo + ' ' + item.quanHe + ' - ' + item.partyText + '">' +
      '<b class="text-dark">' + item.caseNo + '</b> <span class="text-muted">' + item.quanHe + '</span> <span class="text-secondary">(' + item.partyText + ')</span>' +
    '</div>';
}

window.prevReminderItem = function() {
  if (dailyRemindersList.length <= 1) return;
  currentReminderIdx--;
  renderReminderCard();
};

window.nextReminderItem = function() {
  if (dailyRemindersList.length <= 1) return;
  currentReminderIdx++;
  renderReminderCard();
};

window.executeCurrentReminderAction = function(passedItem) {
  var item = passedItem || (dailyRemindersList.length > 0 ? dailyRemindersList[currentReminderIdx] : null);
  if (!item) {
    AppUI.showToast("Không có công việc nào cần xử lý!", "info");
    return;
  }

  if (item.actionType === "DRAFT_GIA_HAN" && item.idVuAn) {
    if (typeof window.openDraftingModal === 'function') {
      window.openDraftingModal(item.idVuAn, {
        autoSelectKeywordsArray: ["26. quyết định gia hạn", "gia hạn thời hạn", "chuẩn bị xét xử"],
        noiDungThem: "Gia hạn thời hạn chuẩn bị xét xử vụ án"
      });
    }
    return;
  }

  if (item.actionType === "DRAFT_CNTT" && item.idVuAn) {
    if (typeof window.openDraftingModal === 'function') {
      window.openDraftingModal(item.idVuAn, {
        autoSelectKeywordsArray: ["25.", "45.", "công nhận sự thỏa thuận", "thuận tình ly hôn"],
        noiDungThem: "Ra Quyết định công nhận sự thỏa thuận của các đương sự"
      });
    }
    return;
  }

  if (item.actionType === "DRAFT_HGDT" && item.idVuAn) {
    if (typeof window.openDraftingModal === 'function') {
      window.openDraftingModal(item.idVuAn, {
        autoSelectKeywordsArray: ["62.", "kết quả hòa giải đối thoại"],
        noiDungThem: "Ra Quyết định công nhận kết quả hòa giải thành tại Tòa án"
      });
    }
    return;
  }

  if (item.idVuAn && item.idVuAn !== "GENERAL") {
    var ev = item.rawEvent;
    if (typeof window.openDraftingModal === 'function') {
      window.openDraftingModal(item.idVuAn, {
        trieuTapDate: ev && ev.start ? ev.start.split('T')[0] : "",
        trieuTapTime: ev && ev.start && ev.start.includes("T") ? ev.start.split("T")[1].substring(0, 5) : "08:00",

        autoSelectKeywordsArray: item.suggestedTpls

    return;

window.loadBacklogItems = function() {
  var listContainer = document.getElementById('backlog_items_container');
  var countHeader = document.getElementById('backlog_modal_count');
  if (countHeader) countHeader.innerText = backlogRemindersList.length;

  if (!listContainer) return;

  if (backlogRemindersList.length === 0) {
    listContainer.innerHTML = 
      '<div class="text-center p-4 text-muted small">' +
        '<i class="fas fa-check-circle fa-2x text-success mb-2 d-block"></i>' +
        'Tuyệt vời! Không có công việc nào bị tồn đọng.' +
      '</div>';
  } else {
    var html = "";
    backlogRemindersList.forEach(function(item, idx) {
      var isEvent = item.rawEvent && (item.rawEvent.idLich || item.rawEvent.id);
      var idLichVal = isEvent ? (item.rawEvent.idLich || item.rawEvent.id) : "";

      var btnDoneHtml = isEvent 
        ? '<button type="button" class="btn btn-sm btn-outline-success fw-bold px-2 py-1 flex-shrink-0" style="font-size: 11px; border-radius: 8px;" onclick="window.markBacklogItemDone(\'' + idLichVal + '\', ' + idx + ')" title="Đánh dấu việc này đã làm xong"><i class="fas fa-check me-1"></i> Đã xong</button>'
        : "";

      html += 
        '<div class="d-flex align-items-center justify-content-between p-2 mb-2 bg-white border rounded-3 animate-fadeIn shadow-sm" id="backlog-row-' + idx + '">' +
          '<div class="overflow-hidden me-2">' +
            '<div class="d-flex align-items-center gap-1 mb-1">' +
              '<span class="badge bg-danger text-white" style="font-size: 9px;">' + item.timeLabel + '</span>' +
              '<b class="text-primary text-truncate small">' + item.actionTitle + '</b>' +
            '</div>' +
            '<div class="text-dark fw-semibold text-truncate" style="font-size: 11px;">' +
              item.caseNo + ' ' + item.quanHe + ' - <span class="text-muted">' + item.partyText + '</span>' +

            '</button>' +
          '</div>' +
        '</div>';
    });

  }
};

window.markBacklogItemDone = function(idLich, idx) {
  if (!idLich) return;

  var rowEl = document.getElementById('backlog-row-' + idx);
  if (rowEl) {
    rowEl.style.transition = 'all 0.25s ease';
    rowEl.style.opacity = '0';
    rowEl.style.transform = 'translateX(20px)';
    setTimeout(function() {
      if (rowEl) rowEl.remove();

      backlogRemindersList = backlogRemindersList.filter(function(it) {
        var itId = it.rawEvent ? (it.rawEvent.idLich || it.rawEvent.id) : "";
        return itId !== idLich;
      });

      var countHeader = document.getElementById('backlog_modal_count');
      if (countHeader) countHeader.innerText = backlogRemindersList.length;

      if (typeof renderReminderCard === 'function') renderReminderCard();

      if (backlogRemindersList.length === 0) {
        window.loadBacklogItems();
      }
    }, 250);
  }

  if (window.G_LichTrinh && Array.isArray(window.G_LichTrinh)) {
    var ev = window.G_LichTrinh.find(function(l) { return (l.idLich === idLich || l.id === idLich); });
    if (ev) ev.trangThai = "Hoàn thành";
  }

  AppUI.showToast("Đã đánh dấu hoàn thành công việc!", "success");

  google.script.run
    .withSuccessHandler(function() {
      if (typeof window.loadSchedule === 'function' && document.getElementById('view-schedule') && document.getElementById('view-schedule').style.display === 'block') {
        window.loadSchedule();
      }
    })
    .withFailureHandler(function(err) {
      console.warn("Lỗi lưu trạng thái hoàn thành:", err);
    })
    .api_CapNhatTrangThaiLich(idLich, "Hoàn thành");
};

};

function renderCaseTable(data) {
  var tbody = getCaseTbodyElement();

    tbody.innerHTML = '<tr><td colspan="6" class="text-center p-5 text-muted small"><i class="fas fa-box-open fa-2x mb-2 opacity-50 d-block"></i>Không tìm thấy hồ sơ phù hợp.</td></tr>';
    return;
  }

  var htmlRows = [];
  var limit = Math.min(data.length, 120);

  for (var i = 0; i < limit; i++) {
    try {
      var an = data[i];
      var isHGDT = checkIsHGDT(an);
      var borderLeft = '#1a73e8';
      if (isHGDT) borderLeft = '#6f42c1';
      else if (an.liveStatus === "Đã giải quyết") borderLeft = '#10b981';
      else if (an.liveStatus === "Đã quá hạn") borderLeft = '#ef4444';
      else if (an.liveStatus === "Sắp quá hạn") borderLeft = '#f59e0b';
      else if (an.liveStatus === "Tạm đình chỉ") borderLeft = '#64748b';

      var statusContent = "";

        var resLines = String(an.ketQuaGiaiQuyet || "").split('\n');
        var loaiKqVietTat = window.standardizeResolutionAbbr(resLines[0] || 'Đã giải quyết');

          '<div class="text-muted" style="font-size:10.5px;">Ngày: ' + (resLines[2] || '---') + '</div>';
      } else {
        statusContent = 
          '<div class="badge bg-light border ' + an.liveClass + '" style="font-size: 10px; padding: 3px 6px; border-radius: 4px;">' +
            an.liveStatus +
          '</div>' +
          '<div class="text-muted mt-1" style="font-size:11px">' +
            '<i class="' + (an.liveStatus === 'Tạm đình chỉ' ? 'fas fa-pause-circle' : 'far fa-calendar-alt') + ' me-1"></i>' +

          '<td>' +
            '<div class="fw-bold text-danger text-truncate" style="font-size: 12px; max-width: 230px;" title="' + ndName + '">' +
              '<i class="fas fa-user text-danger me-1" style="font-size: 9.5px;"></i>' + ndName +

              '<button class="btn btn-sm btn-light border shadow-sm text-primary" onclick="event.stopPropagation(); if(typeof window.openDraftingModal === \'function\') window.openDraftingModal(\'' + an.id + '\')" title="Soạn văn bản" style="width: 28px; height: 28px; border-radius: 6px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-file-word" style="font-size:11px;"></i></button>' +
              '<button class="btn btn-sm btn-light border shadow-sm text-warning" onclick="event.stopPropagation(); if(typeof window.openTaskModal === \'function\') window.openTaskModal(\'' + an.id + '\', \'' + String(an.soTL || '').replace(/'/g, "\\'") + '\')" title="Lên lịch" style="width: 28px; height: 28px; border-radius: 6px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-calendar-plus" style="font-size:11px;"></i></button>' +
              '<button class="btn btn-sm btn-light border shadow-sm text-secondary" onclick="event.stopPropagation(); if(typeof window.openEditCaseModal === \'function\') window.openEditCaseModal(\'' + an.id + '\')" title="Sửa" style="width: 28px; height: 28px; border-radius: 6px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-edit" style="font-size:11px;"></i></button>' +
            '</div>' +
          '</td>' +
        '</tr>'
      );
    } catch (eRow) {}
  }
  
  tbody.innerHTML = htmlRows.join('');
  const selectAllCb = document.getElementById('select-all-checkbox');
  if (selectAllCb) selectAllCb.checked = false;
}

window.updateSystemTag = function(idVuAn, type) {
  var title = type === 'QLTA' ? "Xác nhận phần mềm QLTA" : "Xác nhận Công bố Bản án";
  var msg = type === 'QLTA' ? "Đánh dấu hồ sơ này đã được nhập lên phần mềm QLTA?" : "Đánh dấu hồ sơ này đã được Công bố lên Cổng TTĐT?";
  
  AppUI.confirm(title, msg, 'primary', function() {
    AppUI.showToast("Đang cập nhật...", "");
    google.script.run
      .withSuccessHandler(function(res){
        if (res.success) {
          var an = window.G_An.find(function(x) { return x.id === idVuAn; });
          if (an) {
            if (type === 'QLTA') an.qltaStatus = 'Xong';
            if (type === 'CONGBO') an.congBoStatus = 'Đã đăng';
            window.runFilterEngine();
          }
          AppUI.showToast("Đã cập nhật trạng thái thành công!", "success");
        } else { AppUI.showToast("Lỗi: " + res.error, "error"); }
      })
      .withFailureHandler(function(err) { AppUI.showToast("Lỗi mạng: " + err.message, "error"); })
      .api_UpdateSystemStatus(idVuAn, type);
  });
};

function buildExcelExportFileName() {
  var parts = ["So_thu_ly"];
  var f = window.G_Filter || {};

  var catMap = {
    "ALL": "Tat_ca",
    "ACTIVE": "Dang_giai_quyet",
    "FINISHED": "Da_hoan_thanh",
    "URGENT": "Sap_het_han",
    "OVERDUE": "Qua_han",
    "FROZEN": "Tam_dinh_chi",
    "HGDT": "Hoa_giai_doi_thoai"
  };
  var catName = catMap[f.category] || f.category;
  if (catName && catName !== "Tat_ca") parts.push(catName);

  if (f.loaiAn && f.loaiAn !== "ALL" && f.loaiAn !== "-- Tất cả loại án --") {
    var loaiClean = window.removeAccents(f.loaiAn).replace(/^\d+\.\s*/, '').replace(/[^a-zA-Z0-9]/g, '_');
    parts.push(loaiClean);
  }

  if (f.ketQua && f.ketQua !== "ALL") {
    var kqMap = {
      "BAN_AN": "Ban_an",
      "THOA_THUAN": "Thoa_thuan",
      "THUAN_TINH": "Thuan_tinh_LH",
      "DINH_CHI": "Dinh_chi",
      "TRA_HO_SO": "Tra_HS_DTBS",
      "VIEC_DAN_SU": "Viec_dan_su",
      "CHUYEN_DI": "Chuyen_di",
      "NHAP_VU": "Nhap_vu"
    };
    parts.push(kqMap[f.ketQua] || f.ketQua);
  }

  if (f.keyword && f.keyword.trim()) {
    var kwClean = window.removeAccents(f.keyword.trim()).replace(/[^a-zA-Z0-9]/g, '_').substring(0, 15);
    parts.push("Tim_" + kwClean);
  }

  var now = new Date();
  var dateStr = ("0" + now.getDate()).slice(-2) + "_" + ("0" + (now.getMonth() + 1)).slice(-2) + "_" + now.getFullYear();
  parts.push(dateStr);

  return parts.join("_") + ".xlsx";
}

window.xuatExcelDanhSachAn = function() {
  var dataList = window.G_FilteredCases || [];
  if (!dataList || dataList.length === 0) {
    AppUI.alert("Thông báo", "Hiện tại không có hồ sơ nào trong danh sách đang lọc để xuất Excel.");
    return;
  }

  var headers = [
    "Số thứ tự",
    "Số / Ngày thụ lý / Loại án",
    "Đương sự",
    "Quan hệ / Tội danh",
    "Tiến độ / Kết quả",
    "Ghi chú"
  ];

  var rows = [headers];

  for (var i = 0; i < dataList.length; i++) {
    var an = dataList[i];
    var stt = i + 1;
    var col2 = (an.soTL || "") + "\nNgày: " + (an.ngayTL || "---") + "\nLoại: " + (an.loaiAn || "");

    var col3 = "";
    if (an.nguyenDon) col3 += "Bên khởi kiện/yêu cầu: " + an.nguyenDon;
    if (an.biDon) col3 += (col3 ? "\n" : "") + "Bên bị kiện/bị yêu cầu: " + an.biDon;
    if (!col3 && an.chiTietDuongSu && an.chiTietDuongSu.length > 0) {
      col3 = an.chiTietDuongSu.map(function(d) {
        return (d.tuCach || "Đương sự") + ": " + (d.xungHo ? d.xungHo + " " : "") + d.hoTen + (d.namSinh ? " (SN " + d.namSinh + ")" : "");
      }).join("\n");
    }

    var col4 = an.quanHe || "";
    var col5 = "";
    if (an.liveStatus === "Đã giải quyết") {
      var resLines = String(an.ketQuaGiaiQuyet || "").split('\n');
      var loaiKq = resLines[0] || "Đã giải quyết";
      var soKq = resLines[1] || "---";
      var ngayKq = resLines[2] || "---";
      col5 = loaiKq + "\nSố: " + soKq + "\nNgày: " + ngayKq;
    } else {
      var dateHanStr = typeof dateVN === 'function' ? dateVN(an.rawHanDate) : (an.hanGQ || "---");
      col5 = (an.liveStatus || "Đang giải quyết") + "\nHạn: " + dateHanStr;
    }

    var col6 = an.ghiChu || "";
    rows.push([stt, col2, col3, col4, col5, col6]);
  }

  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(rows);

  ws['!cols'] = [
    { wch: 8 },   
    { wch: 25 },  
    { wch: 38 },  
    { wch: 30 },  
    { wch: 28 },  
    { wch: 22 }   
  ];

  XLSX.utils.book_append_sheet(wb, ws, "So_Thu_Ly");
  var fileName = buildExcelExportFileName();
  XLSX.writeFile(wb, fileName);

  AppUI.showToast("Đã xuất " + dataList.length + " hồ sơ ra file Excel thành công!", "success");
};
